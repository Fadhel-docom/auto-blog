<svg xmlns="http://www.w3.org/2000/svg" width="700" height="444" viewBox="0 0 700 444" role="img" aria-labelledby="t d"><title id="t">A layout for an extremely narrow room</title><desc id="d">A five-step left-to-right sequence for a very narrow laundry room: door, hampers, washer and dryer, folding surface, vertical storage, with a note to keep the walking path open.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C4622D"/></marker></defs><rect width="700" height="444" rx="24" fill="#F6F1E8"/><text x="40" y="48" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1F3A34" text-anchor="start">A layout for an extremely narrow room</text><text x="40" y="78" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5E6B66" text-anchor="start">Follow the sequence and keep the center walking path open.</text><rect x="40" y="122" width="108" height="92" rx="12" fill="#E6EEF2" stroke="#1F3A34" stroke-width="2"/><text x="94.0" y="174" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F3A34" text-anchor="middle">Door</text><rect x="168" y="122" width="108" height="92" rx="12" fill="#F3E3D3" stroke="#1F3A34" stroke-width="2"/><text x="222.0" y="174" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F3A34" text-anchor="middle">Hampers</text><rect x="296" y="122" width="108" height="92" rx="12" fill="#DCEBDD" stroke="#1F3A34" stroke-width="2"/><text x="350.0" y="162" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F3A34" text-anchor="middle">Washer</text><text x="350.0" y="182" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F3A34" text-anchor="middle">and dryer</text><rect x="424" y="122" width="108" height="92" rx="12" fill="#E6EEF2" stroke="#1F3A34" stroke-width="2"/><text x="478.0" y="162" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F3A34" text-anchor="middle">Folding</text><text x="478.0" y="182" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F3A34" text-anchor="middle">surface</text><rect x="552" y="122" width="108" height="92" rx="12" fill="#DCEBDD" stroke="#1F3A34" stroke-width="2"/><text x="606.0" y="162" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F3A34" text-anchor="middle">Vertical</text><text x="606.0" y="182" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F3A34" text-anchor="middle">storage</text><line x1="151" y1="168" x2="159" y2="168" stroke="#C4622D" stroke-width="2" marker-end="url(#ar)"/><line x1="279" y1="168" x2="287" y2="168" stroke="#C4622D" stroke-width="2" marker-end="url(#ar)"/><line x1="407" y1="168" x2="415" y2="168" stroke="#C4622D" stroke-width="2" marker-end="url(#ar)"/><line x1="535" y1="168" x2="543" y2="168" stroke="#C4622D" stroke-width="2" marker-end="url(#ar)"/><line x1="70" y1="252" x2="630" y2="252" stroke="#2F7F79" stroke-width="4" marker-end="url(#ar)" marker-start="url(#ar)"/><text x="350" y="282" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2F7F79" text-anchor="middle">Keep the center walking path open</text><rect x="40" y="312" width="197" height="98" rx="16" fill="#E6EEF2"/><text x="54" y="342" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F3A34" text-anchor="start">Wall above the</text><text x="54" y="363" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F3A34" text-anchor="start">machines</text><text x="54" y="388" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="start">Shelves for supplies.</text><rect x="251" y="312" width="197" height="98" rx="16" fill="#DCEBDD"/><text x="265" y="342" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F3A34" text-anchor="start">Back of the door</text><text x="265" y="367" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="start">Lightweight</text><text x="265" y="388" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="start">accessories only.</text><rect x="462" y="312" width="197" height="98" rx="16" fill="#F3E3D3"/><text x="476" y="342" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F3A34" text-anchor="start">One narrow</text><text x="476" y="363" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F3A34" text-anchor="start">basket</text><text x="476" y="388" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="start">For temporary items.</text></svg>
