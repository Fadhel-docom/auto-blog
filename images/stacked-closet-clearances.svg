<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 452' role='img' aria-labelledby='t d'><title id='t'>Example clearances for a stacked washer and dryer in a closet</title><desc id='d'>Front view of a closet with a dryer stacked on a washer, showing 1 inch at each side, 6 inches below the ceiling, a minimum opening of 25 5/8 inches wide and 73 inches high, and 33 3/4 inches deep for one compact model.</desc><rect x='0' y='0' width='700' height='452' rx='0' fill='#fbf9f4' stroke='none' stroke-width='1'/><text x='20' y='30' font-size='19' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Example clearances for one compact stacked pair</text><rect x='70' y='60' width='300' height='310' rx='0' fill='#ffffff' stroke='#5b6a4a' stroke-width='2'/><rect x='100' y='110' width='240' height='130' rx='0' fill='#e9eef2' stroke='#b8ad92' stroke-width='1'/><rect x='100' y='240' width='240' height='130' rx='0' fill='#e9eef2' stroke='#b8ad92' stroke-width='1'/><circle cx='220' cy='180' r='38' fill='#ffffff' stroke='#b8ad92' stroke-width='1.5'/><circle cx='220' cy='310' r='38' fill='#ffffff' stroke='#b8ad92' stroke-width='1.5'/><text x='220' y='130' font-size='13' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Dryer</text><text x='220' y='260' font-size='13' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Washer</text><line x1='220' y1='60' x2='220' y2='110' stroke='#5b6a4a' stroke-width='1.5'/><text x='230' y='90' font-size='13' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>6 in</text><text x='85' y='245' font-size='11' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>1 in</text><text x='355' y='245' font-size='11' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>1 in</text><line x1='56' y1='60' x2='56' y2='370' stroke='#5b6a4a' stroke-width='1.5'/><line x1='50' y1='60' x2='62' y2='60' stroke='#5b6a4a' stroke-width='1.5'/><line x1='50' y1='370' x2='62' y2='370' stroke='#5b6a4a' stroke-width='1.5'/><text x='8' y='220' font-size='13' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>73 in</text><line x1='70' y1='392' x2='370' y2='392' stroke='#5b6a4a' stroke-width='1.5'/><line x1='70' y1='386' x2='70' y2='398' stroke='#5b6a4a' stroke-width='1.5'/><line x1='370' y1='386' x2='370' y2='398' stroke='#5b6a4a' stroke-width='1.5'/><text x='220' y='414' font-size='13' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>25 5/8 in</text><rect x='410' y='60' width='270' height='310' rx='0' fill='#ffffff' stroke='#b8ad92' stroke-width='1'/><text x='426' y='90' font-size='16' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Opening needed</text><text x='426' y='124' font-size='15' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Width: 25 5/8 in</text><text x='426' y='143' font-size='12' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>(23 5/8 + 1 + 1)</text><text x='426' y='178' font-size='15' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Height: 73 in</text><text x='426' y='197' font-size='12' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>(67 + 6 below the ceiling)</text><text x='426' y='232' font-size='15' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Depth: 33 3/4 in</text><text x='426' y='251' font-size='12' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>(27 1/4 + 1 front + 5 1/2 back)</text><text x='426' y='300' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Your machines will differ.</text><text x='426' y='320' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Read the clearance page of</text><text x='426' y='340' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>your own manual. Not to scale.</text><text x='20' y='440' font-size='12' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Example from one LG compact heat pump dryer manual, not a rule for every machine.</text></svg>