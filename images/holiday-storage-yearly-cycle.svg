<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 500' role='img' aria-labelledby='t d'><title id='t'>Yearly cycle for holiday decorations</title><desc id='d'>Four steps in a loop: check and inspect, display, clean and pack, then edit by keeping, donating or discarding, before the same bins are used the next year.</desc><rect width='700' height='500' fill='#fbf9f4'/><text x='20' y='30' font-size='21' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>The yearly cycle: check, display, pack, edit</text><rect x='20' y='150' width='140' height='150' rx='10' fill='#fff0c9' stroke='#5b6a4a' stroke-width='2' opacity='1'/><text x='90' y='184' font-size='19' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>1 Check</text><text x='90' y='222' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Count what you own.</text><text x='90' y='244' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Inspect each light</text><text x='90' y='266' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>string before use.</text><rect x='190' y='150' width='140' height='150' rx='10' fill='#dbe6cf' stroke='#5b6a4a' stroke-width='2' opacity='1'/><text x='260' y='184' font-size='19' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>2 Display</text><text x='260' y='222' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Set up only what</text><text x='260' y='244' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>fits the season</text><text x='260' y='266' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>and your space.</text><rect x='360' y='150' width='140' height='150' rx='10' fill='#f3d9d9' stroke='#5b6a4a' stroke-width='2' opacity='1'/><text x='430' y='184' font-size='19' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>3 Pack</text><text x='430' y='222' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Clean, replace dead</text><text x='430' y='244' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>bulbs, wrap fragile</text><text x='430' y='266' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>pieces in tissue.</text><rect x='530' y='150' width='140' height='150' rx='10' fill='#ece7da' stroke='#5b6a4a' stroke-width='2' opacity='1'/><text x='600' y='184' font-size='19' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>4 Edit</text><text x='600' y='222' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Keep, donate or</text><text x='600' y='244' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>discard. Same bins</text><text x='600' y='266' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>next year.</text><line x1='164' y1='225' x2='186' y2='225' stroke='#2f3a2f' stroke-width='2.5'/><polygon points='186,225 176,229 176,220' fill='#2f3a2f'/><line x1='334' y1='225' x2='356' y2='225' stroke='#2f3a2f' stroke-width='2.5'/><polygon points='356,225 346,229 346,220' fill='#2f3a2f'/><line x1='504' y1='225' x2='526' y2='225' stroke='#2f3a2f' stroke-width='2.5'/><polygon points='526,225 516,229 516,220' fill='#2f3a2f'/><line x1='600' y1='300' x2='600' y2='350' stroke='#2f3a2f' stroke-width='2.5'/><line x1='600' y1='350' x2='90' y2='350' stroke='#2f3a2f' stroke-width='2.5'/><line x1='90' y1='350' x2='90' y2='306' stroke='#2f3a2f' stroke-width='2.5'/><polygon points='90,306 94,315 85,315' fill='#2f3a2f'/><text x='345' y='376' font-size='15' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Next year the cycle starts again</text><text x='20' y='478' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>A yearly cycle keeps the bin count from growing.</text></svg>