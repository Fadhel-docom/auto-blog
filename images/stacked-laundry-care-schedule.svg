<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 392' role='img' aria-labelledby='t d'><title id='t'>Care schedule for a stacked laundry closet</title><desc id='d'>Four cards: clean the lint filter every load, have the vent cleaned periodically, replace washer hoses every 3 to 5 years, and a suggested monthly check for drips.</desc><rect x='0' y='0' width='700' height='392' rx='0' fill='#fbf9f4' stroke='none' stroke-width='1'/><text x='20' y='30' font-size='19' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Care schedule for a stacked laundry closet</text><rect x='20' y='60' width='320' height='130' rx='0' fill='#ffffff' stroke='#b8ad92' stroke-width='1'/><rect x='20' y='60' width='320' height='40' rx='0' fill='#bfd9b0' stroke='#b8ad92' stroke-width='1'/><text x='36' y='87' font-size='16' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Every load</text><text x='36' y='135' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Clean the lint filter.</text><text x='36' y='158' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Never run the dryer without it.</text><rect x='360' y='60' width='320' height='130' rx='0' fill='#ffffff' stroke='#b8ad92' stroke-width='1'/><rect x='360' y='60' width='320' height='40' rx='0' fill='#f1e3a6' stroke='#b8ad92' stroke-width='1'/><text x='376' y='87' font-size='16' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Periodically</text><text x='376' y='135' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Have the vent duct cleaned,</text><text x='376' y='158' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>and whenever drying takes longer.</text><rect x='20' y='210' width='320' height='130' rx='0' fill='#ffffff' stroke='#b8ad92' stroke-width='1'/><rect x='20' y='210' width='320' height='40' rx='0' fill='#e9eef2' stroke='#b8ad92' stroke-width='1'/><text x='36' y='237' font-size='16' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Every 3 to 5 years</text><text x='36' y='285' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Replace the washer hoses; sooner</text><text x='36' y='308' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>if cracked or bulging (State Farm).</text><rect x='360' y='210' width='320' height='130' rx='0' fill='#ffffff' stroke='#b8ad92' stroke-width='1'/><rect x='360' y='210' width='320' height='40' rx='0' fill='#e8b4a8' stroke='#b8ad92' stroke-width='1'/><text x='376' y='237' font-size='16' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Monthly (our suggestion)</text><text x='376' y='285' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Look for drips and damp on the</text><text x='376' y='308' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>closet floor; test the water sensor.</text><text x='20' y='375' font-size='12' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Lint and vent: US Fire Administration. Hoses: State Farm. Monthly check: our suggestion.</text></svg>