<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Linen closet door clearance check</title>
<desc id="desc">A simple process diagram showing how to check door, shelf, hinge, and organizer clearance before adding door storage.</desc>
<rect width="1200" height="700" fill="#f7f5ef"/>
<rect x="90" y="90" width="250" height="500" rx="12" fill="#e7dfd2" stroke="#5f5a52" stroke-width="5"/>
<rect x="180" y="155" width="70" height="350" fill="#d8c8b5" stroke="#5f5a52" stroke-width="4"/>
<path d="M340 350 H520" stroke="#5f5a52" stroke-width="8"/>
<path d="M500 330 L530 350 L500 370" fill="none" stroke="#5f5a52" stroke-width="8"/>
<rect x="560" y="150" width="420" height="400" rx="16" fill="#fff" stroke="#5f5a52" stroke-width="5"/>
<line x1="620" y1="230" x2="920" y2="230" stroke="#8b8176" stroke-width="5"/>
<line x1="620" y1="350" x2="920" y2="350" stroke="#8b8176" stroke-width="5"/>
<line x1="620" y1="470" x2="920" y2="470" stroke="#8b8176" stroke-width="5"/>
<rect x="650" y="180" width="90" height="35" rx="6" fill="#d9c9b6"/>
<rect x="770" y="300" width="110" height="35" rx="6" fill="#d9c9b6"/>
<rect x="650" y="420" width="130" height="35" rx="6" fill="#d9c9b6"/>
<text x="600" y="115" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#403b35">Check clearance before adding door storage</text>
<text x="110" y="635" font-family="Arial,sans-serif" font-size="25" fill="#403b35">1. Door swing</text>
<text x="405" y="635" font-family="Arial,sans-serif" font-size="25" fill="#403b35">2. Shelf depth</text>
<text x="720" y="635" font-family="Arial,sans-serif" font-size="25" fill="#403b35">3. Hinge + organizer space</text>
</svg>