<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t1 d1"><title id="t1">Small kitchen zone plan</title><desc id="d1">Top view of a small L-shaped kitchen with sink, stove and refrigerator joined by a work triangle, a prep area beside the sink and an open aisle.</desc><rect width="800" height="420" fill="#fbf7f1"/><rect x="40" y="40" width="440" height="340" rx="0" fill="#fffdf9" stroke="#5b4a3a" stroke-width="6"/><rect x="46" y="46" width="428" height="70" rx="4" fill="#e8d5b7" stroke="#8a6a3b" stroke-width="3"/><rect x="46" y="116" width="70" height="200" rx="4" fill="#e8d5b7" stroke="#8a6a3b" stroke-width="3"/><rect x="150" y="56" width="100" height="50" rx="4" fill="#d4e7ee" stroke="#3d6f80" stroke-width="3"/><text x="200" y="86" font-size="16" font-weight="bold" fill="#24505f" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Sink</text><rect x="280" y="56" width="100" height="50" rx="4" fill="#f3dccf" stroke="#b5683c" stroke-width="3"/><text x="330" y="86" font-size="16" font-weight="bold" fill="#8d4a22" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Stove</text><rect x="52" y="326" width="80" height="50" rx="4" fill="#e7f0d9" stroke="#6f9a3a" stroke-width="3"/><text x="92" y="356" font-size="16" font-weight="bold" fill="#456b1d" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Fridge</text><path d="M200 106 L330 106 L110 330 Z" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="9 6"/><rect x="150" y="112" width="100" height="12" rx="3" fill="#fff2b8" stroke="#c8a600" stroke-width="2"/><text x="200" y="150" font-size="15" font-weight="bold" fill="#7a6400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Prep: 36 x 24 in</text><line x1="130" y1="250" x2="470" y2="250" stroke="#2e8b57" stroke-width="3"/><text x="300" y="240" font-size="16" font-weight="bold" fill="#256b43" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Open aisle</text><rect x="520" y="40" width="250" height="340" rx="10" fill="#fff" stroke="#d9cdbd" stroke-width="2"/><text x="540" y="74" font-size="19" font-weight="bold" fill="#3b2f23" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Read the plan</text><circle cx="546" cy="108" r="8" fill="#c0392b"/><text x="564" y="114" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Red: sink, stove, fridge</text><text x="564" y="136" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">a short step apart</text><circle cx="546" cy="178" r="8" fill="#c8a600"/><text x="564" y="184" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Yellow: one clear prep</text><text x="564" y="206" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">spot beside the sink</text><circle cx="546" cy="248" r="8" fill="#2e8b57"/><text x="564" y="254" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Green: keep the aisle</text><text x="564" y="276" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">free of bins and carts</text></svg>