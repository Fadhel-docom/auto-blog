<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t2 d2"><title id="t2">Three height zones for bedroom storage</title><desc id="d2">Side view of a wall shelf and a dresser. Light, rarely used items go high, daily items sit at reach height, and heavy items stay low. The tall dresser is anchored to the wall.</desc>
<rect width="800" height="470" fill="#fbf7f1"/>
<rect x="40" y="30" width="14" height="390" fill="#d9cdbd"/><rect x="40" y="420" width="720" height="10" fill="#8a6a3b"/>
<rect x="54" y="40" width="250" height="150" fill="#e7f0d9" stroke="#6f9a3a" stroke-width="2"/>
<rect x="54" y="190" width="250" height="130" fill="#d4e7ee" stroke="#3d6f80" stroke-width="2"/>
<rect x="54" y="320" width="250" height="100" fill="#f3dccf" stroke="#b5683c" stroke-width="2"/>
<rect x="74" y="100" width="90" height="70" rx="4" fill="#ffffff" stroke="#6f9a3a" stroke-width="2"/><rect x="180" y="120" width="100" height="50" rx="4" fill="#ffffff" stroke="#6f9a3a" stroke-width="2"/>
<rect x="74" y="250" width="70" height="55" rx="4" fill="#ffffff" stroke="#3d6f80" stroke-width="2"/><rect x="160" y="270" width="60" height="35" rx="4" fill="#ffffff" stroke="#3d6f80" stroke-width="2"/>
<rect x="74" y="350" width="120" height="60" rx="4" fill="#ffffff" stroke="#b5683c" stroke-width="2"/><rect x="206" y="365" width="80" height="45" rx="4" fill="#ffffff" stroke="#b5683c" stroke-width="2"/>
<path d="M54 330 h-12" stroke="#c0392b" stroke-width="5"/><text x="48" y="452" font-size="15" font-weight="normal" fill="#c0392b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Wall strap or bracket keeps tall furniture from tipping</text>
<text x="330" y="64" font-size="19" font-weight="bold" fill="#456b1d" text-anchor="start" font-family="Arial, Helvetica, sans-serif">HIGH: light and rare</text><text x="330" y="90" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">spare bedding, off-season</text><text x="330" y="112" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">scarves, empty luggage</text>
<text x="330" y="214" font-size="19" font-weight="bold" fill="#24505f" text-anchor="start" font-family="Arial, Helvetica, sans-serif">REACH HEIGHT: daily</text><text x="330" y="240" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">tomorrow's clothes, charger,</text><text x="330" y="262" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">book, glasses, keys</text>
<text x="330" y="344" font-size="19" font-weight="bold" fill="#8d4a22" text-anchor="start" font-family="Arial, Helvetica, sans-serif">LOW: heavy</text><text x="330" y="370" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">shoes, boxes, laundry</text><text x="330" y="392" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">basket, under-bed bins</text>
</svg>