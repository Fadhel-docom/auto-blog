<svg xmlns="http://www.w3.org/2000/svg" width="700" height="672" viewBox="0 0 700 672" role="img" aria-labelledby="t d"><title id="t">Keep tops and service points clear</title><desc id="d">Front view of a washer and dryer with numbered markers: clear appliance tops, the dryer lint filter and surrounding area, and a dashed service path for valves, outlets, hoses and vents.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C4622D"/></marker></defs><rect width="700" height="672" rx="24" fill="#F6F1E8"/><text x="40" y="48" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1F3A34" text-anchor="start">Keep tops and service points clear</text><text x="40" y="78" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5E6B66" text-anchor="start">A tidy room still has to leave the machines reachable.</text><rect x="110" y="172" width="170" height="130" rx="8" fill="#FFFFFF" stroke="#1F3A34" stroke-width="3"/><rect x="300" y="172" width="170" height="130" rx="8" fill="#FFFFFF" stroke="#1F3A34" stroke-width="3"/><rect x="110" y="162" width="170" height="10" rx="3" fill="#D9D2C3" stroke="#1F3A34" stroke-width="2"/><rect x="300" y="162" width="170" height="10" rx="3" fill="#D9D2C3" stroke="#1F3A34" stroke-width="2"/><circle cx="195" cy="237" r="36" fill="none" stroke="#1F3A34" stroke-width="3"/><circle cx="385" cy="237" r="36" fill="none" stroke="#1F3A34" stroke-width="3"/><text x="195" y="144" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="middle">Washer</text><text x="385" y="144" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="middle">Dryer</text><rect x="500" y="152" width="160" height="170" rx="10" fill="none" stroke="#C4622D" stroke-width="3" stroke-dasharray="8 6"/><text x="580" y="182" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#C4622D" text-anchor="middle">Service path</text><text x="580" y="212" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="middle">Valve, outlet,</text><text x="580" y="232" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="middle">hose, vent</text><circle cx="94" cy="167" r="15" fill="#C4622D"/><text x="94" y="173" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><circle cx="425" cy="312" r="15" fill="#C4622D"/><text x="425" y="318" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><circle cx="540" cy="292" r="15" fill="#C4622D"/><text x="540" y="298" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><rect x="40" y="348" width="620" height="83" rx="16" fill="#E6EEF2"/><circle cx="70" cy="373.9" r="15" fill="#2F7F79"/><text x="70" y="379.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F6F1E8" text-anchor="middle">1</text><text x="100" y="382" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F3A34" text-anchor="start">Appliance tops</text><text x="100" y="407" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="start">Nothing lives on top unless it has a defined reason to be there.</text><rect x="40" y="441" width="620" height="104" rx="16" fill="#F3E3D3"/><circle cx="70" cy="466.9" r="15" fill="#2F7F79"/><text x="70" y="472.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F6F1E8" text-anchor="middle">2</text><text x="100" y="475" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F3A34" text-anchor="start">Dryer</text><text x="100" y="500" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="start">Clean the lint filter after every load and keep the area around the dryer</text><text x="100" y="521" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="start">clear of things that can burn.</text><rect x="40" y="555" width="620" height="83" rx="16" fill="#DCEBDD"/><circle cx="70" cy="580.9" r="15" fill="#2F7F79"/><text x="70" y="586.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F6F1E8" text-anchor="middle">3</text><text x="100" y="589" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F3A34" text-anchor="start">Service path</text><text x="100" y="614" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="start">Keep every shut-off valve, outlet, hose, vent and connection reachable.</text></svg>
