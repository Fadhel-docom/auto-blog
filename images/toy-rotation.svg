<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d"><title id="t">A simple toy rotation</title><desc id="d">Three boxes in a loop: toys out on the shelf, a next-up box in the closet, and an archive of rarely used toys, with a swap between them.</desc><rect width="800" height="400" fill="#faf6ef"/><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5522f"/></marker></defs><text x="400.0" y="36" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#23363a">A simple toy rotation</text><text x="400.0" y="60" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#55696a">Few toys out, the rest rotate in</text><rect x="40" y="110" width="220" height="210" rx="10" fill="#fff" stroke="#2f6f62" stroke-width="2"/><text x="150" y="150" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#23363a">Out now</text><text x="150" y="182" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#b5522f">A small set on the low shelf</text><text x="150" y="222" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#55696a">Toys the child can reach</text><text x="150" y="242" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#55696a">today</text><rect x="290" y="110" width="220" height="210" rx="10" fill="#fff" stroke="#2f6f62" stroke-width="2"/><text x="400" y="150" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#23363a">Next up</text><text x="400" y="182" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#b5522f">One closed bin in a closet</text><text x="400" y="222" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#55696a">Ready to swap in</text><rect x="540" y="110" width="220" height="210" rx="10" fill="#fff" stroke="#2f6f62" stroke-width="2"/><text x="650" y="150" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#23363a">Archive</text><text x="650" y="182" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#b5522f">Higher shelf, adult reach</text><text x="650" y="222" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#55696a">Rarely used or outgrown:</text><text x="650" y="242" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#55696a">keep, donate or pass on</text><line x1="262" y1="215" x2="288" y2="215" stroke="#b5522f" stroke-width="3" marker-end="url(#a)"/><line x1="512" y1="215" x2="538" y2="215" stroke="#b5522f" stroke-width="3" marker-end="url(#a)"/><text x="400" y="360" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#55696a">Swap on a schedule that suits your household; watch what your child reaches for.</text></svg>