<svg xmlns="http://www.w3.org/2000/svg" width="700" height="626" viewBox="0 0 700 626" role="img" aria-labelledby="t d"><title id="t">Use the door, not the wall</title><desc id="d">Inside face of a cabinet door with a tension rod holding hanging lids and boards and a row of adhesive hooks holding mugs, next to notes on rated load and surfaces.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C4622D"/></marker></defs><rect width="700" height="626" rx="24" fill="#F6F1E8"/><text x="40" y="48" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1F3A34" text-anchor="start">Use the door, not the wall</text><text x="40" y="78" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5E6B66" text-anchor="start">Tension rods and adhesive hooks leave no holes.</text><rect x="50" y="122" width="300" height="250" rx="8" fill="#FFFFFF" stroke="#1F3A34" stroke-width="3"/><line x1="70" y1="172" x2="330" y2="172" stroke="#2F7F79" stroke-width="7"/><rect x="62" y="162" width="10" height="20" rx="3" fill="#2F7F79"/><rect x="328" y="162" width="10" height="20" rx="3" fill="#2F7F79"/><rect x="96" y="180" width="36" height="96" rx="5" fill="#F3E3D3" stroke="#1F3A34" stroke-width="2"/><rect x="146" y="180" width="36" height="96" rx="5" fill="#F3E3D3" stroke="#1F3A34" stroke-width="2"/><rect x="196" y="180" width="36" height="96" rx="5" fill="#F3E3D3" stroke="#1F3A34" stroke-width="2"/><rect x="246" y="180" width="36" height="96" rx="5" fill="#F3E3D3" stroke="#1F3A34" stroke-width="2"/><line x1="70" y1="312" x2="330" y2="312" stroke="#D9D2C3" stroke-width="6"/><circle cx="100" cy="318" r="6" fill="#2F7F79"/><rect x="84" y="328" width="32" height="30" rx="6" fill="#E6EEF2" stroke="#1F3A34" stroke-width="2"/><circle cx="170" cy="318" r="6" fill="#2F7F79"/><rect x="154" y="328" width="32" height="30" rx="6" fill="#E6EEF2" stroke="#1F3A34" stroke-width="2"/><circle cx="240" cy="318" r="6" fill="#2F7F79"/><rect x="224" y="328" width="32" height="30" rx="6" fill="#E6EEF2" stroke="#1F3A34" stroke-width="2"/><text x="200" y="156" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F3A34" text-anchor="middle">12 in tension rod</text><rect x="380" y="122" width="280" height="99" rx="16" fill="#E6EEF2"/><text x="394" y="153" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F3A34" text-anchor="start">Tension rod</text><text x="394" y="178" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="start">A 12 in rod spans a cabinet door</text><text x="394" y="199" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="start">and holds lids or cutting boards.</text><rect x="380" y="233" width="280" height="141" rx="16" fill="#DCEBDD"/><text x="394" y="264" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F3A34" text-anchor="start">Adhesive hooks</text><text x="394" y="289" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="start">Rated load is printed per</text><text x="394" y="310" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="start">product. 3M lists a medium</text><text x="394" y="331" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="start">Command hook at 3 lb and a</text><text x="394" y="352" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="start">large double hook at 4 lb.</text><rect x="380" y="386" width="280" height="120" rx="16" fill="#F3E3D3"/><text x="394" y="417" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F3A34" text-anchor="start">Surface check</text><text x="394" y="442" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="start">Use on smooth surfaces, not</text><text x="394" y="463" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="start">wallpaper. On textured paint,</text><text x="394" y="484" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="start">test one hook first.</text><rect x="40" y="524" width="620" height="68" rx="14" fill="#1F3A34"/><text x="56" y="553" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#F6F1E8" text-anchor="start">Follow the exact surface and load instructions on the package for</text><text x="56" y="577" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#F6F1E8" text-anchor="start">every adhesive or clamp piece.</text></svg>
