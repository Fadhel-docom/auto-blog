<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-labelledby="t d"><title id="t">Keep shoes dry, keep air moving</title><desc id="d">Four steps from an entry tray for wet shoes to drying fully, an open rack and a monthly check for musty smells and humidity above 60 percent, with a note on louvered doors.</desc><rect width="800" height="540" fill="#faf6ef"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f62"/></marker></defs><text x="400" y="36" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#23363a">Keep shoes dry, keep air moving</text><text x="400" y="60" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#55696a">From the front door to the rack</text><rect x="20" y="120" width="175" height="250" rx="10" fill="#fff" stroke="#23363a" stroke-width="2"/><rect x="20" y="120" width="175" height="50" rx="10" fill="#e6efd2" stroke="#2f6f62" stroke-width="2"/><text x="107" y="151" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#23363a">Entry tray</text><text x="107" y="215" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#23363a">Wet shoes land here,</text><text x="107" y="235" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#23363a">not in the closet</text><text x="107" y="345" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#55696a">Step 1</text><line x1="198" y1="245" x2="214" y2="245" stroke="#2f6f62" stroke-width="3" marker-end="url(#a)"/><rect x="215" y="120" width="175" height="250" rx="10" fill="#fff" stroke="#23363a" stroke-width="2"/><rect x="215" y="120" width="175" height="50" rx="10" fill="#e6efd2" stroke="#2f6f62" stroke-width="2"/><text x="302" y="151" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#23363a">Dry fully</text><text x="302" y="215" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#23363a">Insoles out, shoes</text><text x="302" y="235" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#23363a">off the floor</text><text x="302" y="345" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#55696a">Step 2</text><line x1="393" y1="245" x2="409" y2="245" stroke="#2f6f62" stroke-width="3" marker-end="url(#a)"/><rect x="410" y="120" width="175" height="250" rx="10" fill="#fff" stroke="#23363a" stroke-width="2"/><rect x="410" y="120" width="175" height="50" rx="10" fill="#e6efd2" stroke="#2f6f62" stroke-width="2"/><text x="497" y="151" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#23363a">Open rack</text><text x="497" y="215" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#23363a">Air moves, nothing</text><text x="497" y="235" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#23363a">sits on the floor</text><text x="497" y="345" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#55696a">Step 3</text><line x1="588" y1="245" x2="604" y2="245" stroke="#2f6f62" stroke-width="3" marker-end="url(#a)"/><rect x="605" y="120" width="175" height="250" rx="10" fill="#fff" stroke="#23363a" stroke-width="2"/><rect x="605" y="120" width="175" height="50" rx="10" fill="#fbe9e1" stroke="#b5522f" stroke-width="2"/><text x="692" y="151" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#23363a">Check monthly</text><text x="692" y="215" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#23363a">Musty smell? Humidity</text><text x="692" y="235" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#23363a">above 60 percent?</text><text x="692" y="345" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#55696a">Step 4</text><rect x="60" y="400" width="680" height="56" rx="8" fill="#fff" stroke="#2f6f62" stroke-width="2"/><text x="400" y="424" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#23363a">Louvered or vented doors and open shelving keep a closet drier</text><text x="400" y="444" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#55696a">A solid sliding door needs more help: open it on dry days and do not pack the closet shut</text><text x="400" y="500" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#23363a">Damp shoes are the most common way moisture gets into a closet</text></svg>