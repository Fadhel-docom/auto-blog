<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" role="img" aria-labelledby="t d"><title id="t">Your first pass: five moves in order</title><desc id="d">Five-step order for organizing a small home: sort, zone, measure, buy, reset.</desc><rect width="800" height="250" fill="#faf6ef"/><text x="400.0" y="38" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#23363a">Your first pass: five moves in order</text><text x="400.0" y="62" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#55696a">Do not buy storage before step four</text><rect x="24" y="90" width="142" height="140" rx="10" fill="#dbe9e4" stroke="#2f6f62" stroke-width="1.5"/><text x="95.2" y="116" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#2f6f62">1 Sort</text><text x="95.2" y="142" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#23363a">Keep, move, donate,</text><text x="95.2" y="158" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#23363a">trash. 15-minute</text><text x="95.2" y="174" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#23363a">timer</text><rect x="176" y="90" width="142" height="140" rx="10" fill="#f3e3c8" stroke="#2f6f62" stroke-width="1.5"/><text x="247.60000000000002" y="116" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#2f6f62">2 Zone</text><text x="247.60000000000002" y="142" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#23363a">Give each area one</text><text x="247.60000000000002" y="158" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#23363a">job</text><rect x="329" y="90" width="142" height="140" rx="10" fill="#e4dcef" stroke="#2f6f62" stroke-width="1.5"/><text x="400.0" y="116" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#2f6f62">3 Measure</text><text x="400.0" y="142" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#23363a">Width, depth,</text><text x="400.0" y="158" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#23363a">height, door swing</text><rect x="481" y="90" width="142" height="140" rx="10" fill="#f6d9d0" stroke="#2f6f62" stroke-width="1.5"/><text x="552.4000000000001" y="116" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#2f6f62">4 Buy</text><text x="552.4000000000001" y="142" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#23363a">Only what the</text><text x="552.4000000000001" y="158" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#23363a">measurements require</text><rect x="634" y="90" width="142" height="140" rx="10" fill="#d9e6f2" stroke="#2f6f62" stroke-width="1.5"/><text x="704.8000000000001" y="116" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#2f6f62">5 Reset</text><text x="704.8000000000001" y="142" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#23363a">Ten minutes, once a</text><text x="704.8000000000001" y="158" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#23363a">week</text></svg>