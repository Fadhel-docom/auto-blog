<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 500' role='img' aria-labelledby='t d'><title id='t'>Plan of a 5 by 5 foot home office corner</title><desc id='d'>Top view of a 60 by 60 inch corner with a 60 by 20 inch desk along the wall, a chair, a 30 by 48 inch clear floor space in front that reaches about 8 inches past the corner, and a 36 inch walking path beside it.</desc><rect width='700' height='500' fill='#fbf9f4'/><text x='20' y='30' font-size='21' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Plan view of a 5 × 5 ft office corner (example)</text><rect x='120' y='150' width='120' height='192' rx='6' fill='#dbe6cf' stroke='#5b6a4a' stroke-width='3' opacity='0.8' stroke-dasharray='10 6'/><rect x='320' y='150' width='144' height='192' rx='4' fill='#f4efe0' stroke='#8a6a3b' stroke-width='2' opacity='1' stroke-dasharray='8 5'/><rect x='60' y='70' width='240' height='240' rx='0' fill='none' stroke='#8a7a5c' stroke-width='2' opacity='1' stroke-dasharray='4 4'/><rect x='60' y='70' width='240' height='80' rx='2' fill='#e4dccb' stroke='#8a7a5c' stroke-width='3' opacity='1'/><text x='180' y='116' font-size='16' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Desk 60 × 20 in</text><rect x='132' y='134' width='96' height='96' rx='16' fill='#d8d2c4' stroke='#5b6a4a' stroke-width='3' opacity='1'/><text x='180' y='188' font-size='16' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Chair</text><text x='180' y='262' font-size='17' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>30 × 48 in</text><text x='180' y='284' font-size='15' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>clear floor</text><line x1='60' y1='70' x2='60' y2='360' stroke='#7a6a4f' stroke-width='6'/><line x1='60' y1='70' x2='470' y2='70' stroke='#7a6a4f' stroke-width='6'/><text x='64' y='60' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Corner: 60 × 60 in</text><line x1='320' y1='246' x2='464' y2='246' stroke='#8a6a3b' stroke-width='2.5'/><polygon points='320,246 331,240 331,252' fill='#8a6a3b'/><polygon points='464,246 453,240 453,252' fill='#8a6a3b'/><text x='392' y='236' font-size='16' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>36 in</text><text x='392' y='268' font-size='14' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>walking path</text><text x='64' y='368' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>The clear space reaches about 8 in past the 5 ft corner.</text><rect x='490' y='80' width='18' height='18' rx='3' fill='#e4dccb' stroke='#8a7a5c' stroke-width='2' opacity='1'/><text x='516' y='95' font-size='16' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Desk</text><rect x='490' y='112' width='18' height='18' rx='3' fill='#d8d2c4' stroke='#5b6a4a' stroke-width='2' opacity='1'/><text x='516' y='127' font-size='16' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Chair</text><rect x='490' y='144' width='18' height='18' rx='3' fill='#dbe6cf' stroke='#5b6a4a' stroke-width='2' opacity='1' stroke-dasharray='4 3'/><text x='516' y='159' font-size='16' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Chair pull-out space</text><text x='516' y='178' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>30 × 48 in benchmark</text><rect x='490' y='200' width='18' height='18' rx='3' fill='#f4efe0' stroke='#8a6a3b' stroke-width='2' opacity='1' stroke-dasharray='4 3'/><text x='516' y='215' font-size='16' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Walking path</text><text x='516' y='234' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>36 in benchmark</text><text x='490' y='400' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Sizes are planning examples.</text><text x='490' y='420' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Measure your own corner,</text><text x='490' y='440' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>desk and chair.</text></svg>