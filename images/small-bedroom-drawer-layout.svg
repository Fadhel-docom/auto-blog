<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t8 d8"><title id="t8">Under-bed drawer layout</title><desc id="d8">Top view of a bed with two drawers under the foot end that pull out toward the foot of the bed, with the center left free for the frame support.</desc><rect width="800" height="400" fill="#fbf7f1"/><rect x="40" y="40" width="440" height="340" rx="0" fill="#fffdf9" stroke="#5b4a3a" stroke-width="6"/><rect x="100" y="46" width="280" height="300" rx="8" fill="#cfe3ea" stroke="#3d6f80" stroke-width="3"/><rect x="110" y="200" width="100" height="140" rx="4" fill="#ffffff" stroke="#2e8b57" stroke-width="3"/><text x="160" y="276" font-size="16" font-weight="bold" fill="#256b43" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Drawer</text><rect x="270" y="200" width="100" height="140" rx="4" fill="#ffffff" stroke="#2e8b57" stroke-width="3"/><text x="320" y="276" font-size="16" font-weight="bold" fill="#256b43" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Drawer</text><path d="M160 342 v22 M320 342 v22" stroke="#2e8b57" stroke-width="3"/><path d="M150 358 l10 14 l10 -14 z M310 358 l10 14 l10 -14 z" fill="#2e8b57"/><text x="240" y="150" font-size="18" font-weight="bold" fill="#24505f" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Bed (top view)</text><rect x="520" y="40" width="250" height="340" rx="10" fill="#fff" stroke="#d9cdbd" stroke-width="2"/><text x="540" y="74" font-size="19" font-weight="bold" fill="#3b2f23" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Layout notes</text><text x="540" y="108" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Drawers pull out at the foot</text><text x="540" y="136" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Leave the center free</text><text x="540" y="164" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">for the frame support</text><text x="540" y="192" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Allow room to pull each</text><text x="540" y="220" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">drawer fully open</text><text x="540" y="248" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">before you build</text></svg>