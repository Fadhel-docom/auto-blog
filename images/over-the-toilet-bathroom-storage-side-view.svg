<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="t d">
<title id="t">Side view of storage above a toilet</title><desc id="d">Side-view schematic: the tank lid lifts clear below a shelf of depth D, a seated head zone is marked in front of the shelf, and a cardboard mock-up test is listed.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#37443b"/></marker></defs>
<rect width="1000" height="520" fill="#fff"/>
<text x="500" y="38" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#37443b">Side view: protect the lid, the head and the flush</text>
<line x1="120" y1="60" x2="120" y2="420" stroke="#37443b" stroke-width="5"/>
<text x="120" y="448" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#58655b">Wall</text>
<line x1="60" y1="420" x2="900" y2="420" stroke="#8c9a8c" stroke-width="3"/>
<rect x="122" y="255" width="150" height="165" rx="10" fill="#e8eef2" stroke="#6d8aa3" stroke-width="3"/>
<rect x="120" y="236" width="170" height="18" rx="6" fill="#d6e0e8" stroke="#6d8aa3" stroke-width="3"/>
<text x="205" y="350" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#37443b">Tank</text>
<path d="M122 420 L122 380 Q300 380 420 400 Q440 420 420 420 Z" fill="#e8eef2" stroke="#6d8aa3" stroke-width="3"/>
<line x1="205" y1="230" x2="205" y2="160" stroke="#4d6b55" stroke-width="3" marker-end="url(#a)"/>
<text x="215" y="196" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#4d6b55">lid lifts or slides clear</text>
<rect x="122" y="100" width="125" height="12" rx="0" fill="#d7b58c" stroke="#9b7955" stroke-width="2"/>
<text x="185" y="92" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#37443b">shelf, depth D</text>
<rect x="122" y="112" width="10" height="56" rx="0" fill="#9b7955" stroke="#9b7955" stroke-width="1"/>
<circle cx="470" cy="200" r="42" fill="#f1e6d8" stroke="#9b7955" stroke-width="2"/>
<path d="M470 242 L470 330 L545 330" fill="none" stroke="#9b7955" stroke-width="18"/>
<text x="480" y="150" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#b5533c">seated head zone</text>
<line x1="300" y1="112" x2="300" y2="236" stroke="#37443b" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="312" y="176" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#b5533c">E</text>
<text x="640" y="250" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#37443b">Mock-up test</text>
<text x="640" y="282" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#37443b">1  Cut cardboard to depth D</text>
<text x="640" y="310" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#37443b">2  Sit, stand, reach the flush</text>
<text x="640" y="338" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#37443b">3  Lift the tank lid fully</text>
<text x="640" y="366" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#37443b">4  Reduce D or raise the shelf if tight</text>
<text x="500" y="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#58655b">Schematic sketch, not to scale. E = space between the lid top and the underside of the lowest shelf.</text>

</svg>
