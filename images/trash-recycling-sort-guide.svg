<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d"><title id="t">Where does it go?</title><desc id="d">A four-row guide matching food scraps to a counter crock, clean empty containers to the recycling bin, batteries and rechargeable devices to a drop-off and greasy or uncertain items to the trash.</desc><rect width="800" height="560" fill="#faf6ef"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f62"/></marker></defs><text x="400" y="36" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#23363a">Where does it go?</text><text x="400" y="60" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#55696a">A quick sort for the kitchen</text><rect x="30" y="95" width="330" height="80" rx="8" fill="#fff" stroke="#23363a" stroke-width="2"/><text x="195" y="141" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#23363a">Food scraps</text><line x1="366" y1="135" x2="430" y2="135" stroke="#2f6f62" stroke-width="3" marker-end="url(#a)"/><rect x="436" y="95" width="334" height="80" rx="8" fill="#e6efd2" stroke="#2f6f62" stroke-width="2"/><text x="603" y="129" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#23363a">Counter crock, then a collection</text><text x="603" y="149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#23363a">or drop-off program</text><rect x="30" y="200" width="330" height="80" rx="8" fill="#fff" stroke="#23363a" stroke-width="2"/><text x="195" y="234" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#23363a">Empty, spatula-clean bottle,</text><text x="195" y="254" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#23363a">can, jar, paper, flat box</text><line x1="366" y1="240" x2="430" y2="240" stroke="#2f6f62" stroke-width="3" marker-end="url(#a)"/><rect x="436" y="200" width="334" height="80" rx="8" fill="#e6efd2" stroke="#2f6f62" stroke-width="2"/><text x="603" y="234" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#23363a">Recycling bin (check your local</text><text x="603" y="254" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#23363a">rules)</text><rect x="30" y="305" width="330" height="80" rx="8" fill="#fff" stroke="#23363a" stroke-width="2"/><text x="195" y="351" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#23363a">Battery or rechargeable device</text><line x1="366" y1="345" x2="430" y2="345" stroke="#b5522f" stroke-width="3" marker-end="url(#a)"/><rect x="436" y="305" width="334" height="80" rx="8" fill="#fbe9e1" stroke="#b5522f" stroke-width="2"/><text x="603" y="339" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#23363a">Neither bin: retailer or</text><text x="603" y="359" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#23363a">hazardous waste drop-off</text><rect x="30" y="410" width="330" height="80" rx="8" fill="#fff" stroke="#23363a" stroke-width="2"/><text x="195" y="444" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#23363a">Greasy, food-soaked or not</text><text x="195" y="464" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#23363a">sure</text><line x1="366" y1="450" x2="430" y2="450" stroke="#23363a" stroke-width="3" marker-end="url(#a)"/><rect x="436" y="410" width="334" height="80" rx="8" fill="#f3e3c8" stroke="#23363a" stroke-width="2"/><text x="603" y="456" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#23363a">Trash bin</text><text x="400" y="530" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#23363a">When in doubt about recycling, the trash is the safer bin</text></svg>