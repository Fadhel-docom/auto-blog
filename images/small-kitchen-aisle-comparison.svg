<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t11 d11"><title id="t11">Cart versus wall rail in a small kitchen aisle</title><desc id="d11">Two top views of a small kitchen. On the left a rolling cart blocks the aisle between counters. On the right the same tools hang on a wall rail and the aisle stays open.</desc><rect width="800" height="380" fill="#fbf7f1"/><text x="190" y="40" font-size="20" font-weight="bold" fill="#8d4a22" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Cart in the gap</text><text x="600" y="40" font-size="20" font-weight="bold" fill="#256b43" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Wall rail instead</text><rect x="40" y="60" width="330" height="60" rx="4" fill="#e8d5b7" stroke="#8a6a3b" stroke-width="3"/><rect x="40" y="250" width="330" height="60" rx="4" fill="#e8d5b7" stroke="#8a6a3b" stroke-width="3"/><rect x="150" y="175" width="110" height="70" rx="4" fill="#f3dccf" stroke="#b5683c" stroke-width="3"/><text x="205" y="216" font-size="16" font-weight="bold" fill="#8d4a22" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Cart</text><line x1="50" y1="150" x2="360" y2="150" stroke="#c0392b" stroke-width="3" stroke-dasharray="8 6"/><text x="205" y="142" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Aisle blocked</text><rect x="430" y="60" width="330" height="60" rx="4" fill="#e8d5b7" stroke="#8a6a3b" stroke-width="3"/><rect x="430" y="250" width="330" height="60" rx="4" fill="#e8d5b7" stroke="#8a6a3b" stroke-width="3"/><rect x="460" y="125" width="270" height="16" rx="4" fill="#d4e7ee" stroke="#3d6f80" stroke-width="2"/><text x="595" y="160" font-size="15" font-weight="bold" fill="#24505f" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Utensils on a wall rail</text><line x1="440" y1="215" x2="750" y2="215" stroke="#2e8b57" stroke-width="3"/><text x="595" y="205" font-size="16" font-weight="bold" fill="#256b43" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Aisle stays open</text><text x="400" y="355" font-size="17" font-weight="bold" fill="#3b2f23" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Same tools, different cost to the aisle: test with tape first</text></svg>