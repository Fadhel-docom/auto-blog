<text x="500" y="430" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#37443b">Pick one method for flat pans and one for lids; add inserts only where they fix a real problem.</text>
<text x="500" y="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#58655b">Method sketches. Product shapes differ; follow cookware care instructions for nested stacks.</text>

