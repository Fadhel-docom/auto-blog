<rect width="1000" height="520" fill="#fff"/>
<text x="500" y="38" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#37443b">Four ways to separate flat pans, lids and nested pots</text>
<rect x="30" y="80" width="220" height="300" rx="12" fill="#f8f5ee" stroke="#8c9a8c" stroke-width="3"/>
