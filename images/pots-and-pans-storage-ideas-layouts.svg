<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="t d">
<title id="t">Cookware storage layouts</title><desc id="d">Four sketches: vertical dividers for flat pans, a lid rack sorted by diameter, a nested set with separators and a pull-out tray with full extension.</desc>
