<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 500' role='img' aria-labelledby='t d'><title id='t'>Hallway plan with two storage choices</title><desc id='d'>Top view of two 36 inch wide hallways. With thick coats on hooks about 10 inches deep the clear width in a 24 inch run is 26 inches. With a slim 4 inch hook rail it is 32 inches.</desc><rect width='700' height='500' fill='#fbf9f4'/><text x='20' y='30' font-size='21' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Plan view: the same hallway with two storage choices</text><line x1='60' y1='70' x2='480' y2='70' stroke='#7a6a4f' stroke-width='6'/><line x1='60' y1='196' x2='480' y2='196' stroke='#7a6a4f' stroke-width='6'/><rect x='228' y='70' width='84' height='35' rx='2' fill='#f3d9d9' stroke='#9a3b3b' stroke-width='2' opacity='1' stroke-dasharray='6 4'/><line x1='270' y1='105' x2='270' y2='196' stroke='#2f3a2f' stroke-width='2'/><polygon points='270,105 265,114 275,114' fill='#2f3a2f'/><polygon points='270,196 265,187 275,187' fill='#2f3a2f'/><text x='280' y='155' font-size='16' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>26 in</text><text x='60' y='220' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Thick coats on hooks (about 10 in deep) leave 26 in</text><line x1='60' y1='270' x2='480' y2='270' stroke='#7a6a4f' stroke-width='6'/><line x1='60' y1='396' x2='480' y2='396' stroke='#7a6a4f' stroke-width='6'/><rect x='228' y='270' width='84' height='14' rx='2' fill='#dbe6cf' stroke='#5b6a4a' stroke-width='2' opacity='1'/><line x1='270' y1='284' x2='270' y2='396' stroke='#2f3a2f' stroke-width='2'/><polygon points='270,284 265,293 275,293' fill='#2f3a2f'/><polygon points='270,396 265,387 275,387' fill='#2f3a2f'/><text x='280' y='345' font-size='16' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>32 in</text><text x='60' y='420' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Slim hook rail (4 in) leaves 32 in over a 24 in run</text><text x='270' y='64' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>24 in run</text><text x='270' y='264' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>24 in run</text><text x='500' y='100' font-size='15' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Comparison numbers</text><text x='500' y='124' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>36 in  IRC hallway minimum</text><text x='500' y='146' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>32 in  ADA pinch, 24 in long</text><text x='500' y='168' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>4 in  ADA protrusion limit</text><text x='500' y='190' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>        above 27 in</text><text x='500' y='300' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>The 4 in rail keeps the</text><text x='500' y='320' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>pinch at 32 in. Thick coats</text><text x='500' y='340' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>do not.</text><text x='20' y='478' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Wall depth and hallway width are planning examples. Measure your own hallway.</text></svg>