<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420" role="img" aria-labelledby="title desc">
<title id="title">Three zones for renter-friendly bathroom storage</title>
<desc id="desc">Daily items stay within easy reach, occasional items go in secondary storage, and backups are kept together in one labeled bin.</desc>
<rect width="700" height="420" rx="18" fill="#F6F1E8"/><text x="30" y="42" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#1F3A34">Store by frequency of use</text>
<rect x="30" y="75" width="200" height="250" rx="12" fill="#D8E8E2" stroke="#2F7F79" stroke-width="3"/><rect x="250" y="75" width="200" height="250" rx="12" fill="#E8E3D7" stroke="#5E6B66" stroke-width="3"/><rect x="470" y="75" width="200" height="250" rx="12" fill="#F3DCCB" stroke="#C4622D" stroke-width="3"/>
<g font-family="Arial,sans-serif" fill="#1F3A34" text-anchor="middle"><text x="130" y="116" font-size="20" font-weight="700">Zone 1</text><text x="130" y="151" font-size="17">Daily</text><text x="130" y="191" font-size="15">Tray or front</text><text x="130" y="213" font-size="15">of drawer</text><text x="350" y="116" font-size="20" font-weight="700">Zone 2</text><text x="350" y="151" font-size="17">Occasional</text><text x="350" y="191" font-size="15">Secondary shelf</text><text x="350" y="213" font-size="15">or small bin</text><text x="570" y="116" font-size="20" font-weight="700">Zone 3</text><text x="570" y="151" font-size="17">Backups</text><text x="570" y="191" font-size="15">One labeled</text><text x="570" y="213" font-size="15">container</text></g>
<path d="M70 265H190 M290 265H410 M510 265H630" stroke="#5E6B66" stroke-width="3" stroke-linecap="round"/><text x="350" y="365" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#5E6B66">Move extras out of the bathroom if space or humidity is a problem.</text>
</svg>