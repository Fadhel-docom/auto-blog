<rect x="338" y="364" width="26" height="14" rx="6" fill="#e6e1d6" stroke="#4d6b55" stroke-width="1.5"/>
<text x="940" y="372" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#b5533c">Moves to a closet or shelf</text>
<text x="500" y="450" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#37443b">Daily capacity = 4 + 3 = 7 pairs by the door (example household)</text>
<text x="500" y="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#58655b">Count pairs, not single shoes. Replace the example counts with the shoes your household really wears.</text>

</svg>
