<rect x="60" y="248" width="26" height="14" rx="6" fill="#cfd8c9" stroke="#4d6b55" stroke-width="1.5"/>
<rect x="90" y="248" width="26" height="14" rx="6" fill="#cfd8c9" stroke="#4d6b55" stroke-width="1.5"/>
