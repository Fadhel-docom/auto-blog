<text x="500" y="38" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#37443b">Count pairs first: only two groups stay by the door</text>
<rect x="40" y="80" width="920" height="100" rx="10" fill="#f8f5ee" stroke="#8c9a8c" stroke-width="2"/>
<text x="60" y="114" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#37443b">Current rotation: 4 pairs</text>
<rect x="60" y="132" width="26" height="14" rx="6" fill="#9aa99a" stroke="#4d6b55" stroke-width="1.5"/>
