<rect x="184" y="248" width="26" height="14" rx="6" fill="#cfd8c9" stroke="#4d6b55" stroke-width="1.5"/>
<rect x="214" y="248" width="26" height="14" rx="6" fill="#cfd8c9" stroke="#4d6b55" stroke-width="1.5"/>
<text x="940" y="256" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#4d6b55">Stays by the door</text>
<rect x="40" y="312" width="920" height="100" rx="10" fill="#f8f5ee" stroke="#8c9a8c" stroke-width="2"/>
<text x="60" y="346" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#37443b">Occasional and off-season: 5 pairs</text>
<rect x="60" y="364" width="26" height="14" rx="6" fill="#e6e1d6" stroke="#4d6b55" stroke-width="1.5"/>
<rect x="90" y="364" width="26" height="14" rx="6" fill="#e6e1d6" stroke="#4d6b55" stroke-width="1.5"/>
