<rect x="184" y="132" width="26" height="14" rx="6" fill="#9aa99a" stroke="#4d6b55" stroke-width="1.5"/>
<rect x="214" y="132" width="26" height="14" rx="6" fill="#9aa99a" stroke="#4d6b55" stroke-width="1.5"/>
<rect x="246" y="132" width="26" height="14" rx="6" fill="#9aa99a" stroke="#4d6b55" stroke-width="1.5"/>
<rect x="276" y="132" width="26" height="14" rx="6" fill="#9aa99a" stroke="#4d6b55" stroke-width="1.5"/>
<text x="940" y="140" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#4d6b55">Stays by the door</text>
<rect x="40" y="196" width="920" height="100" rx="10" fill="#f8f5ee" stroke="#8c9a8c" stroke-width="2"/>
