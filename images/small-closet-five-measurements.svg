<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t4 d4"><title id="t4">Five closet measurements</title><desc id="d4">Front view of a closet marked with five measurements: width, height, rod height, shelf depth and door clearance.</desc><rect width="800" height="440" fill="#fbf7f1"/><rect x="60" y="40" width="380" height="330" rx="0" fill="#fffdf9" stroke="#5b4a3a" stroke-width="6"/><line x1="60" y1="395" x2="440" y2="395" stroke="#c0392b" stroke-width="3"/><text x="250" y="420" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">A  width</text><line x1="40" y1="40" x2="40" y2="370" stroke="#c0392b" stroke-width="3"/><text x="22" y="210" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">B</text><line x1="80" y1="150" x2="420" y2="150" stroke="#8a6a3b" stroke-width="6"/><text x="250" y="140" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">C  rod height</text><rect x="80" y="250" width="150" height="100" rx="4" fill="#e7f0d9" stroke="#6f9a3a" stroke-width="3"/><text x="155" y="306" font-size="15" font-weight="bold" fill="#456b1d" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">D  shelf depth</text><rect x="300" y="200" width="120" height="150" rx="4" fill="#d4e7ee" stroke="#3d6f80" stroke-width="3"/><text x="360" y="280" font-size="15" font-weight="bold" fill="#24505f" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">E  door</text><text x="360" y="300" font-size="15" font-weight="bold" fill="#24505f" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">clearance</text><rect x="480" y="40" width="290" height="330" rx="10" fill="#fff" stroke="#d9cdbd" stroke-width="2"/><text x="500" y="74" font-size="19" font-weight="bold" fill="#3b2f23" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Five numbers first</text><text x="500" y="108" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">A  inside width</text><text x="500" y="136" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">B  floor to ceiling</text><text x="500" y="164" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">C  rod height</text><text x="500" y="192" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">D  depth for shelves</text><text x="500" y="220" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">E  room for bins to clear</text><text x="500" y="248" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">   the door when it opens</text><text x="500" y="276" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Write them down before</text><text x="500" y="304" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">you buy anything</text></svg>