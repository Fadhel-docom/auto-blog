<svg xmlns="http://www.w3.org/2000/svg" width="700" height="494" viewBox="0 0 700 494" role="img" aria-labelledby="t d"><title id="t">Three zones keep the next step obvious</title><desc id="d">Three laundry zones shown as a left-to-right flow: dirty laundry near the entry, washing and supplies around the machines, and clean laundry waiting to be folded.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C4622D"/></marker></defs><rect width="700" height="494" rx="24" fill="#F6F1E8"/><text x="40" y="48" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1F3A34" text-anchor="start">Three zones keep the next step obvious</text><text x="40" y="78" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5E6B66" text-anchor="start">A compact laundry room works better with a few practical zones.</text><rect x="40" y="122" width="188" height="248" rx="16" fill="#F3E3D3"/><circle cx="68" cy="145.35" r="15" fill="#2F7F79"/><text x="68" y="151.3" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F6F1E8" text-anchor="middle">1</text><text x="98" y="153" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F3A34" text-anchor="start">Dirty</text><text x="98" y="175" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F3A34" text-anchor="start">laundry</text><text x="98" y="200" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="start">Hampers or</text><text x="98" y="221" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="start">sorting baskets</text><text x="98" y="242" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="start">close to the</text><text x="98" y="263" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="start">normal entry</text><text x="98" y="284" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="start">path.</text><line x1="230" y1="246" x2="254" y2="246" stroke="#C4622D" stroke-width="3" marker-end="url(#ar)"/><rect x="256" y="122" width="188" height="248" rx="16" fill="#E6EEF2"/><circle cx="284" cy="145.35" r="15" fill="#2F7F79"/><text x="284" y="151.3" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F6F1E8" text-anchor="middle">2</text><text x="314" y="153" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F3A34" text-anchor="start">Washing</text><text x="314" y="175" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F3A34" text-anchor="start">and</text><text x="314" y="197" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F3A34" text-anchor="start">supplies</text><text x="314" y="222" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="start">Detergent,</text><text x="314" y="243" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="start">stain</text><text x="314" y="264" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="start">treatment,</text><text x="314" y="285" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="start">laundry bags</text><text x="314" y="306" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="start">and cloths</text><text x="314" y="327" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="start">around the</text><text x="314" y="348" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="start">machines.</text><line x1="446" y1="246" x2="470" y2="246" stroke="#C4622D" stroke-width="3" marker-end="url(#ar)"/><rect x="472" y="122" width="188" height="248" rx="16" fill="#DCEBDD"/><circle cx="500" cy="145.35" r="15" fill="#2F7F79"/><text x="500" y="151.3" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F6F1E8" text-anchor="middle">3</text><text x="530" y="153" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F3A34" text-anchor="start">Clean</text><text x="530" y="175" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F3A34" text-anchor="start">laundry</text><text x="530" y="200" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="start">A counter, one</text><text x="530" y="221" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="start">shelf with</text><text x="530" y="242" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="start">baskets, or a</text><text x="530" y="263" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="start">small folding</text><text x="530" y="284" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="start">surface.</text><rect x="40" y="392" width="620" height="68" rx="14" fill="#1F3A34"/><text x="56" y="421" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#F6F1E8" text-anchor="start">In an extremely narrow room, combine zones: one tall hamper for</text><text x="56" y="445" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#F6F1E8" text-anchor="start">dirty laundry and a shallow tray on a shelf for daily supplies.</text></svg>
