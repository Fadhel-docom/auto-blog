<svg xmlns="http://www.w3.org/2000/svg" width="700" height="530" viewBox="0 0 700 530" role="img" aria-labelledby="t d"><title id="t">The folding surface is for folding</title><desc id="d">A folding surface at the top with one arrow pointing to a group of six sorting destinations: bedroom, bathroom, kids, towels, items that need hanging, and items that need repair or special care.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C4622D"/></marker></defs><rect width="700" height="530" rx="24" fill="#F6F1E8"/><text x="40" y="48" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1F3A34" text-anchor="start">The folding surface is for folding</text><text x="40" y="78" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5E6B66" text-anchor="start">It is not permanent storage. Sort each dry load into simple</text><text x="40" y="104" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5E6B66" text-anchor="start">destinations.</text><rect x="150" y="148" width="400" height="56" rx="14" fill="#2F7F79"/><text x="350" y="184" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#F6F1E8" text-anchor="middle">Folding surface</text><rect x="28" y="244" width="644" height="162" rx="16" fill="none" stroke="#2F7F79" stroke-width="2" stroke-dasharray="9 6"/><rect x="40" y="258" width="192" height="58" rx="12" fill="#E6EEF2" stroke="#1F3A34" stroke-width="2"/><text x="136" y="294" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F3A34" text-anchor="middle">Bedroom</text><rect x="254" y="258" width="192" height="58" rx="12" fill="#DCEBDD" stroke="#1F3A34" stroke-width="2"/><text x="350" y="294" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F3A34" text-anchor="middle">Bathroom</text><rect x="468" y="258" width="192" height="58" rx="12" fill="#F3E3D3" stroke="#1F3A34" stroke-width="2"/><text x="564" y="294" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F3A34" text-anchor="middle">Kids</text><rect x="40" y="334" width="192" height="58" rx="12" fill="#E6EEF2" stroke="#1F3A34" stroke-width="2"/><text x="136" y="370" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F3A34" text-anchor="middle">Towels</text><rect x="254" y="334" width="192" height="58" rx="12" fill="#DCEBDD" stroke="#1F3A34" stroke-width="2"/><text x="350" y="370" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F3A34" text-anchor="middle">Needs hanging</text><rect x="468" y="334" width="192" height="58" rx="12" fill="#F3E3D3" stroke="#1F3A34" stroke-width="2"/><text x="564" y="360" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F3A34" text-anchor="middle">Repair or special</text><text x="564" y="380" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F3A34" text-anchor="middle">care</text><line x1="350" y1="206" x2="350" y2="234" stroke="#C4622D" stroke-width="3" marker-end="url(#ar)"/><rect x="40" y="428" width="620" height="68" rx="14" fill="#1F3A34"/><text x="56" y="457" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#F6F1E8" text-anchor="start">Sorting a dry load this way keeps clean clothes from becoming a</text><text x="56" y="481" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#F6F1E8" text-anchor="start">permanent pile.</text></svg>
