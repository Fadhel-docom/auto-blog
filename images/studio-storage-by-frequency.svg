<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 410' role='img' aria-labelledby='t d'><title id='t'>Studio storage by frequency</title><desc id='d'>Three rows: daily items kept beside the path, weekly items inside zones, rarely used items under the bed or on top of the wardrobe.</desc><rect width='700' height='410' fill='#fbf9f4'/><text x='20' y='30' font-size='21' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Store by how often you use things</text><rect x='20' y='60' width='660' height='98' rx='10' fill='#f2ede2' stroke='#d9cfb8' stroke-width='1.5' opacity='1' /><rect x='34' y='74' width='110' height='70' rx='8' fill='#8f9a7a' stroke='#5b6a4a' stroke-width='2' opacity='1' /><text x='89' y='117' font-size='21' text-anchor='middle' font-weight='bold' fill='#fff' font-family='Helvetica,Arial,sans-serif'>Daily</text><text x='164' y='100' font-size='19' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Keys, laptop, kettle, work clothes</text><text x='164' y='132' font-size='18' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Beside the path: hooks, table, open shelf</text><rect x='20' y='172' width='660' height='98' rx='10' fill='#f2ede2' stroke='#d9cfb8' stroke-width='1.5' opacity='1' /><rect x='34' y='186' width='110' height='70' rx='8' fill='#e9d29b' stroke='#5b6a4a' stroke-width='2' opacity='1' /><text x='89' y='229' font-size='21' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Weekly</text><text x='164' y='212' font-size='19' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Laundry, spare shoes, linens</text><text x='164' y='244' font-size='18' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Inside zones: wardrobe, baskets</text><rect x='20' y='284' width='660' height='98' rx='10' fill='#f2ede2' stroke='#d9cfb8' stroke-width='1.5' opacity='1' /><rect x='34' y='298' width='110' height='70' rx='8' fill='#d8d2c4' stroke='#5b6a4a' stroke-width='2' opacity='1' /><text x='89' y='341' font-size='21' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Rare</text><text x='164' y='324' font-size='19' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Luggage, seasonal clothes, backups</text><text x='164' y='356' font-size='18' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Under the bed, top of wardrobe</text></svg>