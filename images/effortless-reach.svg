<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="t d"><title id="t">Where things should live on a wall</title><desc id="d">Wall elevation showing four height bands and what to store in each.</desc><rect width="800" height="460" fill="#faf6ef"/><text x="400.0" y="38" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#23363a">Where things should live on a wall</text><text x="400.0" y="62" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#55696a">Heights from the floor, in inches</text><rect x="120" y="90" width="90" height="330" fill="#fff" stroke="#23363a" stroke-width="2"/><rect x="120" y="361" width="90" height="59" fill="#f6d9d0" stroke="#2f6f62"/><line x1="210" y1="361" x2="240" y2="361" stroke="#8a9a96"/><text x="110" y="366" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#55696a">15 in</text><text x="250" y="389" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#23363a">Below 15 in</text><text x="250" y="408" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#23363a">Backups and seasonal items. Bending needed, so rarely used only.</text><rect x="120" y="231" width="90" height="130" fill="#dbe9e4" stroke="#2f6f62"/><line x1="210" y1="231" x2="240" y2="231" stroke="#8a9a96"/><text x="110" y="236" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#55696a">48 in</text><text x="250" y="294" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#23363a">15 to 48 in: easy reach</text><text x="250" y="313" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#23363a">Everyday items. This is the ADA reach range for things you must</text><text x="250" y="330" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#23363a">operate.</text><rect x="120" y="137" width="90" height="94" fill="#f3e3c8" stroke="#2f6f62"/><line x1="210" y1="137" x2="240" y2="137" stroke="#8a9a96"/><text x="110" y="142" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#55696a">72 in</text><text x="250" y="182" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#23363a">48 to 72 in</text><text x="250" y="201" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#23363a">Occasional items. Use a step stool and keep loads light.</text><rect x="120" y="90" width="90" height="47" fill="#e4dcef" stroke="#2f6f62"/><line x1="210" y1="90" x2="240" y2="90" stroke="#8a9a96"/><text x="110" y="95" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#55696a">84 in</text><text x="250" y="112" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#23363a">Above 72 in</text><text x="250" y="131" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#23363a">Rarely used, light, lidded boxes only.</text><text x="110" y="414" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#55696a">0</text><line x1="60" y1="420" x2="760" y2="420" stroke="#23363a" stroke-width="3"/></svg>