<svg xmlns="http://www.w3.org/2000/svg" width="700" height="540" viewBox="0 0 700 540" role="img" aria-labelledby="t d"><title id="t">A weekly reset in under ten minutes</title><desc id="d">Five two-minute steps for resetting a small laundry room: clear machine tops, return supplies, empty the problem basket, fold or move clean laundry, and sweep the floor.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C4622D"/></marker></defs><rect width="700" height="540" rx="24" fill="#F6F1E8"/><text x="40" y="48" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1F3A34" text-anchor="start">A weekly reset in under ten minutes</text><text x="40" y="78" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5E6B66" text-anchor="start">Do it once or twice a week; shorten it as the system becomes</text><text x="40" y="104" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5E6B66" text-anchor="start">familiar.</text><rect x="40" y="148" width="620" height="62" rx="14" fill="#E6EEF2"/><rect x="40" y="148" width="120" height="62" rx="14" fill="#2F7F79"/><rect x="120" y="148" width="40" height="62" rx="0" fill="#2F7F79"/><text x="100" y="186" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F6F1E8" text-anchor="middle">Min 1-2</text><text x="184" y="186" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1F3A34" text-anchor="start">Clear the tops of the machines.</text><rect x="40" y="222" width="620" height="62" rx="14" fill="#DCEBDD"/><rect x="40" y="222" width="120" height="62" rx="14" fill="#2F7F79"/><rect x="120" y="222" width="40" height="62" rx="0" fill="#2F7F79"/><text x="100" y="260" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F6F1E8" text-anchor="middle">Min 3-4</text><text x="184" y="260" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1F3A34" text-anchor="start">Return detergent and accessories to their zones.</text><rect x="40" y="296" width="620" height="62" rx="14" fill="#F3E3D3"/><rect x="40" y="296" width="120" height="62" rx="14" fill="#2F7F79"/><rect x="120" y="296" width="40" height="62" rx="0" fill="#2F7F79"/><text x="100" y="334" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F6F1E8" text-anchor="middle">Min 5-6</text><text x="184" y="334" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1F3A34" text-anchor="start">Empty the problem basket.</text><rect x="40" y="370" width="620" height="62" rx="14" fill="#E6EEF2"/><rect x="40" y="370" width="120" height="62" rx="14" fill="#2F7F79"/><rect x="120" y="370" width="40" height="62" rx="0" fill="#2F7F79"/><text x="100" y="408" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F6F1E8" text-anchor="middle">Min 7-8</text><text x="184" y="398" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1F3A34" text-anchor="start">Fold or move anything left in the clean-laundry</text><text x="184" y="420" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1F3A34" text-anchor="start">zone.</text><rect x="40" y="444" width="620" height="62" rx="14" fill="#DCEBDD"/><rect x="40" y="444" width="120" height="62" rx="14" fill="#2F7F79"/><rect x="120" y="444" width="40" height="62" rx="0" fill="#2F7F79"/><text x="100" y="482" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F6F1E8" text-anchor="middle">Min 9-10</text><text x="184" y="472" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1F3A34" text-anchor="start">Sweep the floor and check for items that do not</text><text x="184" y="494" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1F3A34" text-anchor="start">belong.</text></svg>
