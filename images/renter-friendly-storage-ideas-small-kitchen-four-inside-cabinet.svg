<svg xmlns="http://www.w3.org/2000/svg" width="700" height="660" viewBox="0 0 700 660" role="img" aria-labelledby="t d"><title id="t">Three upgrades inside a cabinet</title><desc id="d">Cross-section of a cabinet showing a tiered shelf insert on the upper shelf, a tension divider between plates and bowls, and a slim pull-out drawer at the bottom, each marked with a number.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C4622D"/></marker></defs><rect width="700" height="660" rx="24" fill="#F6F1E8"/><text x="40" y="48" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1F3A34" text-anchor="start">Three upgrades inside a cabinet</text><text x="40" y="78" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5E6B66" text-anchor="start">No drilling: each piece lifts out when you move.</text><rect x="40" y="122" width="390" height="300" rx="8" fill="#FFFFFF" stroke="#1F3A34" stroke-width="3"/><line x1="40" y1="252" x2="430" y2="252" stroke="#1F3A34" stroke-width="4"/><rect x="70" y="214" width="160" height="36" rx="4" fill="#DCEBDD" stroke="#1F3A34" stroke-width="2"/><rect x="92" y="178" width="116" height="36" rx="4" fill="#DCEBDD" stroke="#1F3A34" stroke-width="2"/><rect x="108" y="152" width="16" height="26" rx="3" fill="#F3E3D3" stroke="#1F3A34" stroke-width="2"/><rect x="134" y="156" width="16" height="22" rx="3" fill="#F3E3D3" stroke="#1F3A34" stroke-width="2"/><line x1="250" y1="260" x2="250" y2="412" stroke="#2F7F79" stroke-width="6"/><circle cx="250" cy="336" r="9" fill="#2F7F79"/><rect x="66" y="386" width="160" height="12" rx="3" fill="#E6EEF2" stroke="#1F3A34" stroke-width="2"/><rect x="66" y="372" width="160" height="12" rx="3" fill="#E6EEF2" stroke="#1F3A34" stroke-width="2"/><rect x="66" y="358" width="160" height="12" rx="3" fill="#E6EEF2" stroke="#1F3A34" stroke-width="2"/><rect x="66" y="344" width="160" height="12" rx="3" fill="#E6EEF2" stroke="#1F3A34" stroke-width="2"/><rect x="272" y="328" width="120" height="12" rx="6" fill="#F3E3D3" stroke="#1F3A34" stroke-width="2"/><rect x="272" y="314" width="120" height="12" rx="6" fill="#F3E3D3" stroke="#1F3A34" stroke-width="2"/><rect x="272" y="300" width="120" height="12" rx="6" fill="#F3E3D3" stroke="#1F3A34" stroke-width="2"/><rect x="272" y="356" width="140" height="48" rx="6" fill="#DCEBDD" stroke="#1F3A34" stroke-width="3"/><line x1="300" y1="372" x2="348" y2="372" stroke="#1F3A34" stroke-width="4"/><circle cx="254" cy="198" r="15" fill="#C4622D"/><text x="254" y="204" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><circle cx="250" cy="280" r="15" fill="#C4622D"/><text x="250" y="286" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><circle cx="388" cy="380" r="15" fill="#C4622D"/><text x="388" y="386" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><rect x="462" y="122" width="198" height="112" rx="16" fill="#DCEBDD"/><circle cx="488" cy="142.8" r="15" fill="#2F7F79"/><text x="488" y="148.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F6F1E8" text-anchor="middle">1</text><text x="518" y="150" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F3A34" text-anchor="start">Tiered insert</text><text x="518" y="174" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5E6B66" text-anchor="start">Two levels of</text><text x="518" y="194" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5E6B66" text-anchor="start">storage. Lifts out</text><text x="518" y="214" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5E6B66" text-anchor="start">when you move.</text><rect x="462" y="244" width="198" height="153" rx="16" fill="#E6EEF2"/><circle cx="488" cy="264.8" r="15" fill="#2F7F79"/><text x="488" y="270.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F6F1E8" text-anchor="middle">2</text><text x="518" y="272" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F3A34" text-anchor="start">Tension</text><text x="518" y="293" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F3A34" text-anchor="start">divider</text><text x="518" y="317" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5E6B66" text-anchor="start">No screws.</text><text x="518" y="337" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5E6B66" text-anchor="start">Separates plates,</text><text x="518" y="357" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5E6B66" text-anchor="start">bowls or pantry</text><text x="518" y="377" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5E6B66" text-anchor="start">boxes.</text><rect x="462" y="407" width="198" height="133" rx="16" fill="#F3E3D3"/><circle cx="488" cy="427.8" r="15" fill="#2F7F79"/><text x="488" y="433.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F6F1E8" text-anchor="middle">3</text><text x="518" y="435" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F3A34" text-anchor="start">Slim pull-out</text><text x="518" y="456" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F3A34" text-anchor="start">drawer</text><text x="518" y="480" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5E6B66" text-anchor="start">Shows each sheet</text><text x="518" y="500" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5E6B66" text-anchor="start">or tray front to</text><text x="518" y="520" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5E6B66" text-anchor="start">back.</text><rect x="40" y="558" width="620" height="68" rx="14" fill="#1F3A34"/><text x="56" y="587" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#F6F1E8" text-anchor="start">Measure the interior first: the door and face frame reduce usable</text><text x="56" y="611" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#F6F1E8" text-anchor="start">depth.</text></svg>
