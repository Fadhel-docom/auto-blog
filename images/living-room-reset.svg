<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d"><title id="t">The 10-minute living room reset</title><desc id="d">Three step reset: collect loose items for three minutes, return each item to its basket or shelf for four minutes, then straighten surfaces and cords for three minutes.</desc><rect width="800" height="400" fill="#faf6ef"/><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5522f"/></marker></defs><text x="400.0" y="36" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#23363a">The 10-minute living room reset</text><text x="400.0" y="60" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#55696a">One short loop, same order every time</text><rect x="40" y="100" width="220" height="250" rx="10" fill="#fff" stroke="#2f6f62" stroke-width="2"/><circle cx="150" cy="145" r="24" fill="#2f6f62"/><text x="150" y="153" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#faf6ef">1</text><text x="150" y="200" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#23363a">Collect</text><text x="150" y="224" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#b5522f">3 min</text><text x="150" y="256" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#55696a">Cups, mail, remotes,</text><text x="150" y="276" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#55696a">throws, anything out of</text><text x="150" y="296" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#55696a">place goes into one</text><text x="150" y="316" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#55696a">basket.</text><rect x="290" y="100" width="220" height="250" rx="10" fill="#fff" stroke="#2f6f62" stroke-width="2"/><circle cx="400" cy="145" r="24" fill="#2f6f62"/><text x="400" y="153" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#faf6ef">2</text><text x="400" y="200" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#23363a">Return</text><text x="400" y="224" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#b5522f">4 min</text><text x="400" y="256" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#55696a">Each item goes to its own</text><text x="400" y="276" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#55696a">basket or shelf. If it has</text><text x="400" y="296" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#55696a">no home, decide now.</text><rect x="540" y="100" width="220" height="250" rx="10" fill="#fff" stroke="#2f6f62" stroke-width="2"/><circle cx="650" cy="145" r="24" fill="#2f6f62"/><text x="650" y="153" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#faf6ef">3</text><text x="650" y="200" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#23363a">Reset</text><text x="650" y="224" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#b5522f">3 min</text><text x="650" y="256" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#55696a">Wipe surfaces, fold the</text><text x="650" y="276" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#55696a">throw, check that cords</text><text x="650" y="296" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#55696a">are still tidy and</text><text x="650" y="316" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#55696a">uncovered.</text></svg>