<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 500' role='img' aria-labelledby='t d'><title id='t'>Bin budget for holiday decorations</title><desc id='d'>Top view of a 60 by 14 inch closet shelf holding three 18 by 14 inch bins for ornaments, lights and garland, and table and mantel decorations, with 6 inches spare. Three bins are the storage budget.</desc><rect width='700' height='500' fill='#fbf9f4'/><text x='20' y='30' font-size='21' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Bin budget: let the shelf decide how much you keep</text><text x='60' y='96' font-size='15' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Top view of a closet shelf: 60 in wide × 14 in deep (example)</text><rect x='60' y='110' width='360' height='84' rx='2' fill='#f6f2e8' stroke='#7a6a4f' stroke-width='3' opacity='1'/><rect x='62' y='112' width='104' height='80' rx='6' fill='#f3d9d9' stroke='#5b6a4a' stroke-width='2' opacity='1'/><text x='114' y='146' font-size='14' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Ornaments</text><text x='114' y='168' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>18 × 14 in</text><rect x='170' y='112' width='104' height='80' rx='6' fill='#fff0c9' stroke='#5b6a4a' stroke-width='2' opacity='1'/><text x='222' y='146' font-size='14' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Lights</text><text x='222' y='168' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>18 × 14 in</text><rect x='278' y='112' width='104' height='80' rx='6' fill='#dbe6cf' stroke='#5b6a4a' stroke-width='2' opacity='1'/><text x='330' y='146' font-size='14' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Table decor</text><text x='330' y='168' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>18 × 14 in</text><rect x='384' y='112' width='34' height='80' rx='3' fill='none' stroke='#8a7a5c' stroke-width='2' opacity='1' stroke-dasharray='5 4'/><text x='402' y='146' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>6 in</text><text x='402' y='162' font-size='11' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>spare</text><text x='60' y='228' font-size='16' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>60 in ÷ 18 in per bin = 3 bins (54 in), with 6 in to spare</text><text x='60' y='254' font-size='15' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Three bins are the whole budget. Everything you own has to fit in them.</text><text x='60' y='294' font-size='15' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>If it does not fit:</text><text x='60' y='318' font-size='15' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>1. Edit: donate or discard what you no longer use.</text><text x='60' y='342' font-size='15' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>2. Rotate: show one category per season, store the rest.</text><text x='60' y='366' font-size='15' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>3. Move one durable category to another suitable space.</text><text x='20' y='478' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Sizes are planning examples. Measure your own shelf and bins.</text></svg>