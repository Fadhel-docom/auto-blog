<svg xmlns="http://www.w3.org/2000/svg" width="700" height="470" viewBox="0 0 700 470" role="img" aria-labelledby="t d"><title id="t">Each busy surface gets a short list</title><desc id="d">Four busy household surfaces, each with the short list of items allowed to stay on it, and the two-question end-of-day check.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C4622D"/></marker></defs><rect width="700" height="470" rx="24" fill="#F6F1E8"/><text x="40" y="48" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1F3A34" text-anchor="start">Each busy surface gets a short list</text><text x="40" y="78" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5E6B66" text-anchor="start">Everything else returns to its home at the end of the day.</text><rect x="40" y="122" width="303" height="107" rx="16" fill="#E6EEF2"/><text x="56" y="157" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F3A34" text-anchor="start">Entryway</text><text x="56" y="183" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5E6B66" text-anchor="start">Keys, one everyday bag, and a</text><text x="56" y="205" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5E6B66" text-anchor="start">small mail tray.</text><rect x="357" y="122" width="303" height="107" rx="16" fill="#DCEBDD"/><text x="373" y="157" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F3A34" text-anchor="start">Desk</text><text x="373" y="183" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5E6B66" text-anchor="start">Current work, one notebook, and</text><text x="373" y="205" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5E6B66" text-anchor="start">the equipment used every day.</text><rect x="40" y="243" width="303" height="107" rx="16" fill="#F3E3D3"/><text x="56" y="278" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F3A34" text-anchor="start">Kitchen counter</text><text x="56" y="304" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5E6B66" text-anchor="start">Only appliances used frequently.</text><rect x="357" y="243" width="303" height="107" rx="16" fill="#E6EEF2"/><text x="373" y="278" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F3A34" text-anchor="start">Bedside table</text><text x="373" y="304" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5E6B66" text-anchor="start">Lamp, current book, and a few</text><text x="373" y="326" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5E6B66" text-anchor="start">daily essentials.</text><rect x="40" y="368" width="620" height="68" rx="14" fill="#1F3A34"/><text x="56" y="397" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#F6F1E8" text-anchor="start">End-of-day check: "Does this belong here?" and "Will I need it here</text><text x="56" y="421" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#F6F1E8" text-anchor="start">tomorrow?" If both answers are no, return the item to its home.</text></svg>
