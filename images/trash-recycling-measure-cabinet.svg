<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d"><title id="t">Measure the cabinet first</title><desc id="d">Front and side view of a lower cabinet with a two-bin slide showing the three measurements to take: opening width, floor to shelf height and depth to the back wall or pipes.</desc><rect width="800" height="560" fill="#faf6ef"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f62"/></marker></defs><text x="400" y="36" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#23363a">Measure the cabinet first</text><text x="400" y="60" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#55696a">Three numbers before you buy any bin</text><rect x="230" y="130" width="300" height="330" rx="4" fill="#fff" stroke="#23363a" stroke-width="3"/><rect x="250" y="150" width="260" height="290" rx="2" fill="#f3ede0" stroke="#23363a" stroke-width="1.5"/><rect x="280" y="260" width="100" height="170" rx="4" fill="#dfe6e4" stroke="#55696a" stroke-width="2"/><rect x="395" y="260" width="100" height="170" rx="4" fill="#dfe6e4" stroke="#55696a" stroke-width="2"/><text x="330" y="350" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#55696a">Trash</text><text x="445" y="350" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#55696a">Recycling</text><rect x="250" y="150" width="260" height="16" rx="2" fill="#e6efd2" stroke="#2f6f62" stroke-width="1.5"/><text x="380" y="162" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#55696a">shelf or counter above</text><line x1="230" y1="105" x2="530" y2="105" stroke="#b5522f" stroke-width="2"/><line x1="230" y1="97" x2="230" y2="113" stroke="#b5522f" stroke-width="2"/><line x1="530" y1="97" x2="530" y2="113" stroke="#b5522f" stroke-width="2"/><text x="380" y="95" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#b5522f">A  Opening width</text><line x1="200" y1="166" x2="200" y2="440" stroke="#b5522f" stroke-width="2"/><line x1="192" y1="166" x2="208" y2="166" stroke="#b5522f" stroke-width="2"/><line x1="192" y1="440" x2="208" y2="440" stroke="#b5522f" stroke-width="2"/><text x="185" y="300" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#b5522f">B  Floor to shelf height</text><rect x="590" y="260" width="170" height="190" rx="4" fill="#fff" stroke="#23363a" stroke-width="3"/><rect x="590" y="430" width="170" height="20" rx="2" fill="#f3ede0" stroke="#23363a" stroke-width="1.5"/><circle cx="735" cy="360" r="14" fill="#dbe9e4" stroke="#2f6f62" stroke-width="2"/><text x="735" y="364" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#2f6f62">pipe</text><line x1="590" y1="235" x2="760" y2="235" stroke="#b5522f" stroke-width="2"/><line x1="590" y1="227" x2="590" y2="243" stroke="#b5522f" stroke-width="2"/><line x1="760" y1="227" x2="760" y2="243" stroke="#b5522f" stroke-width="2"/><text x="675" y="225" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#b5522f">C  Front edge to back wall or pipes</text><text x="675" y="480" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#55696a">Side view of the same cabinet</text><rect x="130" y="500" width="540" height="40" rx="8" fill="#e6efd2" stroke="#2f6f62" stroke-width="2"/><text x="400" y="525" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#23363a">Also check the door swing and the room the slide hardware needs</text></svg>