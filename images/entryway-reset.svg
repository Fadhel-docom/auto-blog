<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" role="img" aria-labelledby="t d"><title id="t">The 15-minute entryway reset</title><desc id="d">Three-step fifteen minute reset for an entryway.</desc><rect width="800" height="250" fill="#faf6ef"/><text x="400.0" y="38" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#23363a">The 15-minute entryway reset</text><text x="400.0" y="62" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#55696a">Five minutes per step</text><rect x="24" y="90" width="244" height="140" rx="10" fill="#dbe9e4" stroke="#2f6f62" stroke-width="1.5"/><text x="146.0" y="116" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#2f6f62">0-5 min</text><text x="146.0" y="142" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#23363a">Collect shoes, bags, mail, loose</text><text x="146.0" y="158" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#23363a">items</text><rect x="278" y="90" width="244" height="140" rx="10" fill="#f3e3c8" stroke="#2f6f62" stroke-width="1.5"/><text x="400.0" y="116" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#2f6f62">5-10 min</text><text x="400.0" y="142" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#23363a">Decide: act, recycle, or file</text><rect x="532" y="90" width="244" height="140" rx="10" fill="#e4dcef" stroke="#2f6f62" stroke-width="1.5"/><text x="654.0" y="116" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#2f6f62">10-15 min</text><text x="654.0" y="142" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#23363a">Return everything to its fixed</text><text x="654.0" y="158" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#23363a">home</text></svg>