<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d"><title id="t">The TV wall, by height</title><desc id="d">Wall elevation of a living room TV wall showing a low media console, a TV on it, a light shelf above, anchor points to the wall, and height bands for heavy items, daily items and light occasional items.</desc><rect width="800" height="560" fill="#faf6ef"/><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5522f"/></marker></defs><text x="400.0" y="36" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#23363a">The TV wall, by height</text><text x="400.0" y="60" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#55696a">Heavy low, daily in the middle, light and occasional high</text><rect x="170" y="113.6" width="440" height="386.4" fill="#fff" stroke="#23363a" stroke-width="2"/><line x1="150" y1="500" x2="630" y2="500" stroke="#23363a" stroke-width="3"/><rect x="170" y="431.0" width="440" height="69.0" fill="#f3e3c8" opacity="0.55"/><rect x="170" y="279.2" width="440" height="151.8" fill="#e6efd2" opacity="0.7"/><rect x="170" y="113.6" width="440" height="165.6" fill="#dbe9e4" opacity="0.7"/><rect x="290" y="398.8" width="200" height="101.2" rx="4" fill="#fff" stroke="#2f6f62" stroke-width="2"/><text x="390" y="454.4" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Low console, closed storage</text><rect x="320" y="260.8" width="140" height="128.8" rx="3" fill="#23363a"/><text x="390" y="330.20000000000005" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#faf6ef">TV</text><rect x="260" y="196.4" width="260" height="8" fill="#2f6f62"/><text x="390" y="186.40000000000003" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Shelf: light items only</text><rect x="323" y="263.8" width="14" height="14" fill="#b5522f"/><rect x="453" y="387.8" width="14" height="14" fill="#b5522f"/><text x="540" y="274.8" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#b5522f">anchor point</text><text x="500" y="412.8" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#b5522f">anchor point</text><line x1="140" y1="500.0" x2="140" y2="431.0" stroke="#b5522f" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/><text x="132" y="465.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#b5522f">Floor to 15 in</text><text x="132" y="481.5" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#55696a">heavy, bulky</text><line x1="140" y1="431.0" x2="140" y2="279.2" stroke="#b5522f" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/><text x="132" y="355.1" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#b5522f">15 to 48 in</text><text x="132" y="371.1" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#55696a">daily reach range</text><line x1="140" y1="279.2" x2="140" y2="113.6" stroke="#b5522f" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/><text x="132" y="196.40000000000003" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#b5522f">Above 48 in</text><text x="132" y="212.40000000000003" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#55696a">light, occasional</text></svg>