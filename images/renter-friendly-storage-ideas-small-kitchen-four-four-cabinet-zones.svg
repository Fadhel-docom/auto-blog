<svg xmlns="http://www.w3.org/2000/svg" width="700" height="484" viewBox="0 0 700 484" role="img" aria-labelledby="t d"><title id="t">Four cabinets, four jobs</title><desc id="d">Front view of a kitchen counter above four cabinets, each labeled with one storage job: cookware and baking sheets, dishes and bowls, dry goods and spices, small appliances and gadgets.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C4622D"/></marker></defs><rect width="700" height="484" rx="24" fill="#F6F1E8"/><text x="40" y="48" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1F3A34" text-anchor="start">Four cabinets, four jobs</text><text x="40" y="78" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5E6B66" text-anchor="start">Give each cabinet one job that matches your routine.</text><rect x="40" y="128" width="620" height="34" rx="8" fill="#F3E3D3" stroke="#1F3A34" stroke-width="3"/><text x="350" y="151" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F3A34" text-anchor="middle">Counter: keep active tasks only</text><rect x="40" y="172" width="148" height="176" rx="10" fill="#E6EEF2" stroke="#1F3A34" stroke-width="3"/><circle cx="70" cy="204" r="16" fill="#2F7F79"/><text x="70" y="210" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#F6F1E8" text-anchor="middle">1</text><text x="54" y="254" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1F3A34" text-anchor="start">Cookware and</text><text x="54" y="276" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1F3A34" text-anchor="start">baking sheets</text><rect x="104" y="322" width="20" height="6" rx="3" fill="#8FA3B0"/><rect x="198" y="172" width="148" height="176" rx="10" fill="#DCEBDD" stroke="#1F3A34" stroke-width="3"/><circle cx="228" cy="204" r="16" fill="#2F7F79"/><text x="228" y="210" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#F6F1E8" text-anchor="middle">2</text><text x="212" y="254" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1F3A34" text-anchor="start">Dishes and</text><text x="212" y="276" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1F3A34" text-anchor="start">bowls</text><rect x="262" y="322" width="20" height="6" rx="3" fill="#8FA3B0"/><rect x="356" y="172" width="148" height="176" rx="10" fill="#E6EEF2" stroke="#1F3A34" stroke-width="3"/><circle cx="386" cy="204" r="16" fill="#2F7F79"/><text x="386" y="210" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#F6F1E8" text-anchor="middle">3</text><text x="370" y="254" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1F3A34" text-anchor="start">Dry goods and</text><text x="370" y="276" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1F3A34" text-anchor="start">spices</text><rect x="420" y="322" width="20" height="6" rx="3" fill="#8FA3B0"/><rect x="514" y="172" width="148" height="176" rx="10" fill="#DCEBDD" stroke="#1F3A34" stroke-width="3"/><circle cx="544" cy="204" r="16" fill="#2F7F79"/><text x="544" y="210" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#F6F1E8" text-anchor="middle">4</text><text x="528" y="254" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1F3A34" text-anchor="start">Small</text><text x="528" y="276" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1F3A34" text-anchor="start">appliances</text><text x="528" y="298" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1F3A34" text-anchor="start">and everyday</text><text x="528" y="320" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1F3A34" text-anchor="start">gadgets</text><rect x="578" y="322" width="20" height="6" rx="3" fill="#8FA3B0"/><rect x="40" y="348" width="620" height="12" rx="0" fill="#D9D2C3"/><rect x="40" y="382" width="620" height="68" rx="14" fill="#1F3A34"/><text x="56" y="411" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#F6F1E8" text-anchor="start">Example assignment only. Match each cabinet to your own inventory</text><text x="56" y="435" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#F6F1E8" text-anchor="start">of cookware, dishes, spices, dry goods and small appliances.</text></svg>
