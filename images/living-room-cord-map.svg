<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d"><title id="t">From wall to device, zone by zone</title><desc id="d">Three zones of a living room, the TV wall, the lamp corner and the charging spot, each with one wall outlet, a fixed cord path and the rule never to chain power strips.</desc><rect width="800" height="560" fill="#faf6ef"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f62"/></marker></defs><text x="400" y="36" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#23363a">From wall to device, zone by zone</text><text x="400" y="60" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#55696a">One outlet, one fixed path, no chained strips</text><rect x="40" y="90" width="220" height="400" rx="10" fill="#fff" stroke="#23363a" stroke-width="2"/><text x="150" y="120" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#23363a">TV wall</text><rect x="110" y="140" width="80" height="44" rx="6" fill="#f3e3c8" stroke="#23363a" stroke-width="2"/><text x="150" y="167" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#23363a">Wall outlet</text><line x1="150" y1="184" x2="150" y2="214" stroke="#2f6f62" stroke-width="3" marker-end="url(#a)"/><rect x="70" y="216" width="160" height="50" rx="6" fill="#e6efd2" stroke="#2f6f62" stroke-width="2"/><text x="150" y="236" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#23363a">Power strip</text><text x="150" y="254" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#55696a">internal breaker</text><line x1="150" y1="266" x2="150" y2="296" stroke="#2f6f62" stroke-width="3" marker-end="url(#a)"/><rect x="67.5" y="298" width="50" height="46" rx="6" fill="#fff" stroke="#2f6f62" stroke-width="2"/><text x="92.5" y="326" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#23363a">TV</text><rect x="125.0" y="298" width="50" height="46" rx="6" fill="#fff" stroke="#2f6f62" stroke-width="2"/><text x="150.0" y="326" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#23363a">Router</text><rect x="182.5" y="298" width="50" height="46" rx="6" fill="#fff" stroke="#2f6f62" stroke-width="2"/><text x="207.5" y="326" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#23363a">Console</text><text x="150" y="384" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#55696a">One strip, light loads</text><rect x="60" y="404" width="180" height="64" rx="6" fill="#fbe9e1" stroke="#b5522f" stroke-width="1.5"/><text x="150" y="426" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#b5522f">Never chain strips</text><text x="150" y="444" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#b5522f">and keep cords off the rug</text><rect x="290" y="90" width="220" height="400" rx="10" fill="#fff" stroke="#23363a" stroke-width="2"/><text x="400" y="120" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#23363a">Lamp corner</text><rect x="360" y="140" width="80" height="44" rx="6" fill="#f3e3c8" stroke="#23363a" stroke-width="2"/><text x="400" y="167" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#23363a">Wall outlet</text><line x1="400" y1="184" x2="400" y2="214" stroke="#2f6f62" stroke-width="3" marker-end="url(#a)"/><rect x="320" y="216" width="160" height="50" rx="6" fill="#e6efd2" stroke="#2f6f62" stroke-width="2"/><text x="400" y="236" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#23363a">Cord along wall</text><text x="400" y="254" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#55696a">baseboard clips</text><line x1="400" y1="266" x2="400" y2="296" stroke="#2f6f62" stroke-width="3" marker-end="url(#a)"/><rect x="340" y="298" width="120" height="46" rx="6" fill="#fff" stroke="#2f6f62" stroke-width="2"/><text x="400.0" y="326" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#23363a">Floor lamp</text><text x="400" y="384" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#55696a">Clipped to the pole</text><rect x="310" y="404" width="180" height="64" rx="6" fill="#fbe9e1" stroke="#b5522f" stroke-width="1.5"/><text x="400" y="426" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#b5522f">Never chain strips</text><text x="400" y="444" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#b5522f">and keep cords off the rug</text><rect x="540" y="90" width="220" height="400" rx="10" fill="#fff" stroke="#23363a" stroke-width="2"/><text x="650" y="120" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#23363a">Charging spot</text><rect x="610" y="140" width="80" height="44" rx="6" fill="#f3e3c8" stroke="#23363a" stroke-width="2"/><text x="650" y="167" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#23363a">Wall outlet</text><line x1="650" y1="184" x2="650" y2="214" stroke="#2f6f62" stroke-width="3" marker-end="url(#a)"/><rect x="570" y="216" width="160" height="50" rx="6" fill="#e6efd2" stroke="#2f6f62" stroke-width="2"/><text x="650" y="236" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#23363a">Strip with room</text><text x="650" y="254" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#55696a">under its rating</text><line x1="650" y1="266" x2="650" y2="296" stroke="#2f6f62" stroke-width="3" marker-end="url(#a)"/><rect x="570.0" y="298" width="75" height="46" rx="6" fill="#fff" stroke="#2f6f62" stroke-width="2"/><text x="607.5" y="326" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#23363a">Phone</text><rect x="655.0" y="298" width="75" height="46" rx="6" fill="#fff" stroke="#2f6f62" stroke-width="2"/><text x="692.5" y="326" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#23363a">Tablet</text><text x="650" y="384" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#55696a">Unplug when idle</text><rect x="560" y="404" width="180" height="64" rx="6" fill="#fbe9e1" stroke="#b5522f" stroke-width="1.5"/><text x="650" y="426" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#b5522f">Never chain strips</text><text x="650" y="444" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#b5522f">and keep cords off the rug</text><text x="400" y="530" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#23363a">One way in from the wall for each zone, one fixed path for every cord</text></svg>