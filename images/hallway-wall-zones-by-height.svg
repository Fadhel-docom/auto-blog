<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 500' role='img' aria-labelledby='t d'><title id='t'>Hallway wall zones by height</title><desc id='d'>Front view of a hallway wall: a 24 inch hook rail at 54 inches with three hooks and coats, a 24 inch shoe shelf near the floor and a line at 27 inches marking where the 4 inch protrusion limit starts.</desc><rect width='700' height='500' fill='#fbf9f4'/><text x='20' y='30' font-size='21' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Wall zones by height (front view, example)</text><rect x='80' y='50' width='300' height='400' rx='0' fill='#f6f2e8' stroke='#b8ad92' stroke-width='1' opacity='1'/><rect x='80' y='315' width='300' height='135' rx='0' fill='#ece7da' stroke='none' stroke-width='0' opacity='1'/><line x1='80' y1='315' x2='380' y2='315' stroke='#8a6a3b' stroke-width='2' stroke-dasharray='6 4'/><text x='70' y='320' font-size='13' text-anchor='end' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>27 in</text><text x='70' y='55' font-size='13' text-anchor='end' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>80 in</text><text x='70' y='215' font-size='13' text-anchor='end' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>48 in</text><text x='70' y='455' font-size='13' text-anchor='end' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>0</text><line x1='80' y1='210' x2='90' y2='210' stroke='#2f3a2f' stroke-width='2'/><rect x='140' y='176' width='120' height='8' rx='2' fill='#c9a56e' stroke='#8a6a3b' stroke-width='2' opacity='1'/><circle cx='160' cy='188' r='4' fill='#5b6a4a'/><rect x='146' y='192' width='28' height='120' rx='8' fill='#cfd9b8' stroke='#5b6a4a' stroke-width='2' opacity='1'/><circle cx='200' cy='188' r='4' fill='#5b6a4a'/><rect x='186' y='192' width='28' height='120' rx='8' fill='#e3c9a6' stroke='#5b6a4a' stroke-width='2' opacity='1'/><circle cx='240' cy='188' r='4' fill='#5b6a4a'/><rect x='226' y='192' width='28' height='120' rx='8' fill='#d8d2c4' stroke='#5b6a4a' stroke-width='2' opacity='1'/><text x='200' y='166' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Hook rail 24 in</text><rect x='140' y='430' width='120' height='5' rx='1' fill='#c9a56e' stroke='#8a6a3b' stroke-width='2' opacity='1'/><rect x='146' y='413' width='24' height='16' rx='3' fill='#d8d2c4' stroke='#5b6a4a' stroke-width='2' opacity='1'/><rect x='176' y='413' width='24' height='16' rx='3' fill='#d8d2c4' stroke='#5b6a4a' stroke-width='2' opacity='1'/><rect x='206' y='413' width='24' height='16' rx='3' fill='#d8d2c4' stroke='#5b6a4a' stroke-width='2' opacity='1'/><rect x='236' y='413' width='24' height='16' rx='3' fill='#d8d2c4' stroke='#5b6a4a' stroke-width='2' opacity='1'/><text x='200' y='452' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Shoe shelf 24 in</text><text x='410' y='100' font-size='16' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Above 27 in</text><text x='410' y='122' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Keep depth near 4 in (ADA 307.2</text><text x='410' y='142' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>comparison). Hooks and light coats.</text><text x='410' y='190' font-size='16' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Reach</text><text x='410' y='212' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Rail at 54 in suits adults. Add a</text><text x='410' y='232' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>hook at 48 in or lower for anyone</text><text x='410' y='252' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>who cannot reach higher.</text><text x='410' y='300' font-size='16' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Below 27 in</text><text x='410' y='322' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Shoe shelf, 6 in deep, leaves</text><text x='410' y='342' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>30 in at the floor.</text><text x='410' y='390' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Move everything else to a</text><text x='410' y='410' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>closet, bench or another room.</text><text x='20' y='480' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Heights are planning examples. Hang your own coat to check the depth.</text></svg>