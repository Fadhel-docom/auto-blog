<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 500' role='img' aria-labelledby='t d'><title id='t'>Laundry items placed by reach height</title><desc id='d'>Front view of a wall with an easy reach band between 15 and 48 inches. A wall shelf at 46 inches holds detergent and towels, and a three-tier cart holds delicates in the top bin, everyday clothes in the middle bin and towels and bedding in the bottom bin below 15 inches.</desc><rect x='0' y='0' width='700' height='500' rx='0' fill='#fbf9f4' stroke='none' stroke-width='1'/><text x='20' y='26' font-size='19' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Where each laundry item sits by height (front view, example)</text><rect x='90' y='34' width='520' height='416' rx='0' fill='#f6f2e8' stroke='#b8ad92' stroke-width='1'/><rect x='90' y='138.0' width='520' height='214.5' rx='0' fill='#dbe6cf' stroke='none' stroke-width='1'/><line x1='90' y1='138.0' x2='610' y2='138.0' stroke='#5b6a4a' stroke-width='2' stroke-dasharray='6 4'/><line x1='90' y1='352.5' x2='610' y2='352.5' stroke='#5b6a4a' stroke-width='2' stroke-dasharray='6 4'/><text x='82' y='142.0' font-size='13' text-anchor='end' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>48 in</text><text x='82' y='356.5' font-size='13' text-anchor='end' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>15 in</text><text x='82' y='454' font-size='13' text-anchor='end' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>0</text><text x='100' y='248.5' font-size='13' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Easy reach</text><rect x='130' y='151.0' width='220' height='6' rx='0' fill='#c9a56e' stroke='#8a6a3b' stroke-width='1'/><rect x='150' y='117.0' width='22' height='34' rx='0' fill='#ffffff' stroke='#6b6b6b' stroke-width='1'/><text x='161' y='111.0' font-size='11' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Detergent</text><rect x='200' y='125.0' width='70' height='26' rx='0' fill='#f3efe6' stroke='#b8ad92' stroke-width='1'/><text x='235' y='119.0' font-size='11' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Towels</text><text x='130' y='173.0' font-size='12' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Wall shelf: supplies under 48 in</text><rect x='400' y='216.0' width='120' height='214.5' rx='0' fill='none' stroke='#6b6b6b' stroke-width='3'/><rect x='408' y='220.0' width='104' height='58.5' rx='0' fill='#efe8d6' stroke='#b8ad92' stroke-width='1'/><rect x='408' y='287.5' width='104' height='58.5' rx='0' fill='#e6dfcb' stroke='#b8ad92' stroke-width='1'/><rect x='408' y='359.0' width='104' height='58.5' rx='0' fill='#efe8d6' stroke='#b8ad92' stroke-width='1'/><text x='530' y='252.5' font-size='13' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Delicates</text><text x='530' y='324.0' font-size='13' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Everyday clothes</text><text x='530' y='393.5' font-size='13' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Towels, bedding</text><text x='530' y='409.5' font-size='12' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>(below 15 in, weekly)</text><text x='20' y='490' font-size='13' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Cart heights are an example. Reach range from the ADA Chapter 3 guide.</text></svg>