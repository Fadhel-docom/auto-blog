<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 500' role='img' aria-labelledby='t d'><title id='t'>Wall zones by height for a small home office</title><desc id='d'>Side view of a wall with a 20 inch deep desk at about 29 inches, a shelf at 46 inches and three zones: below 15 inches for heavy or rare items, 15 to 48 inches for daily items and above 48 inches for light occasional items.</desc><rect width='700' height='500' fill='#fbf9f4'/><text x='20' y='30' font-size='21' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Wall zones by height (side view, example)</text><rect x='210' y='390' width='430' height='60' rx='0' fill='#ece7da' stroke='#b8ad92' stroke-width='1' opacity='1'/><rect x='210' y='258' width='430' height='132' rx='0' fill='#dbe6cf' stroke='#5b6a4a' stroke-width='1' opacity='1'/><rect x='210' y='162' width='430' height='96' rx='0' fill='#f4efe0' stroke='#b8ad92' stroke-width='1' opacity='1'/><line x1='90' y1='140' x2='90' y2='450' stroke='#7a6a4f' stroke-width='6'/><line x1='60' y1='450' x2='640' y2='450' stroke='#7a6a4f' stroke-width='4'/><rect x='90' y='330' width='80' height='8' rx='1' fill='#c9a56e' stroke='#8a6a3b' stroke-width='2' opacity='1'/><rect x='162' y='338' width='6' height='112' rx='0' fill='#c9a56e' stroke='#8a6a3b' stroke-width='1' opacity='1'/><rect x='104' y='320' width='52' height='10' rx='1' fill='#d8d2c4' stroke='#5b6a4a' stroke-width='2' opacity='1'/><rect x='90' y='262' width='48' height='5' rx='1' fill='#c9a56e' stroke='#8a6a3b' stroke-width='2' opacity='1'/><line x1='196' y1='450' x2='210' y2='450' stroke='#2f3a2f' stroke-width='2'/><text x='190' y='455' font-size='14' text-anchor='end' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>0</text><line x1='196' y1='390' x2='210' y2='390' stroke='#2f3a2f' stroke-width='2'/><text x='190' y='395' font-size='14' text-anchor='end' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>15</text><line x1='196' y1='334' x2='210' y2='334' stroke='#2f3a2f' stroke-width='2'/><text x='190' y='339' font-size='14' text-anchor='end' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>29</text><line x1='196' y1='258' x2='210' y2='258' stroke='#2f3a2f' stroke-width='2'/><text x='190' y='263' font-size='14' text-anchor='end' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>48</text><line x1='196' y1='162' x2='210' y2='162' stroke='#2f3a2f' stroke-width='2'/><text x='190' y='167' font-size='14' text-anchor='end' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>72 in</text><text x='226' y='427' font-size='15' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Below 15 in: heavy or rarely used items</text><text x='226' y='295' font-size='17' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>15–48 in: daily reach range</text><text x='226' y='315' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>(ADA unobstructed forward reach)</text><text x='226' y='332' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Desk surface about 29 in</text><text x='226' y='215' font-size='15' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Above 48 in: light, occasional items</text><text x='226' y='235' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>(use a step stool)</text><text x='94' y='356' font-size='12' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Desk</text><text x='94' y='370' font-size='12' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>20 in deep</text><text x='96' y='254' font-size='13' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Shelf at 46 in</text><text x='20' y='478' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Heights are planning examples. Measure your own screen before fixing a shelf above the desk.</text></svg>