<text x="250" y="40" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#37443b">Closed: 30 x 48 in (76 x 122 cm)</text>
<text x="750" y="40" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#37443b">Extended: 30 x 60 in (76 x 152 cm)</text>
