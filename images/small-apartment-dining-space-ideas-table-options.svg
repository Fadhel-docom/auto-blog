<title id="t">Closed and extended table footprints</title><desc id="d">Two top-down sketches. Left: a closed 30 by 48 inch table with four seats and 32 inch zones on the long sides. Right: the same table extended to 30 by 60 inches with six seats, two of them at the ends.</desc>
