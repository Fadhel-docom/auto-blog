<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 410' role='img' aria-labelledby='t d'><title id='t'>Humidity scale for drying laundry indoors</title><desc id='d'>A scale from 0 to 100 percent relative humidity with an ideal band at 30 to 50 percent, a caution band up to 60 percent and a mold-risk zone above 60 percent, plus a note that one load of washing releases about 2 litres of water.</desc><rect x='0' y='0' width='700' height='410' rx='0' fill='#fbf9f4' stroke='none' stroke-width='1'/><text x='20' y='30' font-size='19' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Indoor humidity while laundry dries</text><rect x='60.0' y='100' width='174.0' height='44' rx='0' fill='#e9eef2' stroke='#b8ad92' stroke-width='1'/><rect x='234.0' y='100' width='116.0' height='44' rx='0' fill='#bfd9b0' stroke='#5b6a4a' stroke-width='1'/><rect x='350.0' y='100' width='58.0' height='44' rx='0' fill='#f1e3a6' stroke='#b8ad92' stroke-width='1'/><rect x='408.0' y='100' width='232.0' height='44' rx='0' fill='#e8b4a8' stroke='#b8ad92' stroke-width='1'/><text x='292.0' y='90' font-size='13' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Ideal 30-50%</text><text x='408.0' y='172' font-size='13' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Stay below 60%</text><text x='524.0' y='128' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Mold risk rises</text><text x='60.0' y='168' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>0%</text><text x='234.0' y='168' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>30%</text><text x='350.0' y='186' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>50%</text><text x='640.0' y='168' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>100%</text><rect x='60' y='225' width='580' height='110' rx='6' fill='#ffffff' stroke='#b8ad92' stroke-width='1'/><text x='80' y='258' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>One load of washing releases about 2 litres of water into the room as it dries</text><text x='80' y='280' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>(roughly half a US gallon).</text><text x='80' y='308' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Check the room with a small hygrometer and dry damp items within 24 to 48 hours.</text><text x='20' y='385' font-size='13' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Example scale. Targets from the EPA mold and moisture guide.</text></svg>