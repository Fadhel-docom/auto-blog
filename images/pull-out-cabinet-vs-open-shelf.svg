0' height='26' rx='2' fill='#f4efe0' stroke='#5b6a4a' stroke-width='1.5' opacity='1'/><rect x='498' y='224' width='20' height='26' rx='2' fill='#e9d29b' stroke='#5b6a4a' stroke-width='1.5' opacity='1'/><rect x='526' y='224' width='20' height='26' rx='2' fill='#8f9a7a' stroke='#5b6a4a' stroke-width='1.5' opacity='1'/><rect x='430' y='300' width='140' height='8' rx='3' fill='#c9a56e' stroke='#8a6a3b' stroke-width='1' opacity='1'/><rect x='442' y='266' width='50' height='34' rx='3' fill='#b88f5a' stroke='#8a6a3b' stroke-width='1' opacity='1'/><rect x='500' y='266' width='50' height='34' rx='3' fill='#b88f5a' stroke='#8a6a3b' stroke-width='1' opacity='1'/><text x='30' y='330' font-size='18' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>+ Doors block light and dust</text><text x='30' y='360' font-size='18' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>+ Pull-out shows full depth</text><text x='30' y='390' font-size='18' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>– Costs more, needs fitting</text><text x='30' y='420' font-size='18' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>– Door and shelves need clearance</text><text x='370' y='330' font-size='18' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>+ No install, moves with you</text><text x='370' y='360' font-size='18' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>+ Everything visible at once</text><text x='370' y='390' font-size='18' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>– Open to light, dust, grease</text><text x='370' y='420' font-size='18' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>– Needs matching containers</text><text x='20' y='468' font-size='16' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Not to scale. Typical tall pantry cabinets: 18 to 36 in wide,</text><text x='20' y='490' font-size='16' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>84 to 96 in tall, 24 in deep (Quik Cabinets).</text></svg>