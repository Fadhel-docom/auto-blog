<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 500' role='img' aria-labelledby='t d'><title id='t'>Holiday bins placed by reach in a closet</title><desc id='d'>Front view of a closet: off-season bins on a high shelf above 48 inches, the in-season bin on a shelf at about 40 inches, and a tall artificial tree box on the floor with a step stool beside it.</desc><rect width='700' height='500' fill='#fbf9f4'/><text x='20' y='30' font-size='21' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Place bins by how often you reach them (front view, example)</text><rect x='90' y='50' width='300' height='400' rx='0' fill='#f6f2e8' stroke='#b8ad92' stroke-width='1' opacity='1'/><rect x='90' y='210' width='300' height='165' rx='0' fill='#dbe6cf' stroke='none' stroke-width='0' opacity='1'/><rect x='90' y='375' width='300' height='75' rx='0' fill='#ece7da' stroke='none' stroke-width='0' opacity='1'/><line x1='90' y1='210' x2='390' y2='210' stroke='#5b6a4a' stroke-width='2' stroke-dasharray='6 4'/><line x1='90' y1='375' x2='390' y2='375' stroke='#5b6a4a' stroke-width='2' stroke-dasharray='6 4'/><text x='80' y='455' font-size='13' text-anchor='end' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>0</text><text x='80' y='380' font-size='13' text-anchor='end' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>15</text><text x='80' y='215' font-size='13' text-anchor='end' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>48</text><text x='80' y='135' font-size='13' text-anchor='end' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>64 in</text><rect x='90' y='130' width='300' height='5' rx='1' fill='#c9a56e' stroke='#8a6a3b' stroke-width='2' opacity='1'/><rect x='110' y='88' width='110' height='40' rx='6' fill='#f3d9d9' stroke='#5b6a4a' stroke-width='2' opacity='1'/><rect x='240' y='88' width='110' height='40' rx='6' fill='#fff0c9' stroke='#5b6a4a' stroke-width='2' opacity='1'/><text x='165' y='112' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Off-season</text><text x='295' y='112' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Off-season</text><rect x='90' y='250' width='300' height='5' rx='1' fill='#c9a56e' stroke='#8a6a3b' stroke-width='2' opacity='1'/><rect x='110' y='212' width='110' height='36' rx='6' fill='#dbe6cf' stroke='#5b6a4a' stroke-width='2' opacity='1'/><text x='165' y='234' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>In season</text><rect x='200' y='355' width='90' height='95' rx='4' fill='#d8d2c4' stroke='#5b6a4a' stroke-width='2' opacity='1'/><text x='245' y='406' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Tree box</text><rect x='315' y='415' width='55' height='35' rx='3' fill='#e3c9a6' stroke='#8a6a3b' stroke-width='2' opacity='1'/><text x='342' y='436' font-size='11' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Stool</text><text x='420' y='100' font-size='16' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Above 48 in</text><text x='420' y='122' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Light bins used once a year.</text><text x='420' y='142' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Use a step stool.</text><text x='420' y='200' font-size='16' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>15 to 48 in</text><text x='420' y='222' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>The ADA reach range. Keep the</text><text x='420' y='242' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>bin you open every season here.</text><text x='420' y='330' font-size='16' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Below 15 in</text><text x='420' y='352' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>The heaviest, tallest box, like an</text><text x='420' y='372' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>artificial tree, goes on the floor.</text><text x='20' y='478' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Heights are planning examples. Check each bin's weight before lifting it overhead.</text></svg>