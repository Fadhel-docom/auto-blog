<svg xmlns="http://www.w3.org/2000/svg" width="700" height="450" viewBox="0 0 700 450" role="img" aria-labelledby="title desc">
<title>Ten-minute decluttering reset</title>
<desc>A five-step ten-minute maintenance sequence for returning misplaced items and clearing high-traffic surfaces.</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2F7F79"/></marker>
</defs>
<rect width="700" height="450" rx="24" fill="#F6F1E8"/>
<text x="40" y="48" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1F3A34">Ten-minute reset</text>
<text x="40" y="78" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#5E6B66">Maintenance only: return, clear, process, repeat.</text>

<rect x="40" y="110" width="620" height="55" rx="18" fill="#E6EEF2"/>
<circle cx="75" cy="138" r="21" fill="#2F7F79"/><text x="68" y="145" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#F6F1E8">1</text>
<text x="112" y="145" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#1F3A34">Return misplaced items</text>
<path d="M350 165 L350 185" stroke="#2F7F79" stroke-width="4" marker-end="url(#arrow)"/>

<rect x="40" y="195" width="620" height="55" rx="18" fill="#DCEBDD"/>
<circle cx="75" cy="223" r="21" fill="#C4622D"/><text x="68" y="230" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#F6F1E8">2</text>
<text x="112" y="230" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#1F3A34">Clear one high-traffic surface</text>
<path d="M350 250 L350 270" stroke="#2F7F79" stroke-width="4" marker-end="url(#arrow)"/>

<rect x="40" y="280" width="620" height="55" rx="18" fill="#F3E3D3"/>
<circle cx="75" cy="308" r="21" fill="#2F7F79"/><text x="68" y="315" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#F6F1E8">3</text>
<text x="112" y="315" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#1F3A34">Put away clothing</text>
<path d="M350 335 L350 355" stroke="#2F7F79" stroke-width="4" marker-end="url(#arrow)"/>

<rect x="40" y="365" width="295" height="55" rx="18" fill="#E6EEF2"/>
<circle cx="75" cy="393" r="21" fill="#C4622D"/><text x="68" y="400" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#F6F1E8">4</text>
<text x="112" y="389" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#1F3A34">Process rubbish</text>
<text x="112" y="412" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#1F3A34">and recycling</text>

<rect x="365" y="365" width="295" height="55" rx="18" fill="#E6EEF2"/>
<circle cx="400" cy="393" r="21" fill="#2F7F79"/><text x="393" y="400" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#F6F1E8">5</text>
<text x="437" y="389" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#1F3A34">Return daily</text>
<text x="437" y="412" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#1F3A34">items home</text>
</svg>