<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 500' role='img' aria-labelledby='t d'><title id='t'>Locked wall cabinet and cart layout</title><desc id='d'>A locked wall cabinet with three shelves holds bleach products in their own bin, daily sprays and gloves, with a lock on the door. A rolling cart below holds only cloths, a brush and sponge, and dry towels. A dashed line marks the 48 inch reach limit.</desc><rect x='0' y='0' width='700' height='500' rx='0' fill='#fbf9f4' stroke='none' stroke-width='1'/><text x='20' y='26' font-size='19' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Cabinet and cart layout (front view, example heights)</text><rect x='90' y='34' width='520' height='416' rx='0' fill='#f6f2e8' stroke='#b8ad92' stroke-width='1'/><line x1='90' y1='138.0' x2='610' y2='138.0' stroke='#5b6a4a' stroke-width='2' stroke-dasharray='6 4'/><text x='82' y='142.0' font-size='13' text-anchor='end' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>48 in</text><text x='82' y='454' font-size='13' text-anchor='end' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>0</text><rect x='150' y='99.0' width='240' height='156.0' rx='0' fill='#ffffff' stroke='#6b6b6b' stroke-width='3'/><line x1='150' y1='151.0' x2='390' y2='151.0' stroke='#b8ad92' stroke-width='2'/><line x1='150' y1='203.0' x2='390' y2='203.0' stroke='#b8ad92' stroke-width='2'/><text x='160' y='129.0' font-size='13' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Bleach products: own bin</text><text x='160' y='181.0' font-size='13' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Daily sprays, original bottles</text><text x='160' y='233.0' font-size='13' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Gloves and spare cloths</text><rect x='366' y='164.0' width='14' height='28' rx='0' fill='#d9534f' stroke='none' stroke-width='1'/><text x='398' y='194.0' font-size='13' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Lock or child latch</text><rect x='430' y='268.0' width='100' height='169.0' rx='0' fill='none' stroke='#6b6b6b' stroke-width='3'/><rect x='436' y='272.0' width='88' height='52.0' rx='0' fill='#efe8d6' stroke='#b8ad92' stroke-width='1'/><rect x='436' y='326.5' width='88' height='52.0' rx='0' fill='#e6dfcb' stroke='#b8ad92' stroke-width='1'/><rect x='436' y='385.0' width='88' height='52.0' rx='0' fill='#efe8d6' stroke='#b8ad92' stroke-width='1'/><text x='540' y='298.0' font-size='13' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Cloths</text><text x='540' y='356.5' font-size='13' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Brush, sponge</text><text x='540' y='415.0' font-size='13' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Dry towels</text><text x='20' y='490' font-size='13' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Heights are an example. Reach range from the ADA Chapter 3 guide; the lock does the safety work.</text></svg>