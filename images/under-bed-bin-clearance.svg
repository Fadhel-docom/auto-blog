<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 510' role='img' aria-labelledby='t d'><title id='t'>Under-bed bin clearance</title><desc id='d'>Side view of a bed on legs with a flat fabric bin underneath: clearance A is 10 inches, the bin is 9 inches tall, leaving 1 inch spare, and it pulls out toward the foot of the bed.</desc><rect width='700' height='510' fill='#fbf9f4'/><text x='20' y='30' font-size='21' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Under-bed bins: side view (example)</text><line x1='20' y1='360' x2='680' y2='360' stroke='#8a6a3b' stroke-width='3' /><rect x='60' y='200' width='500' height='80' rx='6' fill='#e4dccb' stroke='#8a7a5c' stroke-width='3' opacity='1' /><rect x='60' y='200' width='60' height='80' rx='6' fill='#f4efe0' stroke='#8a7a5c' stroke-width='2' opacity='1' /><rect x='70' y='280' width='14' height='80' rx='2' fill='#c9a56e' stroke='#8a6a3b' stroke-width='2' opacity='1' /><rect x='536' y='280' width='14' height='80' rx='2' fill='#c9a56e' stroke='#8a6a3b' stroke-width='2' opacity='1' /><rect x='180' y='288' width='240' height='72' rx='4' fill='#d8d2c4' stroke='#5b6a4a' stroke-width='3' opacity='1' /><text x='300' y='332' font-size='17' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Flat fabric bin</text><line x1='40' y1='280' x2='40' y2='360' stroke='#8a6a3b' stroke-width='2' /><line x1='33' y1='280' x2='47' y2='280' stroke='#8a6a3b' stroke-width='2' /><line x1='33' y1='360' x2='47' y2='360' stroke='#8a6a3b' stroke-width='2' /><circle cx='40' cy='320' r='0.1' fill='none'/><text x='60' y='186' font-size='15' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Head</text><text x='540' y='186' font-size='15' text-anchor='end' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Foot</text><line x1='430' y1='324' x2='520' y2='324' stroke='#5b6a4a' stroke-width='3' /><polygon points='520,324 511,329 511,319' fill='#5b6a4a'/><text x='20' y='396' font-size='17' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>A = floor to lowest part of the frame (example 10 in). Bin 9 in tall leaves 1 in spare.</text><text x='20' y='422' font-size='17' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Measure A at several points, and pull bins out toward the foot, not the clear side.</text><rect x='20' y='438' width='660' height='58' rx='8' fill='#dbe6cf' stroke='#5b6a4a' stroke-width='2' opacity='1' /><text x='36' y='462' font-size='17' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Store textiles dry. EPA: dry damp items within 24 to 48 hours</text><text x='36' y='486' font-size='17' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>to prevent mold growth.</text><circle cx='40' cy='320' r='13' fill='#8a6a3b'/><text x='40' y='326' font-size='17' text-anchor='middle' font-weight='bold' fill='#fff' font-family='Helvetica,Arial,sans-serif'>A</text></svg>