<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t7 d7"><title id="t7">Under-bed drawer side view</title><desc id="d7">Side view of a bed on legs with a drawer box underneath. Measurement A is the clearance from floor to the lowest part of the frame, and the drawer length is limited by the slide.</desc><rect width="800" height="400" fill="#fbf7f1"/><rect x="40" y="330" width="720" height="10" fill="#8a6a3b"/><rect x="80" y="170" width="520" height="40" rx="8" fill="#cfe3ea" stroke="#3d6f80" stroke-width="3"/><rect x="80" y="210" width="520" height="22" rx="4" fill="#e8d5b7" stroke="#8a6a3b" stroke-width="3"/><rect x="90" y="232" width="18" height="98" rx="0" fill="#8a6a3b" stroke="#8a6a3b" stroke-width="1"/><rect x="572" y="232" width="18" height="98" rx="0" fill="#8a6a3b" stroke="#8a6a3b" stroke-width="1"/><rect x="150" y="268" width="300" height="56" rx="4" fill="#ffffff" stroke="#2e8b57" stroke-width="3"/><text x="300" y="302" font-size="18" font-weight="bold" fill="#256b43" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Drawer box</text><line x1="150" y1="344" x2="450" y2="344" stroke="#c0392b" stroke-width="3"/><text x="300" y="368" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Drawer length: limited by the slide</text><line x1="640" y1="232" x2="640" y2="330" stroke="#c0392b" stroke-width="3"/><text x="655" y="272" font-size="26" font-weight="bold" fill="#c0392b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">A</text><text x="655" y="298" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">clearance</text><text x="80" y="60" font-size="18" font-weight="bold" fill="#3b2f23" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Drawer height = A minus slide and wheel allowance</text><text x="80" y="92" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Check the slide maker's data sheet for load rating</text></svg>