<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t3 d3"><title id="t3">Closet hanging zones</title><desc id="d3">Front view of a closet with a shelf on top, an upper rod for short garments, and a full-height section for long coats and dresses.</desc><rect width="800" height="420" fill="#fbf7f1"/><rect x="60" y="30" width="300" height="370" rx="0" fill="#fffdf9" stroke="#5b4a3a" stroke-width="6"/><line x1="80" y1="90" x2="340" y2="90" stroke="#8a6a3b" stroke-width="6"/><line x1="80" y1="230" x2="340" y2="230" stroke="#8a6a3b" stroke-width="6"/><rect x="95" y="96" width="14" height="70" rx="3" fill="#cfe3ea" stroke="#3d6f80" stroke-width="2"/><rect x="127" y="96" width="14" height="70" rx="3" fill="#cfe3ea" stroke="#3d6f80" stroke-width="2"/><rect x="159" y="96" width="14" height="70" rx="3" fill="#cfe3ea" stroke="#3d6f80" stroke-width="2"/><rect x="191" y="96" width="14" height="70" rx="3" fill="#cfe3ea" stroke="#3d6f80" stroke-width="2"/><rect x="223" y="96" width="14" height="70" rx="3" fill="#cfe3ea" stroke="#3d6f80" stroke-width="2"/><rect x="255" y="96" width="14" height="70" rx="3" fill="#cfe3ea" stroke="#3d6f80" stroke-width="2"/><rect x="287" y="96" width="14" height="70" rx="3" fill="#cfe3ea" stroke="#3d6f80" stroke-width="2"/><rect x="319" y="96" width="14" height="70" rx="3" fill="#cfe3ea" stroke="#3d6f80" stroke-width="2"/><rect x="95" y="236" width="18" height="120" rx="3" fill="#f3dccf" stroke="#b5683c" stroke-width="2"/><rect x="135" y="236" width="18" height="120" rx="3" fill="#f3dccf" stroke="#b5683c" stroke-width="2"/><rect x="175" y="236" width="18" height="120" rx="3" fill="#f3dccf" stroke="#b5683c" stroke-width="2"/><rect x="215" y="236" width="18" height="120" rx="3" fill="#f3dccf" stroke="#b5683c" stroke-width="2"/><rect x="255" y="236" width="18" height="120" rx="3" fill="#f3dccf" stroke="#b5683c" stroke-width="2"/><rect x="295" y="236" width="18" height="120" rx="3" fill="#f3dccf" stroke="#b5683c" stroke-width="2"/><rect x="80" y="40" width="260" height="36" rx="4" fill="#e7f0d9" stroke="#6f9a3a" stroke-width="2"/><text x="210" y="64" font-size="15" font-weight="bold" fill="#456b1d" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Shelf: folded, light</text><rect x="400" y="30" width="370" height="370" rx="10" fill="#fff" stroke="#d9cdbd" stroke-width="2"/><text x="420" y="64" font-size="19" font-weight="bold" fill="#3b2f23" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Match the rod to the clothes</text><text x="420" y="98" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Upper rod: shirts, jackets,</text><text x="420" y="126" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">folded-length items</text><text x="420" y="154" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Space below must clear the hem</text><text x="420" y="182" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Long coats and dresses need</text><text x="420" y="210" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">one full-height section</text><text x="420" y="238" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Measure your longest garment</text><text x="420" y="266" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">before you add a second rod</text></svg>