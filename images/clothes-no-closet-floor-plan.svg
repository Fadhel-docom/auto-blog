<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 440' role='img' aria-labelledby='t d'><title id='t'>Example bedroom floor plan with rack, dresser and bed</title><desc id='d'>Top view of an example 108 by 132 inch room with a 60 by 80 inch bed, a 39 by 18 inch rack and a 30 by 18 inch dresser along the bottom wall, leaving a 34 inch clear path.</desc><rect x='0' y='0' width='700' height='440' rx='0' fill='#fbf9f4' stroke='none' stroke-width='1'/><text x='20' y='20' font-size='19' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Example floor plan: a 34 in path</text><rect x='20' y='30' width='324' height='396' rx='0' fill='#ffffff' stroke='#2f3a2f' stroke-width='3'/><rect x='92' y='30' width='180' height='240' rx='4' fill='#9aa98a' stroke='#5b6a4a' stroke-width='2'/><text x='182' y='165' font-size='13' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Bed 60 × 80</text><rect x='38' y='372' width='117' height='55' rx='2' fill='#5b6a4a' stroke='none' stroke-width='1'/><text x='96.5' y='404' font-size='12' text-anchor='middle' font-weight='bold' fill='#ffffff' font-family='Helvetica,Arial,sans-serif'>Rack 39 × 18</text><rect x='188' y='372' width='90' height='55' rx='2' fill='#b9a27a' stroke='none' stroke-width='1'/><text x='233' y='404' font-size='12' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Dresser 30 × 18</text><line x1='182' y1='274' x2='182' y2='368' stroke='#b5523b' stroke-width='2' stroke-dasharray='5 4'/><text x='190' y='324' font-size='13' text-anchor='start' font-weight='bold' fill='#b5523b' font-family='Helvetica,Arial,sans-serif'>34 in clear path</text><text x='370' y='90' font-size='13' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Example room: 108 × 132 in (9 × 11 ft)</text><text x='370' y='116' font-size='13' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Bed: 60 × 80 in (example, queen size)</text><text x='370' y='142' font-size='13' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Rack: 39 × 18 1/8 in (IKEA MULIG)</text><text x='370' y='168' font-size='13' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Dresser: 30 × 18 in (example; measure yours)</text><text x='370' y='220' font-size='13' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Path: 132 − 80 − 18 = 34 in</text><text x='370' y='246' font-size='13' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Walking width target: 30–36 in</text><text x='370' y='298' font-size='13' text-anchor='start' font-weight='normal' fill='#b5523b' font-family='Helvetica,Arial,sans-serif'>Pull a drawer fully open and</text><text x='370' y='324' font-size='13' text-anchor='start' font-weight='normal' fill='#b5523b' font-family='Helvetica,Arial,sans-serif'>measure again. The path can drop</text><text x='370' y='350' font-size='13' text-anchor='start' font-weight='normal' fill='#b5523b' font-family='Helvetica,Arial,sans-serif'>below 30 in. Move the dresser</text><text x='370' y='376' font-size='13' text-anchor='start' font-weight='normal' fill='#b5523b' font-family='Helvetica,Arial,sans-serif'>or choose a shallower one.</text></svg>
