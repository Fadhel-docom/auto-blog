<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d"><title id="t">A play corner in a 12 by 10 ft living room</title><desc id="d">Top-down plan of a living room corner for toys: a low shelf and a basket on one wall, a play rug in front of them, and a 36 inch clear walking path along the opposite side of the room.</desc><rect width="800" height="560" fill="#faf6ef"/><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5522f"/></marker></defs><text x="400.0" y="36" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#23363a">A play corner in a 12 by 10 ft living room</text><text x="400.0" y="60" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#55696a">Top view, planning example: toys live on one wall, the path stays clear</text><rect x="60" y="90" width="518.4" height="432.0" fill="#fff" stroke="#23363a" stroke-width="3"/><rect x="448.8" y="90.0" width="129.6" height="432.0" rx="4" fill="#e6efd2" stroke="#2f6f62" stroke-width="1.5"/><text x="513.6" y="306.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#23363a">Keep clear</text><text x="513.6" y="324.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#23363a">walking path</text><rect x="88.8" y="90.0" width="216.0" height="54.0" rx="4" fill="#dbe9e4" stroke="#2f6f62" stroke-width="1.5"/><text x="196.8" y="123.8" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Low shelf + bins</text><rect x="319.2" y="90.0" width="79.2" height="79.2" rx="4" fill="#f3e3c8" stroke="#b5522f" stroke-width="1.5"/><text x="358.8" y="133.6" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#23363a">Soft toys</text><rect x="88.8" y="212.4" width="288.0" height="201.6" rx="4" fill="#f3e3c8" stroke="#b5522f" stroke-width="1.5"/><text x="232.8" y="318.20000000000005" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#23363a">Play rug</text><rect x="88.8" y="450.0" width="302.4" height="72.0" rx="4" fill="#dbe9e4" stroke="#2f6f62" stroke-width="1.5"/><text x="240.0" y="491.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#23363a">Sofa</text><line x1="448.8" y1="162.0" x2="578.4" y2="162.0" stroke="#b5522f" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/><rect x="479.6" y="152.0" width="68" height="20" rx="4" fill="#faf6ef"/><text x="513.6" y="167.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#b5522f">36 in</text><line x1="420.0" y1="90" x2="420.0" y2="144.0" stroke="#b5522f" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/><rect x="386.0" y="107.0" width="68" height="20" rx="4" fill="#faf6ef"/><text x="420.0" y="122.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#b5522f">15 in</text><text x="620" y="150" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#23363a">How to read it</text><text x="620" y="176" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#55696a">Toys stay on one wall, with</text><text x="620" y="196" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#55696a">the rug right in front so play</text><text x="620" y="216" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#55696a">and cleanup happen in one spot.</text><text x="620" y="236" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#55696a"></text><text x="620" y="256" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#55696a">The side strip stays clear.</text><text x="620" y="276" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#55696a"></text><text x="620" y="296" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#55696a">Sizes are a planning example,</text><text x="620" y="316" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#55696a">not a requirement.</text></svg>