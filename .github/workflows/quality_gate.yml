name: Independent Quality Gate

on:
  workflow_dispatch:
  push:
    paths:
      - 'content/posts/**'
      - 'website/articles/**'
      - 'scripts/quality_gate.py'
      - 'scripts/publish_guard.py'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/quality_gate.py
