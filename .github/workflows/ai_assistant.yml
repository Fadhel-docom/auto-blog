name: AI Assistant

on:
  schedule:
    - cron: "30 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-assistant
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Run AI assistant
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_AI_MODEL: "openai/gpt-oss-20b"
        run: |
          python scripts/ai_assistant.py

      - name: Commit AI suggestions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/ai_suggestions/
          if git diff --cached --quiet; then
            echo "No AI suggestion changes."
          else
            git commit -m "AI assistant: record maintenance suggestions"
            git push
          fi
