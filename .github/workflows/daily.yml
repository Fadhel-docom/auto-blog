name: Daily Auto Blog

on:
  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f scripts/requirements.txt ]; then
            python -m pip install -r scripts/requirements.txt
          fi

      - name: Configure Python path
        run: |
          echo "PYTHONPATH=$GITHUB_WORKSPACE/scripts:$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          python -c "import sys; print('PYTHONPATH configured')"

      - name: Generate article
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: "openai/gpt-oss-120b"
        run: |
          python scripts/generate_post.py

      - name: Upgrade article depth
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: "openai/gpt-oss-120b"
        run: |
          python scripts/content_upgrade.py

      - name: Create competitive image plan
        run: |
          python scripts/competitive_image_plan.py

      - name: Download competitive images
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python scripts/competitive_fetch.py

      - name: Run competitive SEO check
        run: |
          python scripts/competitive_seo_check.py

      - name: Publish Hugo article content
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          python scripts/competitive_publish.py

      - name: Insert remaining competitive images
        run: |
          python scripts/insert_competitive_images.py

      - name: Verify generated article
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path.cwd()
          article_path = root / "article.json"

          if not article_path.exists():
              print("ERROR: article.json is missing.")
              sys.exit(1)

          with article_path.open("r", encoding="utf-8") as file:
              article = json.load(file)

          slug = article.get("slug")

          if not isinstance(slug, str) or not slug.strip():
              print("ERROR: Article slug is missing.")
              sys.exit(1)

          post_path = root / "content" / "posts" / f"{slug}.md"

          if not post_path.exists():
              print(f"ERROR: Published post does not exist: {post_path}")
              sys.exit(1)

          content = post_path.read_text(encoding="utf-8")
          image_count = content.count("![")
          article_images = article.get("images")

          print(f"Slug: {slug}")
          print(f"Post: {post_path}")
          print(f"Markdown image count: {image_count}")
          print(
              "article.json image count: "
              f"{len(article_images) if isinstance(article_images, list) else 0}"
          )

          if not isinstance(article_images, list):
              print("ERROR: article.json images is not a list.")
              sys.exit(1)

          if len(article_images) != 10:
              print("ERROR: article.json must contain exactly 10 images.")
              sys.exit(1)

          if image_count < 10:
              print("ERROR: Published Markdown contains fewer than 10 images.")
              sys.exit(1)

          print("Final article verification passed.")
          PY

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit generated content
        run: |
          git add article.json
          git add keywords.csv
          git add content/posts/
          git add static/images/

          if git diff --cached --quiet; then
            echo "No generated changes detected."
            exit 0
          fi

          git commit -m "Add daily competitive blog post"

      - name: Push changes
        run: |
          git push

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.128.0"
          extended: true

      - name: Verify Hugo version
        run: |
          hugo version

      - name: Build Hugo
        run: |
          hugo --gc --minify --baseURL "https://fadhel-docom.github.io/auto-blog/"

      - name: Verify Hugo build
        run: |
          if [ ! -d public ]; then
            echo "ERROR: Hugo did not create public/"
            exit 1
          fi

          if [ ! -f public/index.html ]; then
            echo "ERROR: public/index.html is missing"
            exit 1
          fi

          echo "Hugo build verified successfully."

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true
