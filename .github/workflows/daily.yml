name: Daily Auto Blog

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements.txt

      - name: Generate article
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: "llama-3.1-8b-instant"
        run: |
          python scripts/generate_post.py

      - name: Fetch article image
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python scripts/fetch_image.py

      - name: Run SEO check
        run: |
          python scripts/seo_check.py

      - name: Publish Hugo post
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          python scripts/publish.py

      - name: Show generated files
        run: |
          echo "Git status:"
          git status --short
          echo ""
          echo "Posts:"
          find content/posts -maxdepth 1 -type f -print 2>/dev/null || true
          echo ""
          echo "Images:"
          find static/images -maxdepth 1 -type f -print 2>/dev/null || true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit changes
        run: |
          git add article.json
          git add keywords.csv
          git add content/posts/
          git add static/images/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add daily blog post"

      - name: Push changes
        run: |
          git push
