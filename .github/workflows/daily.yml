name: Daily Auto Blog

on:
  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements.txt

      - name: Configure Python path
        run: |
          echo "PYTHONPATH=$GITHUB_WORKSPACE/scripts:$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Generate article
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: "openai/gpt-oss-120b"
        run: |
          python scripts/generate_post.py

      - name: Upgrade article content
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: "openai/gpt-oss-120b"
        run: |
          python scripts/content_upgrade.py

      - name: Create competitive image plan
        run: |
          python scripts/competitive_image_plan.py

      - name: Fetch competitive images
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python scripts/competitive_fetch.py

      - name: Run competitive SEO check
        run: |
          python scripts/competitive_seo_check.py

      - name: Publish Hugo post
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          python scripts/competitive_publish.py

      - name: Insert competitive images
        run: |
          python scripts/insert_competitive_images.py

      - name: Final competitive SEO check
        run: |
          python scripts/competitive_seo_check.py

      - name: Install Hugo 0.128.0 Extended
        env:
          HUGO_VERSION: "0.128.0"
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
          hugo version

      - name: Build Hugo site
        env:
          HUGO_ENVIRONMENT: production
        run: |
          hugo --gc --minify --baseURL "${{ secrets.SITE_URL }}/"

      - name: Verify Hugo output
        run: |
          if [ ! -d public ]; then
            echo "ERROR: Hugo did not create public/"
            exit 1
          fi

          if [ ! -f public/index.html ]; then
            echo "ERROR: public/index.html is missing"
            exit 1
          fi

          echo "Hugo build verified successfully."

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit source changes
        run: |
          git add article.json
          git add keywords.csv
          git add content/posts/
          git add static/images/

          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Add daily blog post"
            git push
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          commit_message: "Deploy daily Hugo site"
