name: Daily Auto Blog

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/openai_generate_post.py"
  schedule:
    - cron: "0 5 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "daily-auto-blog"
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests json-repair
          if [ -f scripts/requirements.txt ]; then python -m pip install -r scripts/requirements.txt; fi
      - name: Configure Python path
        run: echo "PYTHONPATH=$PWD" >> "$GITHUB_ENV"
      - name: Generate article with primary and free fallback
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: "gpt-5.6"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: "openrouter/free"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: "openai/gpt-oss-120b"
        run: python scripts/openai_generate_post.py
      - name: Normalize article slug
        run: python scripts/normalize_slug.py
      - name: Fetch six competitive images
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/competitive_fetch.py
      - name: Run competitive SEO check
        run: python scripts/competitive_seo_check.py
      - name: Publish Hugo post
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: python scripts/competitive_publish.py
      - name: Normalize post categories
        run: python scripts/fix_post_categories.py
      - name: Final competitive SEO check
        run: python scripts/competitive_seo_check.py
      - name: Hard content safety gate
        run: python scripts/publish_guard.py
      - name: Install Hugo 0.128.0 Extended
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78
        with:
          hugo-version: "0.128.0"
          extended: true
      - name: Build Hugo site
        run: hugo --gc --minify
      - name: Verify Hugo output
        run: |
          test -d public || (echo "ERROR: Hugo did not create public/" && exit 1)
          test -f public/index.html || (echo "ERROR: public/index.html is missing" && exit 1)
          echo "Hugo build verified."
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Commit source changes
        run: |
          git add article.json keywords.csv content/posts/ static/images/ data/
          if git diff --cached --quiet; then
            echo "No source changes detected."
          else
            git commit -m "Publish twice-daily editorial post"
            git push
          fi
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true