name: Link Audit

on:
  workflow_dispatch:
  # Push-triggered runs are paused during stabilization.
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78
        with:
          hugo-version: '0.128.0'
          extended: true

      - name: Build site
        run: hugo --minify

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Compile automation scripts
        run: |
          python -m py_compile \
            scripts/openai_generate_post.py \
            scripts/openai_quality_gate.py \
            scripts/queue_manager.py \
            scripts/publish_guard.py \
            scripts/competitive_fetch.py \
            scripts/competitive_publish.py \
            scripts/competitive_seo_check.py \
            scripts/automation_health.py \
            scripts/auto_repair.py

      - name: Run link audit
        run: python scripts/link_audit.py
