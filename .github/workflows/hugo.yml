name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_run:
    workflows: ["Daily Auto Blog"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.128.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Normalize Hugo RSS feed
        run: |
          python - <<'PY'
          import html
          import re
          from pathlib import Path
          from xml.sax.saxutils import escape as xml_escape

          feed = Path("public/index.xml")
          raw = feed.read_text(encoding="utf-8")

          def field(block, name):
              match = re.search(rf"<{name}>(.*?)</{name}>", block, flags=re.DOTALL)
              return html.unescape(re.sub(r"<[^>]+>", " ", match.group(1))).strip() if match else ""

          channel_match = re.search(r"<channel>(.*?)</channel>", raw, flags=re.DOTALL)
          if not channel_match:
              raise SystemExit("RSS normalization failed: channel missing")

          channel = channel_match.group(1)
          items = re.findall(r"<item>(.*?)</item>", channel, flags=re.DOTALL)

          title = field(channel, "title") or "Home Organization Ideas"
          link = field(channel, "link") or "https://fadhel-docom.github.io/auto-blog/"
          description = field(channel, "description") or "Practical home organization and small-space living ideas."

          output = [
              '<?xml version="1.0" encoding="utf-8" standalone="yes"?>',
              '<rss version="2.0" xmlns:atom="http://www.w3.org/2005/Atom">',
              '<channel>',
              f"<title>{xml_escape(title)}</title>",
              f"<link>{xml_escape(link)}</link>",
              f"<description>{xml_escape(description)}</description>",
              "<language>en-us</language>",
              "<generator>Hugo</generator>",
              f'<atom:link href="{xml_escape(link)}" rel="self" type="application/rss+xml" />',
          ]

          for block in items:
              item_title = field(block, "title")
              item_link = field(block, "link")
              item_guid = field(block, "guid") or item_link
              item_date = field(block, "pubDate")
              item_description = field(block, "description")

              if not item_title or not item_link:
                  continue

              output.extend([
                  "<item>",
                  f"<title>{xml_escape(item_title)}</title>",
                  f"<link>{xml_escape(item_link)}</link>",
                  f"<guid isPermaLink=\"true\">{xml_escape(item_guid)}</guid>",
                  f"<pubDate>{xml_escape(item_date)}</pubDate>" if item_date else "",
                  f"<description>{xml_escape(item_description)}</description>",
                  "</item>",
              ])

          output.extend(["</channel>", "</rss>"])
          feed.write_text("\n".join(line for line in output if line), encoding="utf-8")
          PY

      - name: Validate RSS feed for social automation
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.parse import urlparse

          feed = Path("public/index.xml")
          if not feed.exists():
              raise SystemExit("RSS validation failed: public/index.xml was not generated")

          raw = feed.read_bytes().lstrip(b"\xef\xbb\xbf \t\r\n")
          try:
              root = ET.fromstring(raw)
          except ET.ParseError as exc:
              print("RSS first lines:", repr(raw[:1200]))
              raise SystemExit(f"RSS validation failed: invalid XML: {exc}")
          if root.tag != "rss" or root.attrib.get("version") not in {"2.0", "2"}:
              raise SystemExit("RSS validation failed: expected RSS 2.x")

          channel = root.find("channel")
          if channel is None:
              raise SystemExit("RSS validation failed: missing channel")

          items = channel.findall("item")
          if not items:
              raise SystemExit("RSS validation failed: no items found")

          for item in items:
              link = item.findtext("link", "").strip()
              title = item.findtext("title", "").strip()
              if not link or not title:
                  raise SystemExit("RSS validation failed: every item needs title and link")
              if urlparse(link).netloc != urlparse("https://fadhel-docom.github.io").netloc:
                  raise SystemExit(f"RSS validation failed: off-domain link: {link}")

          print(f"RSS validation passed: {len(items)} items with image media and on-domain links")
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ./public

  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
