name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_run:
    workflows: ["Daily Auto Blog"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.128.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Normalize Hugo RSS feed
        run: |
          python - <<'PY'
          from pathlib import Path

          feed = Path("public/index.xml")
          if not feed.exists():
              raise SystemExit("RSS normalization failed: public/index.xml was not generated")

          import html
          import re
          from xml.sax.saxutils import escape as xml_escape

          raw = feed.read_bytes()
          escaped_declaration = b'&lt;?xml version="1.0" encoding="utf-8" standalone="yes"?><rss'
          if raw.startswith(escaped_declaration):
              raw = b'<?xml version="1.0" encoding="utf-8" standalone="yes"?><rss' + raw[len(escaped_declaration):]

          text = raw.decode("utf-8")
          xml_entities = {"&amp;", "&lt;", "&gt;", "&quot;", "&apos;"}

          def normalize_entity(match):
              entity = match.group(0)
              if entity in xml_entities or entity.startswith("&#"):
                  return entity
              return xml_escape(html.unescape(entity))

          text = re.sub(r"&[A-Za-z][A-Za-z0-9]+;", normalize_entity, text)
          feed.write_text(text, encoding="utf-8")
          PY

      - name: Validate RSS feed for social automation
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.parse import urlparse

          feed = Path("public/index.xml")
          if not feed.exists():
              raise SystemExit("RSS validation failed: public/index.xml was not generated")

          raw = feed.read_bytes().lstrip(b"\xef\xbb\xbf \t\r\n")
          try:
              root = ET.fromstring(raw)
          except ET.ParseError as exc:
              print("RSS first bytes:", repr(raw[:120]))
              raise SystemExit(f"RSS validation failed: invalid XML: {exc}")
          if root.tag != "rss" or root.attrib.get("version") not in {"2.0", "2"}:
              raise SystemExit("RSS validation failed: expected RSS 2.x")

          channel = root.find("channel")
          if channel is None:
              raise SystemExit("RSS validation failed: missing channel")

          items = channel.findall("item")
          if not items:
              raise SystemExit("RSS validation failed: no items found")

          for item in items:
              link = item.findtext("link", "").strip()
              title = item.findtext("title", "").strip()
              if not link or not title:
                  raise SystemExit("RSS validation failed: every item needs title and link")
              if urlparse(link).netloc != urlparse("https://fadhel-docom.github.io").netloc:
                  raise SystemExit(f"RSS validation failed: off-domain link: {link}")

          print(f"RSS validation passed: {len(items)} items with image media and on-domain links")
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
