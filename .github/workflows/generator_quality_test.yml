name: Generator Quality Test (No Publish)

# Manual end-to-end test. All generated files stay on the ephemeral runner.
# This workflow never commits, pushes, deploys, or submits URLs for indexing.
on:
  workflow_dispatch:
    inputs:
      keyword:
        description: "Topic for the temporary test article"
        required: true
        default: "small bedroom organization ideas for renters"
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEFER_QUEUE_STATUS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 20

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests json-repair
          if [ -f scripts/requirements.txt ]; then python -m pip install -r scripts/requirements.txt; fi

      - name: Generate temporary article
        env:
          TARGET_KEYWORD: ${{ inputs.keyword }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: "openai/gpt-oss-120b"
          GROQ_SECONDARY_MODEL: "openai/gpt-oss-20b"
        run: python scripts/openai_generate_post.py

      - name: Verify generator output contract
        run: |
          python -m py_compile scripts/openai_generate_post.py scripts/publish.py scripts/competitive_fetch.py scripts/publish_guard.py
          python - <<'PY'
          import json
          from pathlib import Path
          a = json.loads(Path("article.json").read_text(encoding="utf-8"))
          assert a.get("title"), "missing title"
          assert a.get("content_markdown"), "missing article body"
          faq = a.get("faq") or []
          assert 4 <= len(faq) <= 6, "expected 4-6 FAQ items"
          assert all(isinstance(x, dict) and str(x.get("question", "")).strip().endswith("?") and 40 <= len(str(x.get("answer", "")).split()) <= 110 for x in faq), "FAQ items do not meet publisher requirements"
          assert len({str(x["question"]).strip().lower() for x in faq}) == len(faq), "duplicate FAQ questions"
          assert 2 <= len(a.get("sources") or []) <= 4, "expected 2-4 structured sources"
          assert 8 <= len(a.get("h2_headings") or []) <= 12, "expected 8-12 H2 headings per generator validator"
          print("GENERATOR CONTRACT PASS:", a["title"])
          print("FAQ:", len(faq), "| Sources:", len(a["sources"]), "| H2:", len(a["h2_headings"]))
          PY

      - name: Fetch six real article images
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/competitive_fetch.py

      - name: Check article SEO and image metadata
        run: python scripts/competitive_seo_check.py

      - name: Groq editorial quality gate
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_QUALITY_MODEL: "openai/gpt-oss-120b"
        run: python scripts/openai_quality_gate.py

      - name: Render article locally (no deploy)
        run: python scripts/competitive_publish.py

      - name: Run final publication quality gate locally
        run: python scripts/publish_guard.py

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78
        with:
          hugo-version: "0.128.0"
          extended: true

      - name: Build site locally (no deploy)
        run: |
          hugo --gc --minify
          test -f public/index.html
          test -f public/sitemap.xml
          echo "LOCAL BUILD PASS; nothing was committed or deployed."
