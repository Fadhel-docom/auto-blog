name: UI Checker

on:
  schedule:
    - cron: "0 */12 * * *"

  push:
    branches: [main]
    paths:
      - "content/posts/**"
      - "layouts/**"
      - "assets/**"
      - "static/**"
      - "scripts/ui_checker.py"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ui-checker
  cancel-in-progress: false

jobs:
  ui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4

      - name: Run UI checker
        env:
          SITE_URL: "https://fadhel-docom.github.io/auto-blog/"
        run: |
          python scripts/ui_checker.py

      - name: Commit UI reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/ui_report.json
          git add logs/ui_suggestions.json
          if git diff --cached --quiet; then
            echo "No UI report changes."
          else
            git commit -m "UI checker: update interface report"
            git push
          fi
