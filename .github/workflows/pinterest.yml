name: Pinterest Auto Publisher

on:
  push:
    branches: [main]
    paths:
      - "content/posts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-pin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find newest post and publish to Pinterest
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess, sys
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          token = os.environ.get("PINTEREST_ACCESS_TOKEN", "").strip()
          if not token:
              print("ERROR: PINTEREST_ACCESS_TOKEN secret is missing.")
              sys.exit(1)
          if not token.startswith("pina"):
              print("ERROR: PINTEREST_ACCESS_TOKEN does not look like a Pinterest OAuth access token.")
              sys.exit(1)

          def api(method, path, body=None):
              data = None
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              }
              if body is not None:
                  data = json.dumps(body).encode()
              req = Request("https://api.pinterest.com/v5" + path, data=data, headers=headers, method=method)
              try:
                  with urlopen(req, timeout=30) as r:
                      raw = r.read().decode()
                      return r.status, json.loads(raw) if raw else {}
              except HTTPError as e:
                  raw = e.read().decode(errors="replace")
                  try: payload = json.loads(raw)
                  except Exception: payload = {"raw": raw}
                  return e.code, payload

          # Publish every unpinned post while the current token is valid.
          # This intentionally uses the existing article set; no new/low-quality content is created.
          all_posts = sorted(Path("content/posts").glob("*.md"), key=lambda p: p.stat().st_mtime, reverse=True)
          if not all_posts:
              print("No posts found; nothing to publish.")
              sys.exit(0)

          # Read existing Pins once. The current site has far fewer than 100 posts.
          status, pins = api("GET", "/pins?page_size=100")
          if status != 200:
              print("ERROR: Pinterest API authentication/read access failed.")
              print(json.dumps(pins, indent=2))
              sys.exit(1)
          existing_links = {p.get("link") for p in pins.get("items", []) if p.get("link")}

          status, boards = api("GET", "/boards?page_size=100")
          if status != 200:
              print("ERROR: Could not list Pinterest boards.")
              print(json.dumps(boards, indent=2))
              sys.exit(1)

          items = boards.get("items", [])
          if not items:
              print("ERROR: No Pinterest board is available to receive the Pin.")
              sys.exit(1)

          preferred = [b for b in items if any(k in (b.get("name") or "").lower()
                       for k in ("organization", "home", "decor", "storage"))]
          board = preferred[0] if preferred else items[0]
          board_id = board.get("id")

          published = 0
          skipped = 0
          failed = 0

          for post in all_posts:
              text = post.read_text(encoding="utf-8")

              def fm(name):
                  m = re.search(r"^" + re.escape(name) + r"\s*[:=]\s*(.*)$", text, re.M)
                  if not m:
                      return ""
                  value = m.group(1).strip()
                  if value.startswith('"') and value.endswith('"'):
                      value = value[1:-1]
                  elif value.startswith("'") and value.endswith("'"):
                      value = value[1:-1]
                  return value.strip()

              title = fm("title")
              description = fm("description")
              image = fm("image")
              slug = post.stem
              link = f"https://fadhel-docom.github.io/auto-blog/posts/{slug}/"

              if not title or not image:
                  print(f"SKIP: Missing title or image in {post}")
                  skipped += 1
                  continue

              if image.startswith("/"):
                  image = "https://fadhel-docom.github.io/auto-blog" + image

              if link in existing_links:
                  print(f"SKIP: Pin already exists for {link}")
                  skipped += 1
                  continue

              payload = {
                  "board_id": board_id,
                  "title": title[:100],
                  "description": (description or title)[:800],
                  "link": link,
                  "media_source": {
                      "source_type": "image_url",
                      "url": image,
                      "is_standard": True
                  }
              }

              status, result = api("POST", "/pins", payload)
              if status == 201:
                  print(f"SUCCESS: Pinterest Pin created: {result.get('id')} | {title}")
                  existing_links.add(link)
                  published += 1
              else:
                  print(f"ERROR: Pinterest Pin creation failed for {post} (HTTP {status}).")
                  print(json.dumps(result, indent=2))
                  failed += 1

          print(f"SUMMARY: published={published}, skipped={skipped}, failed={failed}, board={board.get('name')} ({board_id})")
          sys.exit(1 if failed and published == 0 else 0)
          PY
