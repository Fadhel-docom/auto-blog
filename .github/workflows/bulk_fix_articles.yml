name: Bulk Article Fix

on:
  push:
    paths:
      - 'scripts/fix_articles.py'
      - '.github/workflows/bulk_fix_articles.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run bulk fixer
        run: python scripts/fix_articles.py

      - name: Commit report and automatic fixes
        run: |
          git config user.name "auto-blog-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content/posts static/images reports/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: bulk article quality cleanup [skip ci]"
          git push
