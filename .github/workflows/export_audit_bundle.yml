name: Export Audit Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build text-only bundle
        run: |
          mkdir -p out
          find . \( -path ./.git -o -path ./static -o -path ./public -o -path ./resources -o -path ./out -o -path ./node_modules \) -prune -o -type f \( -name '*.md' -o -name '*.yml' -o -name '*.yaml' -o -name '*.toml' -o -name '*.html' -o -name '*.py' -o -name '*.css' -o -name '*.js' -o -name '*.json' -o -name '*.csv' -o -name '*.xml' -o -name '*.txt' \) -print | zip -@ out/audit_bundle.zip
          ls -la out

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: audit-bundle
          path: out/audit_bundle.zip
