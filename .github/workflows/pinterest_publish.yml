name: Pinterest Auto Publish

on:
  # Disabled: manual definition retained, but job is hard-disabled below.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-pin:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish latest unpublished article to Pinterest
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          RSS_URL: https://fadhel-docom.github.io/auto-blog/index.xml
          PINS_FILE: data/pinterest_pins.json
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser

          RSS_URL = os.environ["RSS_URL"]
          PINS_FILE = os.environ["PINS_FILE"]
          TOKEN = os.environ.get("PINTEREST_ACCESS_TOKEN", "").strip()

          def fail(message):
              print(f"ERROR: {message}")
              sys.exit(1)

          if not TOKEN:
              fail("PINTEREST_ACCESS_TOKEN is missing from GitHub Secrets.")
          print("INFO: Fetching Pinterest Boards via GET /v5/boards...")
          boards_request = urllib.request.Request(
              "https://api.pinterest.com/v5/boards",
              method="GET",
              headers={
                  "Authorization": f"Bearer {TOKEN}",
                  "Accept": "application/json",
                  "User-Agent": "HomeOrg-PinterestPublisher/1.0"
              }
          )
          try:
              with urllib.request.urlopen(boards_request, timeout=30) as response:
                  boards_body = response.read().decode("utf-8", errors="replace")
                  boards_status = response.status
          except urllib.error.HTTPError as exc:
              error_body = exc.read().decode("utf-8", errors="replace")
              print(f"ERROR: Pinterest Boards API HTTP {exc.code}")
              print(f"ERROR: Pinterest response: {error_body}")
              sys.exit(1)
          except Exception as exc:
              fail(f"Pinterest Boards API request failed: {exc}")

          if boards_status < 200 or boards_status >= 300:
              fail(f"Pinterest Boards API returned unexpected HTTP {boards_status}: {boards_body}")

          try:
              boards_data = json.loads(boards_body)
          except json.JSONDecodeError:
              fail(f"Pinterest Boards API returned invalid JSON: {boards_body}")

          boards = boards_data.get("items", [])
          if not boards:
              fail("Pinterest account returned no Boards. Create at least one Board in Pinterest.")

          preferred_board_name = "Kitchen Organization"
          selected_board = next((b for b in boards if b.get("name") == preferred_board_name), boards[0])
          BOARD_ID = str(selected_board.get("id", "")).strip()
          BOARD_NAME = str(selected_board.get("name", "")).strip()
          if not BOARD_ID:
              fail(f"Pinterest Boards API returned a Board without an id: {selected_board}")

          print(f"INFO: Selected Pinterest Board: {BOARD_NAME} (id={BOARD_ID})")

          print(f"INFO: Reading RSS: {RSS_URL}")
          try:
              req = urllib.request.Request(
                  RSS_URL,
                  headers={"User-Agent": "HomeOrg-PinterestPublisher/1.0"}
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  rss = response.read()
          except Exception as exc:
              fail(f"Could not read RSS: {exc}")

          try:
              root = ET.fromstring(rss)
          except ET.ParseError as exc:
              fail(f"RSS XML is invalid: {exc}")

          def tag_name(tag):
              return tag.rsplit("}", 1)[-1]

          items = []
          for node in root.iter():
              if tag_name(node.tag) == "item":
                  fields = {}
                  for child in node:
                      name = tag_name(child.tag)
                      if name not in fields and child.text:
                          fields[name] = child.text.strip()
                  items.append(fields)

          if not items:
              print("INFO: No RSS articles found. Nothing to publish.")
              sys.exit(0)

          try:
              with open(PINS_FILE, "r", encoding="utf-8") as f:
                  registry = json.load(f)
          except FileNotFoundError:
              registry = {"pins": {}}
          except json.JSONDecodeError as exc:
              fail(f"{PINS_FILE} is not valid JSON: {exc}")

          pins = registry.setdefault("pins", {})
          candidate = None

          for item in items:
              title = item.get("title", "").strip()
              link = item.get("link", "").strip()
              if not title or not link:
                  continue
              if link in pins:
                  print(f"INFO: Already pinned, skipping: {title}")
                  continue
              candidate = item
              break

          if not candidate:
              print("INFO: All RSS articles are already recorded as Pinterest Pins.")
              sys.exit(0)

          title = candidate.get("title", "").strip()
          link = candidate.get("link", "").strip()
          description = candidate.get("description", "").strip()

          class OGImageParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.image = None
              def handle_starttag(self, tag, attrs):
                  if self.image or tag.lower() != "meta":
                      return
                  data = {k.lower(): v for k, v in attrs}
                  if data.get("property", "").lower() == "og:image":
                      self.image = data.get("content", "").strip()

          print(f"INFO: Candidate article: {title}")
          print(f"INFO: Article URL: {link}")
          print("INFO: Fetching article HTML to extract og:image...")

          try:
              req = urllib.request.Request(
                  link,
                  headers={"User-Agent": "HomeOrg-PinterestPublisher/1.0"}
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  html = response.read().decode("utf-8", errors="replace")
          except Exception as exc:
              fail(f"Could not fetch article HTML: {exc}")

          parser = OGImageParser()
          parser.feed(html)
          image_url = urllib.parse.urljoin(link, parser.image or "")

          if not image_url:
              fail("Article has no og:image. Pin was NOT created.")
          print(f"INFO: og:image: {image_url}")

          payload = {
              "board_id": BOARD_ID,
              "link": link,
              "title": title[:100],
              "description": description[:500],
              "media_source": {
                  "source_type": "image_url",
                  "url": image_url
              }
          }

          body = json.dumps(payload).encode("utf-8")
          request = urllib.request.Request(
              "https://api.pinterest.com/v5/pins",
              data=body,
              method="POST",
              headers={
                  "Authorization": f"Bearer {TOKEN}",
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "User-Agent": "HomeOrg-PinterestPublisher/1.0"
              }
          )

          print("INFO: Creating Pinterest Pin via POST /v5/pins...")
          try:
              with urllib.request.urlopen(request, timeout=45) as response:
                  response_body = response.read().decode("utf-8", errors="replace")
                  status = response.status
          except urllib.error.HTTPError as exc:
              error_body = exc.read().decode("utf-8", errors="replace")
              print(f"ERROR: Pinterest API HTTP {exc.code}")
              if exc.code in (401, 403):
                  print("ERROR: Pinterest authorization/permission failure.")
                  print("ERROR: Check PINTEREST_ACCESS_TOKEN, board access, and API app access level.")
              print(f"ERROR: Pinterest response: {error_body}")
              sys.exit(1)
          except Exception as exc:
              fail(f"Pinterest API request failed: {exc}")

          if status < 200 or status >= 300:
              fail(f"Pinterest API returned unexpected HTTP {status}: {response_body}")

          try:
              result = json.loads(response_body)
          except json.JSONDecodeError:
              fail(f"Pinterest returned non-JSON success response: {response_body}")

          pin_id = result.get("id")
          if not pin_id:
              fail(f"Pinterest returned success but no Pin ID: {response_body}")

          pins[link] = {
              "pin_id": pin_id,
              "title": title,
              "link": link,
              "image_url": image_url
          }

          with open(PINS_FILE, "w", encoding="utf-8") as f:
              json.dump(registry, f, indent=2, ensure_ascii=False)
              f.write("\n")

          print(f"SUCCESS: Pinterest Pin created: {pin_id}")
          print(f"SUCCESS: Registry updated: {PINS_FILE}")
          PY

      - name: Commit Pinterest registry
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/pinterest_pins.json; then
            echo "INFO: No registry changes to commit."
            exit 0
          fi
          git add data/pinterest_pins.json
          git commit -m "chore: record Pinterest Pin"
          git push

# Pinterest Auto Publish is intentionally disabled until Standard API access is approved.
