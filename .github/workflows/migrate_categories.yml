name: Migrate Categories

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: migrate-categories
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Dry-run preview
        run: |
          python scripts/fix_post_categories.py --all --dry-run

      - name: Apply category migration
        run: |
          python scripts/fix_post_categories.py --all

      - name: Commit migration changes
        run: |
          git add content/posts/
          if git diff --cached --quiet; then
            echo "No migration changes needed."
          else
            git commit -m "Migrate: normalize post categories to canonical set"
            git push
          fi

      - name: Install Hugo 0.128.0 Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.128.0"
          extended: true

      - name: Build Hugo site
        run: |
          hugo --gc --minify

      - name: Verify Hugo output
        run: |
          if [ ! -d public ]; then
            echo "ERROR: Hugo did not create public/"
            exit 1
          fi
          if [ ! -f public/index.html ]; then
            echo "ERROR: public/index.html is missing"
            exit 1
          fi
          echo "Hugo build verified."

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true

      - name: Summary
        run: |
          echo "=========================================="
          echo "MIGRATION + DEPLOY COMPLETE"
          echo "=========================================="
          echo "Categories now canonical:"
          echo "  Kitchen"
          echo "  Bathroom"
          echo "  Bedroom"
          echo "  Small Space"
          echo "  Decluttering"
          echo "  Rental"
          echo ""
          echo "Live site updated: gh-pages"
          echo "=========================================="
