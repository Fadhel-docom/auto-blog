name: Operations Room Reminder

on:
  schedule:
    - cron: "17 */5 * * *"
      timezone: "Africa/Tunis"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Post reminder in operations room
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 109,
              body: [
                "## ⏰ Operations cycle reminder",
                "حان موعد مراجعة دورة العمل التالية.",
                "اقرأ آخر تحديث في غرفة العمليات قبل استئناف العمل.",
                "لا تكرر المهام المكتملة، واحترم توزيع المسؤوليات وقواعد المشروع.",
                "",
                "ملاحظة: هذا تذكير فقط؛ لا يشغّل Claude أو ChatGPT تلقائيًا."
              ].join("\n")
            });
