name: Site Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "logs/**"
      - ".automation/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78
        with:
          hugo-version: "0.128.0"
          extended: true

      - name: Generate responsive thumbnails
        run: |
          python -m pip install --quiet pillow
          python scripts/make_thumbs.py

      - name: Build
        run: hugo --gc --minify

      - name: Verify build output
        run: |
          set -euo pipefail
          test -s public/index.html
          test -s public/sitemap.xml
          test -s public/index.xml
          test -s public/robots.txt

      - name: Point the GitHub Pages copy to the canonical pages.dev site
        run: python scripts/gh_pages_redirect.py public

      - name: Verify canonical URLs and redirect
        env:
          CANONICAL_URL: "https://home-organization-ideas.pages.dev"
        run: |
          set -euo pipefail
          # The GitHub Pages copy must announce pages.dev as the only canonical site.
          grep -Fq "${CANONICAL_URL}/" public/index.html
          grep -Fq "${CANONICAL_URL}/" public/sitemap.xml
          grep -Fq "Sitemap: ${CANONICAL_URL}/sitemap.xml" public/robots.txt
          grep -Fq 'http-equiv="refresh"' public/index.html
          if grep -Fq "fadhel-docom.github.io/auto-blog" public/index.html public/sitemap.xml public/robots.txt; then
            echo "SEO URL FAIL: old GitHub Pages hostname still present as a canonical URL"
            exit 1
          fi
          echo "SEO URL PASS: GitHub Pages copy canonicalizes and redirects to ${CANONICAL_URL}/"

      - name: Deploy GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          # Default GitHub Pages URL only during stabilization.
          force_orphan: false

      - name: Verify homepage
        env:
          SITE_URL: "https://fadhel-docom.github.io/auto-blog"
        run: |
          set -euo pipefail
          url="${SITE_URL%/}/"
          status="$(curl -sSIL -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors "$url")"
          if [ "$status" != "200" ]; then
            echo "HOMEPAGE FAIL: HTTP $status $url"
            exit 1
          fi
          echo "HOMEPAGE PASS: HTTP 200 $url"

      - name: Verify homepage and legacy kitchen URLs
        env:
          SITE_URL: "https://fadhel-docom.github.io/auto-blog"
        run: |
          set -euo pipefail
          for path in "/" "/posts/kitchen-organization-ideas-small-spaces-space/" "/posts/small-kitchen-organization-ideas-a-practical-small-space-guide/"; do
            url="${SITE_URL%/}${path}"
            status="$(curl -sSIL -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors "$url")"
            if [ "$status" != "200" ]; then
              echo "SITE URL FAIL: HTTP $status $url"
              exit 1
            fi
            echo "SITE URL PASS: HTTP 200 $url"
          done
