name: Site Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "logs/**"
      - ".automation/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78
        with:
          hugo-version: "0.128.0"
          extended: true

      - name: Build
        run: hugo --gc --minify

      - name: Verify site output
        run: |
          test -s public/index.html
          test -s public/sitemap.xml
          test -s public/index.xml

      - name: Deploy GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          # Default GitHub Pages URL only during stabilization.
          force_orphan: false

      - name: Verify homepage
        env:
          SITE_URL: "https://fadhel-docom.github.io/auto-blog"
        run: |
          set -euo pipefail
          url="${SITE_URL%/}/"
          status="$(curl -sSIL -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors "$url")"
          if [ "$status" != "200" ]; then
            echo "HOMEPAGE FAIL: HTTP $status $url"
            exit 1
          fi
          echo "HOMEPAGE PASS: HTTP 200 $url"

      - name: Verify homepage and legacy kitchen URLs
        env:
          SITE_URL: "https://fadhel-docom.github.io/auto-blog"
        run: |
          set -euo pipefail
          for path in "/" "/posts/kitchen-organization-ideas-small-spaces-space/" "/posts/small-kitchen-organization-ideas-a-practical-small-space-guide/"; do
            url="${SITE_URL%/}${path}"
            status="$(curl -sSIL -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors "$url")"
            if [ "$status" != "200" ]; then
              echo "SITE URL FAIL: HTTP $status $url"
              exit 1
            fi
            echo "SITE URL PASS: HTTP 200 $url"
          done
