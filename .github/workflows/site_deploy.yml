name: Site Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "logs/**"
      - ".automation/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78
        with:
          hugo-version: "0.128.0"
          extended: true

      - name: Build
        run: hugo --gc --minify

      - name: Verify site output
        run: |
          test -s public/index.html
          test -s public/sitemap.xml
          test -s public/index.xml

      - name: Deploy GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          # Default GitHub Pages URL only during stabilization.
          force_orphan: false

      - name: Verify homepage
        env:
          SITE_URL: "https://fadhel-docom.github.io/auto-blog"
        run: |
          set -euo pipefail
          url="${SITE_URL%/}/"
          status="$(curl -sSIL -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors "$url")"
          if [ "$status" != "200" ]; then
            echo "HOMEPAGE FAIL: HTTP $status $url"
            exit 1
          fi
          echo "HOMEPAGE PASS: HTTP 200 $url"

      - name: Verify Pinterest hero images
        env:
          SITE_URL: "https://fadhel-docom.github.io/auto-blog"
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys

          base = os.environ["SITE_URL"].rstrip("/")
          with open("data/pinterest_heroes.json", encoding="utf-8") as f:
              data = json.load(f)

          assets = data.get("assets")
          if not isinstance(assets, list) or not assets:
              raise SystemExit("ASSET GATE FAIL: data/pinterest_heroes.json has no assets list")

          print(f"ASSET GATE: checking {len(assets)} Pinterest hero images")
          for name in assets:
              url = f"{base}/images/pinterest/{name}"
              print(f"CHECK: {url}")
              result = subprocess.run(
                  ["curl", "-sSIL", "--retry", "3", "--retry-all-errors", "-o", "/dev/null",
                   "-w", "%{http_code}\t%{content_type}", url],
                  text=True,
                  capture_output=True,
              )
              if result.returncode != 0:
                  print(f"ASSET FAIL: curl error for {name}: {result.stderr.strip()}")
                  sys.exit(1)
              parts = result.stdout.strip().split("\t", 1)
              status = parts[0] if parts else ""
              content_type = parts[1] if len(parts) > 1 else ""
              if status != "200" or content_type.split(";", 1)[0].lower() != "image/jpeg":
                  print(f"ASSET FAIL: {name} -> HTTP {status}, Content-Type {content_type or 'missing'}")
                  sys.exit(1)
              print(f"ASSET PASS: {name} -> HTTP 200, Content-Type image/jpeg")

          print(f"ASSET GATE PASS: {len(assets)}/{len(assets)} Pinterest hero images verified.")

