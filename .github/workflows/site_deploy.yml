name: Site Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "logs/**"
      - ".automation/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78
        with:
          hugo-version: "0.128.0"
          extended: true

      - name: Build
        run: hugo --gc --minify

      - name: Verify site output
        run: |
          test -s public/index.html
          test -s public/sitemap.xml
          test -s public/index.xml

      - name: Deploy GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          # No custom domain during stabilization; publish on the default GitHub Pages URL.
          force_orphan: false
