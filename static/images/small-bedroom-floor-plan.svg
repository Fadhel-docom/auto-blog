<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t1 d1"><title id="t1">Floor plan of a 9 by 10 foot bedroom</title><desc id="d1">Top view of a 10 by 9 foot room with a full bed, a dresser and a door, showing a 24 inch walking path beside the bed and the door route.</desc>
<rect width="800" height="470" fill="#fbf7f1"/>
<rect x="50" y="50" width="400" height="360" fill="#fffdf9" stroke="#5b4a3a" stroke-width="6"/>
<rect x="130" y="56" width="180" height="250" rx="6" fill="#cfe3ea" stroke="#3d6f80" stroke-width="3"/>
<rect x="140" y="64" width="70" height="40" rx="8" fill="#ffffff" stroke="#3d6f80" stroke-width="2"/><rect x="230" y="64" width="70" height="40" rx="8" fill="#ffffff" stroke="#3d6f80" stroke-width="2"/>
<text x="220" y="200" font-size="18" font-weight="bold" fill="#24505f" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Full bed</text><text x="220" y="224" font-size="16" font-weight="normal" fill="#24505f" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">54 x 75 in</text>
<rect x="330" y="344" width="116" height="62" fill="#e8d5b7" stroke="#8a6a3b" stroke-width="3"/><text x="388" y="380" font-size="16" font-weight="bold" fill="#5e4524" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Dresser</text>
<rect x="56" y="56" width="70" height="40" fill="#e8d5b7" stroke="#8a6a3b" stroke-width="3"/><text x="91" y="81" font-size="15" font-weight="bold" fill="#5e4524" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Shelf</text>
<path d="M70 410 L150 410" stroke="#fffdf9" stroke-width="8"/><path d="M70 410 A80 80 0 0 1 150 330" fill="none" stroke="#9a9a9a" stroke-width="2" stroke-dasharray="6 5"/><line x1="150" y1="410" x2="150" y2="330" stroke="#9a9a9a" stroke-width="3"/><text x="110" y="436" font-size="16" font-weight="bold" fill="#555" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Door</text>
<line x1="53" y1="150" x2="127" y2="150" stroke="#c0392b" stroke-width="3"/><path d="M53 150 l10 -6 v12 z M127 150 l-10 -6 v12 z" fill="#c0392b"/><text x="90" y="182" font-size="17" font-weight="bold" fill="#c0392b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">24 in</text>
<path d="M110 395 C 95 330, 90 260, 90 205" fill="none" stroke="#2e8b57" stroke-width="4" stroke-dasharray="10 7"/><path d="M90 205 l-8 14 h16 z" fill="#2e8b57"/>
<rect x="500" y="50" width="270" height="360" rx="10" fill="#ffffff" stroke="#d9cdbd" stroke-width="2"/>
<text x="520" y="84" font-size="19" font-weight="bold" fill="#3b2f23" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Read the plan</text>
<circle cx="526" cy="118" r="8" fill="#c0392b"/><text x="544" y="124" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Side of bed: 24 in</text><text x="544" y="146" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">of walking room</text>
<circle cx="526" cy="188" r="8" fill="#2e8b57"/><text x="544" y="194" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Green path: door to</text><text x="544" y="216" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">bed, never blocked</text>
<circle cx="526" cy="258" r="8" fill="#8a6a3b"/><text x="544" y="264" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Tall pieces go on the</text><text x="544" y="286" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">wall, away from the door</text>
<text x="520" y="338" font-size="16" font-weight="bold" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Room: 10 x 9 ft = 90 sq ft</text><text x="520" y="362" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Bed covers about 31 sq ft</text><text x="520" y="386" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">(a third of the floor)</text>
</svg>