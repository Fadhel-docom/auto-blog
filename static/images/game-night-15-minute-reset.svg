<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="t3 d3" font-family="Arial, Helvetica, sans-serif">
<title id="t3">The 15-minute living room reset</title>
<desc id="d3">A five-step timeline in three-minute blocks: pieces and cards back in boxes, boxes to their shelf, table cleared and wiped, chairs and table back in place, then a walkway, lamp and floor check.</desc>
<rect width="800" height="300" fill="#fbf8f3"/>
<text x="400" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#2d2a26">The 15-minute reset</text>
<text x="400" y="62" text-anchor="middle" font-size="13" fill="#2d2a26">Set a timer and work left to right</text>
<rect x="70" y="90" width="128" height="70" rx="8" fill="#dcefd9" stroke="#2d2a26" stroke-width="2"/>
<rect x="202" y="90" width="128" height="70" rx="8" fill="#e6f0d2" stroke="#2d2a26" stroke-width="2"/>
<rect x="334" y="90" width="128" height="70" rx="8" fill="#f6e4c8" stroke="#2d2a26" stroke-width="2"/>
<rect x="466" y="90" width="128" height="70" rx="8" fill="#f0dcc4" stroke="#2d2a26" stroke-width="2"/>
<rect x="598" y="90" width="128" height="70" rx="8" fill="#dfe6f2" stroke="#2d2a26" stroke-width="2"/>
<text x="134" y="120" text-anchor="middle" font-size="18" font-weight="700" fill="#2d2a26">0–3</text><text x="134" y="142" text-anchor="middle" font-size="12" fill="#2d2a26">min</text>
<text x="134" y="196" text-anchor="middle" font-size="14" fill="#2d2a26">Pieces and cards</text><text x="134" y="216" text-anchor="middle" font-size="14" fill="#2d2a26">back in boxes</text>
<text x="266" y="120" text-anchor="middle" font-size="18" font-weight="700" fill="#2d2a26">3–6</text><text x="266" y="142" text-anchor="middle" font-size="12" fill="#2d2a26">min</text>
<text x="266" y="196" text-anchor="middle" font-size="14" fill="#2d2a26">Boxes to</text><text x="266" y="216" text-anchor="middle" font-size="14" fill="#2d2a26">their shelf</text>
<text x="398" y="120" text-anchor="middle" font-size="18" font-weight="700" fill="#2d2a26">6–9</text><text x="398" y="142" text-anchor="middle" font-size="12" fill="#2d2a26">min</text>
<text x="398" y="196" text-anchor="middle" font-size="14" fill="#2d2a26">Table cleared</text><text x="398" y="216" text-anchor="middle" font-size="14" fill="#2d2a26">and wiped</text>
<text x="530" y="120" text-anchor="middle" font-size="18" font-weight="700" fill="#2d2a26">9–12</text><text x="530" y="142" text-anchor="middle" font-size="12" fill="#2d2a26">min</text>
<text x="530" y="196" text-anchor="middle" font-size="14" fill="#2d2a26">Chairs and table</text><text x="530" y="216" text-anchor="middle" font-size="14" fill="#2d2a26">back in place</text>
<text x="662" y="120" text-anchor="middle" font-size="18" font-weight="700" fill="#2d2a26">12–15</text><text x="662" y="142" text-anchor="middle" font-size="12" fill="#2d2a26">min</text>
<text x="662" y="196" text-anchor="middle" font-size="14" fill="#2d2a26">Walkway, lamp</text><text x="662" y="216" text-anchor="middle" font-size="14" fill="#2d2a26">and floor check</text>
<line x1="70" y1="250" x2="730" y2="250" stroke="#2d2a26" stroke-width="2"/>
<text x="70" y="274" font-size="12" fill="#2d2a26">Start</text><text x="730" y="274" text-anchor="end" font-size="12" fill="#2d2a26">Room back to everyday use</text>
</svg>
