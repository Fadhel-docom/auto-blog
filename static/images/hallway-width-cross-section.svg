<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 500' role='img' aria-labelledby='t d'><title id='t'>Hallway cross-section with clear width at each height</title><desc id='d'>Cross-section of a 36 inch wide hallway. At floor level a 6 inch shoe shelf leaves 30 inches. At shoulder height a coat on a hook about 10 inches deep leaves 26 inches. The ADA limits objects between 27 and 80 inches to 4 inches deep.</desc><rect width='700' height='500' fill='#fbf9f4'/><text x='20' y='30' font-size='21' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Cross-section: width left at each height (example)</text><rect x='200' y='50' width='180' height='400' rx='0' fill='#f6f2e8' stroke='none' stroke-width='0' opacity='1'/><line x1='200' y1='315' x2='380' y2='315' stroke='#8a6a3b' stroke-width='2' stroke-dasharray='6 4'/><line x1='200' y1='50' x2='380' y2='50' stroke='#8a6a3b' stroke-width='2' stroke-dasharray='6 4'/><text x='190' y='320' font-size='13' text-anchor='end' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>27 in</text><text x='190' y='55' font-size='13' text-anchor='end' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>80 in</text><line x1='200' y1='50' x2='200' y2='450' stroke='#7a6a4f' stroke-width='6'/><line x1='380' y1='50' x2='380' y2='450' stroke='#7a6a4f' stroke-width='6'/><line x1='170' y1='450' x2='410' y2='450' stroke='#7a6a4f' stroke-width='4'/><rect x='200' y='180' width='50' height='130' rx='10' fill='#f3d9d9' stroke='#9a3b3b' stroke-width='2' opacity='1'/><text x='225' y='250' font-size='12' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Coat</text><rect x='200' y='427' width='30' height='5' rx='1' fill='#c9a56e' stroke='#8a6a3b' stroke-width='2' opacity='1'/><rect x='200' y='410' width='28' height='17' rx='3' fill='#d8d2c4' stroke='#5b6a4a' stroke-width='2' opacity='1'/><line x1='250' y1='210' x2='380' y2='210' stroke='#2f3a2f' stroke-width='2'/><polygon points='250,210 259,205 259,215' fill='#2f3a2f'/><polygon points='380,210 371,205 371,215' fill='#2f3a2f'/><text x='315' y='202' font-size='15' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>26 in</text><line x1='230' y1='400' x2='380' y2='400' stroke='#2f3a2f' stroke-width='2'/><polygon points='230,400 239,395 239,405' fill='#2f3a2f'/><polygon points='380,400 371,395 371,405' fill='#2f3a2f'/><text x='305' y='392' font-size='15' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>30 in</text><line x1='200' y1='100' x2='380' y2='100' stroke='#2f3a2f' stroke-width='2'/><polygon points='200,100 209,95 209,105' fill='#2f3a2f'/><polygon points='380,100 371,95 371,105' fill='#2f3a2f'/><text x='290' y='92' font-size='15' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>36 in</text><text x='225' y='466' font-size='12' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>left wall</text><text x='355' y='466' font-size='12' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>right wall</text><text x='440' y='100' font-size='16' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>What the numbers mean</text><text x='440' y='128' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Shoulder height: coats cut the</text><text x='440' y='148' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>width from 36 in to 26 in.</text><text x='440' y='190' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Shoe level: a 6 in shelf leaves</text><text x='440' y='210' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>30 in at the floor.</text><text x='440' y='252' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Between 27 and 80 in, the ADA</text><text x='440' y='272' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>limits objects to 4 in deep.</text><text x='440' y='314' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Benchmarks, not requirements:</text><text x='440' y='334' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>36 in IRC hallway minimum,</text><text x='440' y='354' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>32 in ADA pinch, 24 in long.</text></svg>