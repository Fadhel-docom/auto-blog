<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f7f4ef"/><text x="90" y="90" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#222">A 15-minute reset</text><circle cx="600" cy="335" r="180" fill="#fff" stroke="#222" stroke-width="7"/><line x1="600" y1="335" x2="600" y2="205" stroke="#555" stroke-width="10"/><line x1="600" y1="335" x2="705" y2="390" stroke="#555" stroke-width="10"/><text x="535" y="355" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#222">15</text><text x="540" y="395" font-family="Arial,sans-serif" font-size="22" fill="#555">minutes</text><text x="170" y="600" font-family="Arial,sans-serif" font-size="25" fill="#555">5 min collect • 5 min sort • 5 min return</text><circle cx="350" cy="335" r="24" fill="#d5c0aa"/><circle cx="850" cy="335" r="24" fill="#d5c0aa"/></svg>