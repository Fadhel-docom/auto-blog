<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d"><title id="t">Three small living room layouts with a clear walking route</title><desc id="d">Three top-down room plans: a long narrow room with the route along one side, a square room with the seating pushed to one corner, and a pass-through room with the sofa back facing a straight route. Dashed lines show the route.</desc><rect width="800" height="450" fill="#faf6ef"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f62"/></marker></defs><text x="400" y="32" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#23363a">Reserve the route first, then place the furniture</text><text x="400" y="54" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#55696a">Dashed green line = main walking route (aim for 30–36 in wide). Not to scale.</text><rect x="40" y="100" width="190" height="250" fill="#fff" stroke="#23363a" stroke-width="4"/><line x1="60" y1="350" x2="115" y2="350" stroke="#faf6ef" stroke-width="7"/><line x1="55" y1="100" x2="110" y2="100" stroke="#6aa6d6" stroke-width="6"/><rect x="170" y="160" width="54" height="120" rx="5" fill="#e6efd2" stroke="#23363a" stroke-width="2"/><text x="197.0" y="224.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#23363a">Sofa</text><rect x="118" y="190" width="40" height="50" rx="5" fill="#e6efd2" stroke="#23363a" stroke-width="2"/><text x="138.0" y="219.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#23363a">Table</text><rect x="128" y="108" width="70" height="20" rx="5" fill="#e6efd2" stroke="#23363a" stroke-width="2"/><text x="163.0" y="122.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#23363a">TV</text><polyline points="88,350 88,120" fill="none" stroke="#2f6f62" stroke-width="4" stroke-dasharray="9 6" marker-end="url(#a)"/><text x="135" y="382" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#23363a">1. Long, narrow room</text><text x="135" y="402" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Sofa across the width,</text><text x="135" y="418" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">route down one side</text><rect x="300" y="100" width="210" height="250" fill="#fff" stroke="#23363a" stroke-width="4"/><line x1="300" y1="285" x2="300" y2="335" stroke="#faf6ef" stroke-width="7"/><line x1="340" y1="100" x2="420" y2="100" stroke="#6aa6d6" stroke-width="6"/><rect x="448" y="150" width="56" height="130" rx="5" fill="#e6efd2" stroke="#23363a" stroke-width="2"/><text x="476.0" y="219.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#23363a">Sofa</text><rect x="385" y="195" width="50" height="50" rx="5" fill="#e6efd2" stroke="#23363a" stroke-width="2"/><text x="410.0" y="224.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#23363a">Table</text><rect x="400" y="318" width="100" height="26" rx="5" fill="#e6efd2" stroke="#23363a" stroke-width="2"/><text x="450.0" y="335.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#23363a">Console</text><polyline points="304,310 352,310 352,120" fill="none" stroke="#2f6f62" stroke-width="4" stroke-dasharray="9 6" marker-end="url(#a)"/><text x="405" y="382" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#23363a">2. Small square room</text><text x="405" y="402" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Seating in one corner,</text><text x="405" y="418" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">route along the open edge</text><rect x="560" y="100" width="215" height="250" fill="#fff" stroke="#23363a" stroke-width="4"/><line x1="560" y1="200" x2="560" y2="250" stroke="#faf6ef" stroke-width="7"/><line x1="775" y1="200" x2="775" y2="250" stroke="#faf6ef" stroke-width="7"/><line x1="640" y1="100" x2="720" y2="100" stroke="#6aa6d6" stroke-width="6"/><rect x="600" y="120" width="110" height="60" rx="5" fill="#e6efd2" stroke="#23363a" stroke-width="2"/><text x="655.0" y="154.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#23363a">Sofa</text><rect x="690" y="318" width="75" height="26" rx="5" fill="#e6efd2" stroke="#23363a" stroke-width="2"/><text x="727.5" y="335.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#23363a">TV wall</text><polyline points="566,225 768,225" fill="none" stroke="#2f6f62" stroke-width="4" stroke-dasharray="9 6" marker-end="url(#a)"/><text x="667" y="382" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#23363a">3. Pass-through room</text><text x="667" y="402" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Sofa back faces</text><text x="667" y="418" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">a straight route</text><text x="655" y="205" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#b5522f">measure here</text></svg>