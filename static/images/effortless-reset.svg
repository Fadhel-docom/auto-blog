<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" role="img" aria-labelledby="t d"><title id="t">The ten-minute weekly reset</title><desc id="d">Five-step timeline of a ten minute weekly reset.</desc><rect width="800" height="250" fill="#faf6ef"/><text x="400.0" y="38" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#23363a">The ten-minute weekly reset</text><text x="400.0" y="62" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#55696a">Same order every time</text><rect x="24" y="90" width="142" height="140" rx="10" fill="#dbe9e4" stroke="#2f6f62" stroke-width="1.5"/><text x="95.2" y="116" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#2f6f62">Min 1-2</text><text x="95.2" y="142" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#23363a">Return stray items</text><text x="95.2" y="158" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#23363a">to their zones</text><rect x="176" y="90" width="142" height="140" rx="10" fill="#f3e3c8" stroke="#2f6f62" stroke-width="1.5"/><text x="247.60000000000002" y="116" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#2f6f62">Min 3-4</text><text x="247.60000000000002" y="142" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#23363a">Clear the most</text><text x="247.60000000000002" y="158" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#23363a">visible surface</text><rect x="329" y="90" width="142" height="140" rx="10" fill="#e4dcef" stroke="#2f6f62" stroke-width="1.5"/><text x="400.0" y="116" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#2f6f62">Min 5-6</text><text x="400.0" y="142" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#23363a">Empty baskets and</text><text x="400.0" y="158" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#23363a">the move pile</text><rect x="481" y="90" width="142" height="140" rx="10" fill="#f6d9d0" stroke="#2f6f62" stroke-width="1.5"/><text x="552.4000000000001" y="116" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#2f6f62">Min 7-8</text><text x="552.4000000000001" y="142" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#23363a">Put daily items back</text><text x="552.4000000000001" y="158" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#23363a">in position</text><rect x="634" y="90" width="142" height="140" rx="10" fill="#d9e6f2" stroke="#2f6f62" stroke-width="1.5"/><text x="704.8000000000001" y="116" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#2f6f62">Min 9-10</text><text x="704.8000000000001" y="142" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#23363a">Pick one repeat</text><text x="704.8000000000001" y="158" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#23363a">problem and change</text><text x="704.8000000000001" y="174" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#23363a">the system</text></svg>