<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 362" role="img" aria-labelledby="t d"><title id="t">Pick the idea that fits the problem</title><desc id="d">Four cards matching common small-home problems with the idea that solves each.</desc><rect width="800" height="362" fill="#faf6ef"/><text x="400.0" y="38" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#23363a">Pick the idea that fits the problem</text><text x="400.0" y="62" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#55696a">Start from what annoys you daily</text><rect x="24" y="84" width="369" height="120" rx="10" fill="#dbe9e4" stroke="#2f6f62" stroke-width="1.5"/><circle cx="46" cy="108" r="13" fill="#2f6f62"/><text x="46.0" y="113" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">1</text><text x="66.0" y="113" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#23363a">Floors and walkways are crowded</text><text x="38.0" y="140" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#23363a">Go vertical: shelves, hooks</text><text x="38.0" y="157" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#23363a">Keep a 36 in path clear</text><rect x="407" y="84" width="369" height="120" rx="10" fill="#f3e3c8" stroke="#2f6f62" stroke-width="1.5"/><circle cx="429" cy="108" r="13" fill="#2f6f62"/><text x="429.0" y="113" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">2</text><text x="449.0" y="113" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#23363a">Counters keep filling up</text><text x="421.0" y="140" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#23363a">Give each item a home</text><text x="421.0" y="157" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#23363a">Use trays with a size limit</text><rect x="24" y="218" width="369" height="120" rx="10" fill="#e4dcef" stroke="#2f6f62" stroke-width="1.5"/><circle cx="46" cy="242" r="13" fill="#2f6f62"/><text x="46.0" y="247" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">3</text><text x="66.0" y="247" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#23363a">Closet is overstuffed</text><text x="38.0" y="274" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#23363a">Double-hang the short items</text><text x="38.0" y="291" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#23363a">Rotate seasonal clothes out</text><rect x="407" y="218" width="369" height="120" rx="10" fill="#f6d9d0" stroke="#2f6f62" stroke-width="1.5"/><circle cx="429" cy="242" r="13" fill="#2f6f62"/><text x="429.0" y="247" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">4</text><text x="449.0" y="247" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#23363a">Storage keeps multiplying</text><text x="421.0" y="274" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#23363a">Stop buying bins</text><text x="421.0" y="291" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#23363a">Measure, then fit the system</text></svg>