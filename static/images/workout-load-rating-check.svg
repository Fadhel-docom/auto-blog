<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 404' role='img' aria-labelledby='t d'><title id='t'>Rated limits compared with example loads</title><desc id='d'>Bars compare the CAP RK-CB16H rack manual rating of 225 lb and product page rating of 300 lb with an example load of 280 lb, and the IKEA VESKEN cart limit of 13 lb with an example load of 20 lb.</desc><rect x='0' y='0' width='700' height='404' rx='0' fill='#fbf9f4' stroke='none' stroke-width='1'/><text x='20' y='30' font-size='19' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Compare the load with the lowest rating</text><text x='20' y='62' font-size='13' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>CAP rack RK-CB16H (scale 0 to 320 lb)</text><text x='20' y='98' font-size='13' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Manual: recommended max</text><rect x='250' y='82' width='270' height='24' rx='0' fill='#5b6a4a' stroke='none' stroke-width='1'/><text x='528' y='99' font-size='13' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>225 lb</text><text x='20' y='134' font-size='13' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Product page: max capacity</text><rect x='250' y='118' width='360' height='24' rx='0' fill='#9aa98a' stroke='none' stroke-width='1'/><text x='618' y='135' font-size='13' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>300 lb</text><text x='20' y='170' font-size='13' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Example: 4 pairs of 35 lb</text><rect x='250' y='154' width='336' height='24' rx='0' fill='#b5523b' stroke='none' stroke-width='1'/><text x='594' y='171' font-size='13' text-anchor='start' font-weight='bold' fill='#b5523b' font-family='Helvetica,Arial,sans-serif'>280 lb</text><line x1='520' y1='74' x2='520' y2='186' stroke='#b5523b' stroke-width='2' stroke-dasharray='5 4'/><text x='20' y='208' font-size='13' text-anchor='start' font-weight='normal' fill='#b5523b' font-family='Helvetica,Arial,sans-serif'>280 lb passes the product page but is over the manual’s 225 lb.</text><text x='20' y='246' font-size='13' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>IKEA VESKEN cart (scale 0 to 25 lb)</text><text x='20' y='282' font-size='13' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Cart: maximum load</text><rect x='250' y='266' width='195' height='24' rx='0' fill='#5b6a4a' stroke='none' stroke-width='1'/><text x='453' y='283' font-size='13' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>13 lb</text><text x='20' y='318' font-size='13' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Example: one pair of 10 lb</text><rect x='250' y='302' width='300' height='24' rx='0' fill='#b5523b' stroke='none' stroke-width='1'/><text x='558' y='319' font-size='13' text-anchor='start' font-weight='bold' fill='#b5523b' font-family='Helvetica,Arial,sans-serif'>20 lb</text><text x='20' y='352' font-size='13' text-anchor='start' font-weight='normal' fill='#b5523b' font-family='Helvetica,Arial,sans-serif'>The cart is for light gear only.</text><text x='20' y='384' font-size='12' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Arithmetic: 4 pairs × 2 dumbbells × 35 lb = 280 lb. Use the lower rating and stay under it.</text></svg>