<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t12 d12"><title id="t12">Closet door clearance for bins</title><desc id="d12">Two top views of a closet. On the left a deep bin blocks the door from opening fully. On the right a bin set toward the back lets the door swing past.</desc><rect width="800" height="380" fill="#fbf7f1"/><text x="190" y="40" font-size="20" font-weight="bold" fill="#8d4a22" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Bin too deep</text><text x="600" y="40" font-size="20" font-weight="bold" fill="#256b43" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Bin set to clear</text><rect x="40" y="70" width="330" height="200" rx="0" fill="#fffdf9" stroke="#5b4a3a" stroke-width="5"/><rect x="340" y="262" width="60" height="16" fill="#fbf7f1"/><path d="M340 270 A150 150 0 0 0 190 120" fill="none" stroke="#9a9a9a" stroke-width="2" stroke-dasharray="6 5"/><line x1="340" y1="270" x2="340" y2="120" stroke="#9a9a9a" stroke-width="4"/><rect x="240" y="170" width="120" height="90" rx="4" fill="#f3dccf" stroke="#c0392b" stroke-width="3"/><text x="300" y="222" font-size="16" font-weight="bold" fill="#8d4a22" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Bin</text><text x="205" y="300" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Door cannot open fully</text><rect x="430" y="70" width="330" height="200" rx="0" fill="#fffdf9" stroke="#5b4a3a" stroke-width="5"/><rect x="730" y="262" width="60" height="16" fill="#fbf7f1"/><path d="M730 270 A150 150 0 0 0 580 120" fill="none" stroke="#9a9a9a" stroke-width="2" stroke-dasharray="6 5"/><line x1="730" y1="270" x2="730" y2="120" stroke="#9a9a9a" stroke-width="4"/><rect x="444" y="170" width="120" height="90" rx="4" fill="#e7f0d9" stroke="#2e8b57" stroke-width="3"/><text x="504" y="222" font-size="16" font-weight="bold" fill="#256b43" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Bin</text><text x="595" y="300" font-size="16" font-weight="bold" fill="#256b43" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Door swings past the bin</text><text x="400" y="355" font-size="17" font-weight="bold" fill="#3b2f23" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Measure E: the room between the door swing and the shelf</text></svg>