<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 500' role='img' aria-labelledby='t d'><title id='t'>Cable path for a small home office</title><desc id='d'>Two panels. Do: a surge protector plugged directly into a wall outlet with a short cord clipped along the underside of the desk. Don't: one power strip plugged into another.</desc><rect width='700' height='500' fill='#fbf9f4'/><text x='20' y='30' font-size='21' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Cable path for a small home office (example)</text><rect x='20' y='60' width='320' height='400' rx='6' fill='#f6f2e8' stroke='#7a6a4f' stroke-width='3' opacity='1'/><text x='180' y='90' font-size='20' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Do</text><rect x='50' y='110' width='280' height='14' rx='2' fill='#c9a56e' stroke='#8a6a3b' stroke-width='2' opacity='1'/><text x='190' y='150' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Desk (underside)</text><rect x='50' y='330' width='40' height='40' rx='4' fill='#fff' stroke='#7a6a4f' stroke-width='2' opacity='1'/><text x='70' y='390' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Wall outlet</text><rect x='120' y='336' width='120' height='28' rx='6' fill='#dbe6cf' stroke='#5b6a4a' stroke-width='2' opacity='1'/><text x='180' y='355' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Surge protector</text><line x1='90' y1='350' x2='120' y2='350' stroke='#5b6a4a' stroke-width='3'/><line x1='240' y1='350' x2='300' y2='350' stroke='#5b6a4a' stroke-width='3'/><line x1='300' y1='350' x2='300' y2='126' stroke='#5b6a4a' stroke-width='3' stroke-dasharray='8 5'/><rect x='250' y='168' width='60' height='30' rx='3' fill='#d8d2c4' stroke='#5b6a4a' stroke-width='2' opacity='1'/><text x='280' y='188' font-size='12' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Laptop</text><text x='70' y='420' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Strip plugged straight into the wall,</text><text x='70' y='440' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>short cord clipped along the desk.</text><rect x='360' y='60' width='320' height='400' rx='6' fill='#f6f2e8' stroke='#7a6a4f' stroke-width='3' opacity='1'/><text x='520' y='90' font-size='20' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Don’t</text><rect x='390' y='330' width='40' height='40' rx='4' fill='#fff' stroke='#7a6a4f' stroke-width='2' opacity='1'/><rect x='450' y='336' width='70' height='28' rx='6' fill='#dbe6cf' stroke='#5b6a4a' stroke-width='2' opacity='1'/><text x='485' y='355' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Strip</text><rect x='540' y='336' width='70' height='28' rx='6' fill='#dbe6cf' stroke='#5b6a4a' stroke-width='2' opacity='1'/><text x='575' y='355' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Strip</text><line x1='430' y1='350' x2='450' y2='350' stroke='#9a3b3b' stroke-width='3'/><line x1='520' y1='350' x2='540' y2='350' stroke='#9a3b3b' stroke-width='3'/><line x1='610' y1='350' x2='650' y2='350' stroke='#9a3b3b' stroke-width='3'/><line x1='650' y1='350' x2='650' y2='200' stroke='#9a3b3b' stroke-width='3' stroke-dasharray='8 5'/><rect x='390' y='110' width='280' height='14' rx='2' fill='#c9a56e' stroke='#8a6a3b' stroke-width='2' opacity='1'/><text x='530' y='150' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Desk (underside)</text><rect x='590' y='168' width='60' height='30' rx='3' fill='#d8d2c4' stroke='#5b6a4a' stroke-width='2' opacity='1'/><text x='620' y='188' font-size='12' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Laptop</text><text x='500' y='310' font-size='14' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>One strip plugged into another</text><line x1='512' y1='338' x2='548' y2='362' stroke='#9a3b3b' stroke-width='5'/><line x1='548' y1='338' x2='512' y2='362' stroke='#9a3b3b' stroke-width='5'/><text x='380' y='420' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Daisy-chaining overloads the circuit.</text><text x='380' y='440' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Never run cords under a rug.</text></svg>