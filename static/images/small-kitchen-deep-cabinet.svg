<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t2 d2"><title id="t2">Deep kitchen cabinet layout</title><desc id="d2">Front view of a deep base cabinet with daily items at the front, rarely used bulky items at the back and a pull-out basket on the lower shelf.</desc><rect width="800" height="420" fill="#fbf7f1"/><rect x="60" y="50" width="420" height="300" rx="0" fill="#fffdf9" stroke="#5b4a3a" stroke-width="6"/><rect x="70" y="60" width="400" height="10" rx="0" fill="#d9cdbd" stroke="#8a6a3b" stroke-width="2"/><rect x="80" y="90" width="150" height="110" rx="4" fill="#d4e7ee" stroke="#3d6f80" stroke-width="3"/><text x="155" y="150" font-size="18" font-weight="bold" fill="#24505f" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Daily</text><rect x="250" y="90" width="200" height="110" rx="4" fill="#f3dccf" stroke="#b5683c" stroke-width="3"/><text x="350" y="150" font-size="18" font-weight="bold" fill="#8d4a22" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Rare / bulky</text><rect x="80" y="225" width="370" height="95" rx="4" fill="#e7f0d9" stroke="#6f9a3a" stroke-width="3"/><text x="265" y="278" font-size="16" font-weight="bold" fill="#456b1d" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Pull-out basket: slides to you</text><line x1="60" y1="365" x2="480" y2="365" stroke="#c0392b" stroke-width="3"/><text x="270" y="392" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Measure depth, width and door opening</text><rect x="520" y="50" width="250" height="300" rx="10" fill="#fff" stroke="#d9cdbd" stroke-width="2"/><text x="540" y="84" font-size="19" font-weight="bold" fill="#3b2f23" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Deep cabinet rule</text><text x="540" y="118" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Front = used daily</text><text x="540" y="144" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Back = rarely used</text><text x="540" y="170" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Heavy things stay low</text><text x="540" y="196" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Check the door still</text><text x="540" y="222" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">opens past the basket</text></svg>