<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t9 d9"><title id="t9">Measuring under-bed clearance</title><desc id="d9">Side view of a bed on legs. Measurement A runs from the floor to the lowest part of the frame. A storage bin is slightly shorter than A so it slides in without catching.</desc><rect width="800" height="400" fill="#fbf7f1"/><rect x="40" y="330" width="720" height="10" fill="#8a6a3b"/><rect x="80" y="170" width="520" height="40" rx="8" fill="#cfe3ea" stroke="#3d6f80" stroke-width="3"/><rect x="80" y="210" width="520" height="22" rx="4" fill="#e8d5b7" stroke="#8a6a3b" stroke-width="3"/><rect x="90" y="232" width="18" height="98" rx="0" fill="#8a6a3b" stroke="#8a6a3b" stroke-width="1"/><rect x="572" y="232" width="18" height="98" rx="0" fill="#8a6a3b" stroke="#8a6a3b" stroke-width="1"/><rect x="150" y="262" width="330" height="64" rx="4" fill="#ffffff" stroke="#2e8b57" stroke-width="3"/><text x="315" y="300" font-size="18" font-weight="bold" fill="#256b43" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Storage bin</text><line x1="640" y1="232" x2="640" y2="330" stroke="#c0392b" stroke-width="3"/><text x="662" y="276" font-size="26" font-weight="bold" fill="#c0392b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">A</text><text x="662" y="302" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">floor to lowest</text><text x="662" y="322" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">part of frame</text><text x="80" y="60" font-size="20" font-weight="bold" fill="#3b2f23" text-anchor="start" font-family="Arial, Helvetica, sans-serif">1. Measure A at the narrowest point</text><text x="80" y="92" font-size="18" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">2. Pick a bin a little shorter than A</text><text x="80" y="120" font-size="18" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">3. Keep daily items out of it</text></svg>