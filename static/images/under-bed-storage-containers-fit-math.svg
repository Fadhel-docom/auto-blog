<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="t d">
<title id="t">Container height arithmetic</title><desc id="d">Two bars compare containers with a 6.0 inch usable limit: container A at 6.25 inches with lid and wheels is too tall, container B at 5.0 inches fits with 1.0 inch to spare.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#37443b"/></marker></defs>
<rect width="1000" height="520" fill="#fff"/>
<text x="500" y="38" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#37443b">Compare the full height, including lid and wheels</text>
<text x="60" y="92" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#37443b">Container A: 5.0 + 0.5 + 0.75 = 6.25 in</text>
<rect x="60" y="110" width="200.0" height="34" rx="0" fill="#cfd8c9" stroke="#4d6b55" stroke-width="2"/>
<text x="160.0" y="133" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#37443b">body 5.0</text>
<rect x="260.0" y="110" width="20.0" height="34" rx="0" fill="#e6e1d6" stroke="#4d6b55" stroke-width="2"/>
<text x="270.0" y="133" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#37443b"></text>
<rect x="280.0" y="110" width="30.0" height="34" rx="0" fill="#ffd7d0" stroke="#4d6b55" stroke-width="2"/>
<text x="295.0" y="133" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#37443b"></text>
<text x="326.0" y="133" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#b5533c">too tall</text>
<text x="60" y="202" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#37443b">Container B: 4.5 + 0.5 = 5.0 in (no wheels)</text>
<rect x="60" y="220" width="180.0" height="34" rx="0" fill="#cfd8c9" stroke="#4d6b55" stroke-width="2"/>
<text x="150.0" y="243" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#37443b">body 4.5</text>
<rect x="240.0" y="220" width="20.0" height="34" rx="0" fill="#e6e1d6" stroke="#4d6b55" stroke-width="2"/>
<text x="250.0" y="243" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#37443b"></text>
<text x="276.0" y="243" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#4d6b55">fits</text>
<line x1="300.0" y1="60" x2="300.0" y2="320" stroke="#4d6b55" stroke-width="2" stroke-dasharray="8 5"/>
<text x="300.0" y="345" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#4d6b55">limit 6.0 in</text>
<text x="500" y="372" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#58655b">Left to right: body, lid, wheels</text>
<text x="500" y="404" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#37443b">A is 0.25 in over the limit. B has 1.0 in to spare.</text>
<text x="500" y="436" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#58655b">Metric: limit 15 cm; A 15.9 cm; B 12.7 cm</text>
<text x="500" y="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#58655b">Add lid, wheels, handles and any lip to the listed body height before you compare.</text>

</svg>
