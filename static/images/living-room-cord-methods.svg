<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d"><title id="t">Four no-drill ways to tame cords</title><desc id="d">Four cards comparing adhesive clips, a cord raceway, sleeves or ties and a vented box, each with where it works best and what to watch out for.</desc><rect width="800" height="560" fill="#faf6ef"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f62"/></marker></defs><text x="400" y="36" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#23363a">Four no-drill ways to tame cords</text><text x="400" y="60" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#55696a">What each method is best for, and its catch</text><rect x="20" y="90" width="175" height="380" rx="10" fill="#fff" stroke="#23363a" stroke-width="2"/><rect x="20" y="90" width="175" height="50" rx="10" fill="#e6efd2" stroke="#2f6f62" stroke-width="2"/><text x="107" y="121" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#23363a">Adhesive clips</text><text x="107" y="170" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2f6f62">Best for</text><text x="107" y="190" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Baseboard, console</text><text x="107" y="206" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">back, lamp pole</text><text x="107" y="260" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#b5522f">Watch out</text><text x="107" y="284" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Clean the surface first</text><line x1="50" y1="296" x2="165" y2="296" stroke="#e4ddd0" stroke-width="1"/><text x="107" y="324" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Test a hidden spot</text><line x1="50" y1="336" x2="165" y2="336" stroke="#e4ddd0" stroke-width="1"/><text x="107" y="364" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Space about a foot apart</text><rect x="215" y="90" width="175" height="380" rx="10" fill="#fff" stroke="#23363a" stroke-width="2"/><rect x="215" y="90" width="175" height="50" rx="10" fill="#e6efd2" stroke="#2f6f62" stroke-width="2"/><text x="302" y="121" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#23363a">Cord raceway</text><text x="302" y="170" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2f6f62">Best for</text><text x="302" y="190" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Wall run from console</text><text x="302" y="206" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">to floor</text><text x="302" y="260" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#b5522f">Watch out</text><text x="302" y="284" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Channel must close freely</text><line x1="245" y1="296" x2="360" y2="296" stroke="#e4ddd0" stroke-width="1"/><text x="302" y="324" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Stay on the wall surface</text><line x1="245" y1="336" x2="360" y2="336" stroke="#e4ddd0" stroke-width="1"/><text x="302" y="364" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Leave the plug reachable</text><rect x="410" y="90" width="175" height="380" rx="10" fill="#fff" stroke="#23363a" stroke-width="2"/><rect x="410" y="90" width="175" height="50" rx="10" fill="#e6efd2" stroke="#2f6f62" stroke-width="2"/><text x="497" y="121" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#23363a">Sleeve or ties</text><text x="497" y="170" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2f6f62">Best for</text><text x="497" y="190" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Bundle behind the TV</text><text x="497" y="260" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#b5522f">Watch out</text><text x="497" y="284" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Hook-and-loop ties</text><line x1="440" y1="296" x2="555" y2="296" stroke="#e4ddd0" stroke-width="1"/><text x="497" y="324" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Label each plug</text><line x1="440" y1="336" x2="555" y2="336" stroke="#e4ddd0" stroke-width="1"/><text x="497" y="364" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Loose loop, no tight coil</text><rect x="605" y="90" width="175" height="380" rx="10" fill="#fff" stroke="#23363a" stroke-width="2"/><rect x="605" y="90" width="175" height="50" rx="10" fill="#e6efd2" stroke="#2f6f62" stroke-width="2"/><text x="692" y="121" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#23363a">Vented box</text><text x="692" y="170" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2f6f62">Best for</text><text x="692" y="190" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Holds the strip off</text><text x="692" y="206" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">the floor</text><text x="692" y="260" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#b5522f">Watch out</text><text x="692" y="284" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Keep vents open</text><line x1="635" y1="296" x2="750" y2="296" stroke="#e4ddd0" stroke-width="1"/><text x="692" y="324" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">No cloth on top</text><line x1="635" y1="336" x2="750" y2="336" stroke="#e4ddd0" stroke-width="1"/><text x="692" y="364" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Switch within reach</text><text x="400" y="510" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#23363a">No drilling, no nails: every method here lifts off the wall and leaves the paint</text></svg>