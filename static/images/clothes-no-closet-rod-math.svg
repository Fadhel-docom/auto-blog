<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 404' role='img' aria-labelledby='t d'><title id='t'>Rod space needed by an example wardrobe</title><desc id='d'>Bars show low and high rod space for shirts, jackets, coats, slacks and dresses, totaling 22.5 to 55 inches, compared with a 39 inch wide clothes rack.</desc><rect x='0' y='0' width='700' height='404' rx='0' fill='#fbf9f4' stroke='none' stroke-width='1'/><text x='20' y='30' font-size='19' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Rod space an example wardrobe needs</text><text x='20' y='54' font-size='13' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Dark bar = low estimate, light bar = high estimate (scale: 6 px per inch)</text><text x='20' y='100' font-size='13' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Shirts (12 × 0.5–1 in)</text><rect x='250' y='84' width='36' height='24' rx='0' fill='#5b6a4a' stroke='none' stroke-width='1'/><rect x='286' y='84' width='36' height='24' rx='0' fill='#9aa98a' stroke='none' stroke-width='1'/><text x='330' y='101' font-size='13' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>6–12 in</text><text x='20' y='136' font-size='13' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Jackets (4 × 2–4 in)</text><rect x='250' y='120' width='48' height='24' rx='0' fill='#5b6a4a' stroke='none' stroke-width='1'/><rect x='298' y='120' width='48' height='24' rx='0' fill='#9aa98a' stroke='none' stroke-width='1'/><text x='354' y='137' font-size='13' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>8–16 in</text><text x='20' y='172' font-size='13' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Coats (2 × 2–6 in)</text><rect x='250' y='156' width='24' height='24' rx='0' fill='#5b6a4a' stroke='none' stroke-width='1'/><rect x='274' y='156' width='48' height='24' rx='0' fill='#9aa98a' stroke='none' stroke-width='1'/><text x='330' y='173' font-size='13' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>4–12 in</text><text x='20' y='208' font-size='13' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Slacks (3 × 0.5–2 in)</text><rect x='250' y='192' width='9.0' height='24' rx='0' fill='#5b6a4a' stroke='none' stroke-width='1'/><rect x='259.0' y='192' width='27.0' height='24' rx='0' fill='#9aa98a' stroke='none' stroke-width='1'/><text x='294' y='209' font-size='13' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>1.5–6 in</text><text x='20' y='244' font-size='13' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Dresses (3 × 1–3 in)</text><rect x='250' y='228' width='18' height='24' rx='0' fill='#5b6a4a' stroke='none' stroke-width='1'/><rect x='268' y='228' width='36' height='24' rx='0' fill='#9aa98a' stroke='none' stroke-width='1'/><text x='312' y='245' font-size='13' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>3–9 in</text><text x='20' y='286' font-size='13' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Total rod space</text><rect x='250' y='270' width='135.0' height='28' rx='0' fill='#5b6a4a' stroke='none' stroke-width='1'/><rect x='385.0' y='270' width='195.0' height='28' rx='0' fill='#9aa98a' stroke='none' stroke-width='1'/><text x='588' y='289' font-size='13' text-anchor='start' font-weight='bold' fill='#b5523b' font-family='Helvetica,Arial,sans-serif'>22.5–55 in</text><line x1='484' y1='72' x2='484' y2='308' stroke='#b5523b' stroke-width='2' stroke-dasharray='5 4'/><text x='478' y='68' font-size='12' text-anchor='end' font-weight='bold' fill='#b5523b' font-family='Helvetica,Arial,sans-serif'>Rack width: 39 in</text><text x='20' y='340' font-size='13' text-anchor='start' font-weight='normal' fill='#b5523b' font-family='Helvetica,Arial,sans-serif'>The low estimate fits a 39 in rail; the high estimate does not. Fold or move the difference.</text><text x='20' y='368' font-size='12' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Arithmetic: low 6+8+4+1.5+3 = 22.5 in; high 12+16+12+6+9 = 55 in.</text></svg>
