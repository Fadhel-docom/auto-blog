<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="t d"><title id="t">Fill the tray by how often you cook with it</title><desc id="d">A tray shown from above in three bands: the front band for daily spices, the middle band for weekly ones and the back band for rarely used spices and backups.</desc><rect width="800" height="460" fill="#faf6ef"/><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5522f"/></marker></defs><text x="400.0" y="36.0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#23363a">Fill the tray by how often you cook with it</text><text x="400.0" y="60.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#55696a">Daily at the front, backups at the back</text><rect x="150" y="100" width="500" height="90" rx="8" fill="#f3e3c8" stroke="#2f6f62" stroke-width="2"/><text x="400.0" y="138.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#23363a">Back: rarely</text><text x="400.0" y="164.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#55696a">Baking spices, backups, seasonal jars</text><rect x="150" y="200" width="500" height="90" rx="8" fill="#dbe9e4" stroke="#2f6f62" stroke-width="2"/><text x="400.0" y="238.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#23363a">Middle: weekly</text><text x="400.0" y="264.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#55696a">Herbs and spices for regular recipes</text><rect x="150" y="300" width="500" height="90" rx="8" fill="#e6efd2" stroke="#2f6f62" stroke-width="2"/><text x="400.0" y="338.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#23363a">Front: every day</text><text x="400.0" y="364.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#55696a">Salt, pepper, oil, your favorite blend</text><line x1="100" y1="120" x2="100" y2="370" stroke="#b5522f" stroke-width="3" marker-end="url(#a)"/><text x="60.0" y="250.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#b5522f">Pull out</text><text x="400.0" y="420.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#55696a">Use a dry spoon, and keep jars away from steam while you cook.</text></svg>