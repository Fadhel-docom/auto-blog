<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 500' role='img' aria-labelledby='t d'><title id='t'>Small bedroom plan with a clear floor space</title><desc id='d'>Top view of a small bedroom with a queen bed, a 30 by 48 inch clear floor space beside it, a nightstand, a tall slim shelf, under-bed bins that pull out at the foot, and the door swing kept clear.</desc><rect width='700' height='500' fill='#fbf9f4'/><text x='20' y='30' font-size='21' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Plan view of a small bedroom (example)</text><rect x='30' y='50' width='436' height='396' rx='2' fill='#f6f2e8' stroke='#7a6a4f' stroke-width='4' opacity='1' /><rect x='100' y='50' width='198' height='264' rx='6' fill='#e4dccb' stroke='#8a7a5c' stroke-width='3' opacity='1' /><rect x='100' y='50' width='198' height='70' rx='6' fill='#f4efe0' stroke='#8a7a5c' stroke-width='2' opacity='1' /><text x='199' y='200' font-size='17' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Bed 60 × 80 in</text><rect x='34' y='56' width='56' height='56' rx='3' fill='#c9a56e' stroke='#8a6a3b' stroke-width='2' opacity='1' /><rect x='302' y='130' width='99' height='158' rx='6' fill='#dbe6cf' stroke='#5b6a4a' stroke-width='3' opacity='1' stroke-dasharray='10 6'/><text x='351' y='205' font-size='18' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>30 × 48 in</text><text x='351' y='228' font-size='16' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>clear floor</text><rect x='430' y='60' width='36' height='110' rx='2' fill='#fff' stroke='#7a6a4f' stroke-width='2' opacity='1' /><text x='448' y='190' font-size='14' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Shelf</text><rect x='112' y='318' width='52' height='30' rx='3' fill='#d8d2c4' stroke='#5b6a4a' stroke-width='2' opacity='1' stroke-dasharray='6 4'/><rect x='172' y='318' width='52' height='30' rx='3' fill='#d8d2c4' stroke='#5b6a4a' stroke-width='2' opacity='1' stroke-dasharray='6 4'/><rect x='232' y='318' width='52' height='30' rx='3' fill='#d8d2c4' stroke='#5b6a4a' stroke-width='2' opacity='1' stroke-dasharray='6 4'/><line x1='199' y1='356' x2='199' y2='392' stroke='#5b6a4a' stroke-width='3' /><polygon points='199,392 194,383 204,383' fill='#5b6a4a'/><text x='199' y='414' font-size='15' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Bins pull out at the foot</text><path d='M330 380 A66 66 0 0 1 396 446' fill='none' stroke='#8a6a3b' stroke-width='2.5' stroke-dasharray='6 5'/><line x1='330' y1='446' x2='330' y2='380' stroke='#8a6a3b' stroke-width='3' /><text x='400' y='376' font-size='15' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Door swing</text><rect x='490' y='70' width='18' height='18' rx='3' fill='#dbe6cf' stroke='#5b6a4a' stroke-width='2' opacity='1' stroke-dasharray='4 3'/><text x='516' y='85' font-size='18' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Clear floor space</text><text x='516' y='107' font-size='16' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>30 × 48 in beside bed</text><rect x='490' y='140' width='18' height='18' rx='3' fill='#e4dccb' stroke='#8a7a5c' stroke-width='2' opacity='1' /><text x='516' y='155' font-size='18' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Queen bed</text><rect x='490' y='200' width='18' height='18' rx='3' fill='#fff' stroke='#7a6a4f' stroke-width='2' opacity='1' /><text x='516' y='215' font-size='18' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Tall slim shelf</text><text x='516' y='237' font-size='16' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>on the far wall</text><rect x='490' y='270' width='18' height='18' rx='3' fill='#d8d2c4' stroke='#5b6a4a' stroke-width='2' opacity='1' stroke-dasharray='4 3'/><text x='516' y='285' font-size='18' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Flat under-bed bins</text><text x='20' y='478' font-size='15' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Room size and bed are examples. Tape the 30 × 48 in rectangle on your floor first.</text><rect x='490' y='320' width='18' height='18' rx='3' fill='#c9a56e' stroke='#8a6a3b' stroke-width='2'/><text x='516' y='335' font-size='18' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Nightstand</text></svg>