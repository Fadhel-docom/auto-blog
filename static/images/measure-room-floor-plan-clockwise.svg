<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif">
<title id="t1">A labeled floor plan of a room</title>
<desc id="d1">A top-view floor plan with walls lettered A to D, a window on wall A, a door on wall D with an entrance triangle, a column in one corner, and arrows showing that measuring runs clockwise from corner to corner.</desc>
<rect width="800" height="460" fill="#fbf8f3"/>
<text x="400" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#2d2a26">Draw the room first, then measure clockwise</text>
<rect x="180" y="70" width="440" height="300" fill="#fffdf9" stroke="#2d2a26" stroke-width="5"/>
<rect x="180" y="70" width="40" height="40" fill="#dfe6f2" stroke="#44566b" stroke-width="2"/>
<text x="200" y="96" text-anchor="middle" font-size="11" fill="#2d2a26">Col.</text>
<rect x="330" y="64" width="140" height="12" fill="#cfe3f5" stroke="#44566b" stroke-width="2"/>
<text x="400" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#2d2a26">W1</text>
<rect x="174" y="240" width="12" height="80" fill="#fbf8f3"/>
<path d="M180 240 A80 80 0 0 1 260 320" fill="none" stroke="#8a5a1f" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="180" y1="320" x2="260" y2="320" stroke="#8a5a1f" stroke-width="3"/>
<text x="150" y="285" text-anchor="end" font-size="13" font-weight="700" fill="#2d2a26">DW1</text>
<polygon points="126,322 126,298 146,310" fill="#3f7d3a"/>
<text x="120" y="345" font-size="12" fill="#2d2a26">Entrance</text>
<g font-size="22" font-weight="700" fill="#245a20" text-anchor="middle">
<text x="400" y="104">A</text><text x="588" y="224">B</text><text x="400" y="352">C</text><text x="212" y="224" fill="#245a20">D</text></g>
<g stroke="#3f7d3a" stroke-width="3" fill="none"><path d="M236 124 L560 124"/><path d="M560 124 L560 330" /><path d="M560 330 L236 330" /></g>
<polygon points="560,118 574,124 560,130" fill="#3f7d3a"/><polygon points="566,236 560,248 554,236" fill="#3f7d3a"/><polygon points="236,324 222,330 236,336" fill="#3f7d3a"/>
<g font-size="14" fill="#2d2a26">
<text x="640" y="150" font-weight="700">Write on the plan</text>
<text x="640" y="172" font-size="13">Each wall, edge to edge</text>
<text x="640" y="192" font-size="13">Door and window spots,</text><text x="640" y="210" font-size="13">frames included</text>
<text x="640" y="232" font-size="13">Ceiling height, beams,</text><text x="640" y="250" font-size="13">columns, vents, outlets</text>
<text x="640" y="272" font-size="13">No furniture drawn</text></g>
<text x="400" y="408" text-anchor="middle" font-size="13" fill="#2d2a26">Green arrows show the clockwise measuring order. Example only; your room will differ.</text>
</svg>
