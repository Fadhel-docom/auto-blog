<svg xmlns="http://www.w3.org/2000/svg" width="700" height="787" viewBox="0 0 700 787" role="img" aria-labelledby="t d"><title id="t">Measure before you buy anything</title><desc id="d">Front and side views of a cabinet with three dimension markers: W for interior width, H for interior height and D for interior depth, followed by a three-step measuring routine.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C4622D"/></marker></defs><rect width="700" height="787" rx="24" fill="#F6F1E8"/><text x="40" y="48" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1F3A34" text-anchor="start">Measure before you buy anything</text><text x="40" y="78" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5E6B66" text-anchor="start">Three numbers per cabinet prevent wasted purchases.</text><rect x="70" y="152" width="190" height="150" rx="6" fill="#FFFFFF" stroke="#1F3A34" stroke-width="3"/><line x1="70" y1="227" x2="260" y2="227" stroke="#1F3A34" stroke-width="3"/><line x1="70" y1="136" x2="260" y2="136" stroke="#C4622D" stroke-width="3" marker-end="url(#ar)" marker-start="url(#ar)"/><circle cx="165" cy="136" r="14" fill="#C4622D"/><text x="165" y="142" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">W</text><line x1="46" y1="152" x2="46" y2="302" stroke="#C4622D" stroke-width="3" marker-end="url(#ar)" marker-start="url(#ar)"/><circle cx="46" cy="227" r="14" fill="#C4622D"/><text x="46" y="233" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">H</text><rect x="320" y="152" width="110" height="150" rx="6" fill="#FFFFFF" stroke="#1F3A34" stroke-width="3"/><line x1="320" y1="136" x2="430" y2="136" stroke="#C4622D" stroke-width="3" marker-end="url(#ar)" marker-start="url(#ar)"/><circle cx="375" cy="136" r="14" fill="#C4622D"/><text x="375" y="142" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">D</text><text x="165" y="328" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="middle">Front view</text><text x="375" y="328" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="middle">Side view</text><rect x="470" y="130" width="190" height="146" rx="16" fill="#E6EEF2"/><text x="486" y="163" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F3A34" text-anchor="start">Record three</text><text x="486" y="185" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F3A34" text-anchor="start">numbers</text><text x="486" y="210" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="start">W interior width. H</text><text x="486" y="231" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="start">interior height. D</text><text x="486" y="252" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="start">interior depth.</text><rect x="40" y="354" width="620" height="104" rx="16" fill="#DCEBDD"/><circle cx="70" cy="379.9" r="15" fill="#2F7F79"/><text x="70" y="385.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F6F1E8" text-anchor="middle">1</text><text x="100" y="388" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F3A34" text-anchor="start">Make an inventory</text><text x="100" y="413" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="start">Cookware, baking sheets, dishes, spices, dry goods and small</text><text x="100" y="434" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="start">appliances.</text><rect x="40" y="470" width="620" height="83" rx="16" fill="#E6EEF2"/><circle cx="70" cy="495.9" r="15" fill="#2F7F79"/><text x="70" y="501.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F6F1E8" text-anchor="middle">2</text><text x="100" y="504" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F3A34" text-anchor="start">Measure each cabinet</text><text x="100" y="529" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="start">Interior width, depth and height. Rentals vary widely.</text><rect x="40" y="565" width="620" height="104" rx="16" fill="#F3E3D3"/><circle cx="70" cy="590.9" r="15" fill="#2F7F79"/><text x="70" y="596.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F6F1E8" text-anchor="middle">3</text><text x="100" y="599" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F3A34" text-anchor="start">Spot dead space</text><text x="100" y="624" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="start">The gap between a cabinet door and the countertop, interior corners of</text><text x="100" y="645" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="start">upper cabinets, and the top of high cabinets.</text><rect x="40" y="685" width="620" height="68" rx="14" fill="#1F3A34"/><text x="56" y="714" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#F6F1E8" text-anchor="start">Typical factory base cabinet: 34.5 in tall and 24 in deep. Typical wall</text><text x="56" y="738" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#F6F1E8" text-anchor="start">cabinet: 12 in deep. Measure yours.</text></svg>
