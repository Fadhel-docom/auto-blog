<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d"><title id="t">Toy storage by reach height</title><desc id="d">Wall elevation of a low toy shelf with three rows of bins, showing the children reach ranges of 20 to 36 inches for ages 3 and 4 and 18 to 40 inches for ages 5 to 8, plus an archive bin higher up for adults only.</desc><rect width="800" height="560" fill="#faf6ef"/><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5522f"/></marker></defs><text x="400.0" y="36" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#23363a">Toy storage by reach height</text><text x="400.0" y="60" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#55696a">Where children can reach, and where the archive bin goes</text><rect x="250" y="140.0" width="330" height="360.0" fill="#fff" stroke="#23363a" stroke-width="2"/><line x1="230" y1="500" x2="600" y2="500" stroke="#23363a" stroke-width="3"/><rect x="250" y="284.0" width="330" height="96.0" fill="#e6efd2" opacity="0.8"/><rect x="290" y="440.0" width="250" height="60.0" fill="#fff" stroke="#2f6f62" stroke-width="2"/><rect x="302.0" y="448.0" width="105.0" height="44.0" rx="3" fill="#dbe9e4" stroke="#2f6f62"/><rect x="419.0" y="448.0" width="105.0" height="44.0" rx="3" fill="#dbe9e4" stroke="#2f6f62"/><rect x="290" y="380.0" width="250" height="60.0" fill="#fff" stroke="#2f6f62" stroke-width="2"/><rect x="302.0" y="388.0" width="105.0" height="44.0" rx="3" fill="#dbe9e4" stroke="#2f6f62"/><rect x="419.0" y="388.0" width="105.0" height="44.0" rx="3" fill="#dbe9e4" stroke="#2f6f62"/><rect x="290" y="320.0" width="250" height="60.0" fill="#fff" stroke="#2f6f62" stroke-width="2"/><rect x="302.0" y="328.0" width="105.0" height="44.0" rx="3" fill="#dbe9e4" stroke="#2f6f62"/><rect x="419.0" y="328.0" width="105.0" height="44.0" rx="3" fill="#dbe9e4" stroke="#2f6f62"/><text x="415.0" y="414.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Open bins, labeled with pictures</text><rect x="310" y="152.0" width="210" height="60.0" rx="3" fill="#f3e3c8" stroke="#b5522f" stroke-width="2"/><text x="415.0" y="186.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Archive bin (adult reach)</text><rect x="289" y="311.0" width="14" height="14" fill="#b5522f"/><text x="586" y="323.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#b5522f">anchor point</text><line x1="214" y1="380.0" x2="214" y2="284.0" stroke="#b5522f" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/><text x="206" y="330.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="end" fill="#b5522f">Ages 3 to 4</text><text x="206" y="346.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#55696a">20 to 36 in</text><line x1="100" y1="392.0" x2="100" y2="260.0" stroke="#b5522f" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/><text x="92" y="324.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="end" fill="#b5522f">Ages 5 to 8</text><text x="92" y="340.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#55696a">18 to 40 in</text><text x="415.0" y="276.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2f6f62">Shared by ages 3 to 8: 20 to 36 in</text></svg>