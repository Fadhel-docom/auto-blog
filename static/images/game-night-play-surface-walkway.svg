<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif">
<title id="t1">Three measurements for game night</title>
<desc id="d1">A plan view of a living room showing the outer table edge, the smaller clear play surface inside it, the pulled-out chairs, and a taped walkway of about 36 inches running from the door past the table.</desc>
<rect width="800" height="470" fill="#fbf8f3"/>
<text x="400" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#2d2a26">Three measurements for game night</text>
<rect x="40" y="50" width="720" height="390" rx="6" fill="#fffdf9" stroke="#2d2a26" stroke-width="2"/>
<rect x="36" y="368" width="8" height="56" fill="#fbf8f3"/>
<text x="52" y="418" font-size="12" fill="#2d2a26">Door</text>
<rect x="300" y="170" width="200" height="100" rx="8" fill="#e9d3b0" stroke="#8a5a1f" stroke-width="2"/>
<rect x="322" y="186" width="156" height="68" rx="4" fill="#fffdf9" stroke="#3f7d3a" stroke-width="2" stroke-dasharray="7 5"/>
<text x="400" y="226" text-anchor="middle" font-size="14" font-weight="700" fill="#245a20">Play surface</text>
<g fill="#cfd8e3" stroke="#44566b" stroke-width="2">
<rect x="326" y="118" width="52" height="30" rx="6"/><rect x="422" y="118" width="52" height="30" rx="6"/>
<rect x="326" y="292" width="52" height="30" rx="6"/><rect x="422" y="292" width="52" height="30" rx="6"/></g>
<rect x="60" y="340" width="680" height="84" fill="#dcefd9" fill-opacity="0.75" stroke="#3f7d3a" stroke-width="2" stroke-dasharray="8 6"/>
<text x="400" y="392" text-anchor="middle" font-size="15" font-weight="700" fill="#245a20">Walkway to tape out</text>
<text x="400" y="412" text-anchor="middle" font-size="12" fill="#2d2a26">Yardstick: 36 in wide, measured with the chairs pulled out</text>
<g stroke="#2d2a26" stroke-width="1.5" fill="none"><line x1="500" y1="200" x2="560" y2="200"/><line x1="474" y1="130" x2="560" y2="130"/><line x1="236" y1="306" x2="302" y2="268"/></g>
<g font-size="14" fill="#2d2a26">
<text x="566" y="196" font-weight="700">1. Clear play surface</text><text x="566" y="214" font-size="12">What is left after the lip and decor</text>
<text x="566" y="126" font-weight="700">2. Chair space</text><text x="566" y="144" font-size="12">Seats pulled back, as in play</text>
<text x="70" y="312" font-weight="700">3. Outer table edge</text><text x="70" y="330" font-size="12" >Not the number to plan the game by</text></g>
</svg>
