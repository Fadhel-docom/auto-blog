<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" role="img" aria-labelledby="t d"><title id="t">The never list, and the one safe route</title><desc id="d">Five unsafe ways to handle living room cords, under a rug, through a doorway, chained power strips, staples or nails and damaged cords, and one safe route along the baseboard.</desc><rect width="800" height="530" fill="#faf6ef"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f62"/></marker></defs><text x="400" y="36" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#23363a">The never list, and the one safe route</text><text x="400" y="60" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#55696a">Five shortcuts to skip</text><rect x="40" y="90" width="720" height="58" rx="8" fill="#fbe9e1" stroke="#b5522f" stroke-width="2"/><circle cx="80" cy="119" r="17" fill="#b5522f"/><path d="M72,111 L88,127 M88,111 L72,127" stroke="#fff" stroke-width="4" fill="none"/><text x="115" y="116" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#23363a">Under a rug or carpet</text><text x="115" y="135" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#55696a">traps heat and hides damage</text><rect x="40" y="160" width="720" height="58" rx="8" fill="#fbe9e1" stroke="#b5522f" stroke-width="2"/><circle cx="80" cy="189" r="17" fill="#b5522f"/><path d="M72,181 L88,197 M88,181 L72,197" stroke="#fff" stroke-width="4" fill="none"/><text x="115" y="186" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#23363a">Through a doorway, wall or floor</text><text x="115" y="205" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#55696a">can overheat or be pinched</text><rect x="40" y="230" width="720" height="58" rx="8" fill="#fbe9e1" stroke="#b5522f" stroke-width="2"/><circle cx="80" cy="259" r="17" fill="#b5522f"/><path d="M72,251 L88,267 M88,251 L72,267" stroke="#fff" stroke-width="4" fill="none"/><text x="115" y="256" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#23363a">One strip plugged into another</text><text x="115" y="275" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#55696a">daisy chaining overloads the outlet</text><rect x="40" y="300" width="720" height="58" rx="8" fill="#fbe9e1" stroke="#b5522f" stroke-width="2"/><circle cx="80" cy="329" r="17" fill="#b5522f"/><path d="M72,321 L88,337 M88,321 L72,337" stroke="#fff" stroke-width="4" fill="none"/><text x="115" y="326" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#23363a">Fastened with staples or nails</text><text x="115" y="345" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#55696a">can crush the cord insulation</text><rect x="40" y="370" width="720" height="58" rx="8" fill="#fbe9e1" stroke="#b5522f" stroke-width="2"/><circle cx="80" cy="399" r="17" fill="#b5522f"/><path d="M72,391 L88,407 M88,391 L72,407" stroke="#fff" stroke-width="4" fill="none"/><text x="115" y="396" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#23363a">Damaged, or hot to the touch</text><text x="115" y="415" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#55696a">replace it, never repair it</text><rect x="40" y="440" width="720" height="58" rx="8" fill="#e6efd2" stroke="#2f6f62" stroke-width="2"/><circle cx="80" cy="469" r="17" fill="#2f6f62"/><path d="M71,469 L78,476 L90,462" stroke="#fff" stroke-width="4" fill="none"/><text x="115" y="466" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#23363a">Along the baseboard in clips or a raceway</text><text x="115" y="485" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#55696a">visible, straight, easy to inspect</text></svg>