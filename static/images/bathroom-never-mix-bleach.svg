<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 430' role='img' aria-labelledby='t d'><title id='t'>Products that must never be mixed with bleach</title><desc id='d'>Bleach in the center with dashed red lines to ammonia, vinegar, toilet bowl and drain cleaners, and any other cleaner, each marked never mix.</desc><rect x='0' y='0' width='700' height='430' rx='0' fill='#fbf9f4' stroke='none' stroke-width='1'/><text x='20' y='30' font-size='19' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Bleach never meets other products</text><rect x='270' y='170' width='160' height='60' rx='8' fill='#ffffff' stroke='#6b6b6b' stroke-width='3'/><text x='350' y='206' font-size='18' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Bleach</text><rect x='40' y='70' width='180' height='56' rx='8' fill='#f6f2e8' stroke='#b8ad92' stroke-width='2'/><text x='130' y='103' font-size='15' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Ammonia</text><rect x='480' y='70' width='180' height='56' rx='8' fill='#f6f2e8' stroke='#b8ad92' stroke-width='2'/><text x='570' y='103' font-size='15' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Vinegar</text><rect x='40' y='290' width='180' height='56' rx='8' fill='#f6f2e8' stroke='#b8ad92' stroke-width='2'/><text x='130' y='323' font-size='15' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Toilet bowl and</text><rect x='480' y='290' width='180' height='56' rx='8' fill='#f6f2e8' stroke='#b8ad92' stroke-width='2'/><text x='570' y='323' font-size='15' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Any other cleaner</text><text x='130' y='333' font-size='15' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>drain cleaners</text><line x1='220' y1='126' x2='290' y2='170' stroke='#a8584a' stroke-width='3' stroke-dasharray='7 5'/><line x1='480' y1='126' x2='410' y2='170' stroke='#a8584a' stroke-width='3' stroke-dasharray='7 5'/><line x1='220' y1='310' x2='290' y2='230' stroke='#a8584a' stroke-width='3' stroke-dasharray='7 5'/><line x1='480' y1='310' x2='410' y2='230' stroke='#a8584a' stroke-width='3' stroke-dasharray='7 5'/><text x='350' y='126' font-size='14' text-anchor='middle' font-weight='bold' fill='#a8584a' font-family='Helvetica,Arial,sans-serif'>NEVER MIX</text><text x='20' y='400' font-size='13' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Mixing chlorine bleach with ammonia or vinegar can create toxic fumes. Keep bleach in its own bin.</text></svg>