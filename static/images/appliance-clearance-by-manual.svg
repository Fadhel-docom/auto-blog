<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t2 d2" font-family="Arial, Helvetica, sans-serif">
<title id="t2">Clearance around an appliance is set by its manual</title>
<desc id="d2">An appliance inside a dashed clearance boundary labelled top, side and rear: see manual, beside three manual examples that give different numbers.</desc>
<rect width="800" height="400" fill="#fbf8f3"/>
<text x="400" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#2d2a26">Same job, different numbers</text>
<rect x="40" y="90" width="270" height="230" fill="none" stroke="#b3402a" stroke-width="3" stroke-dasharray="9 6"/>
<rect x="105" y="170" width="140" height="110" fill="#e6e1d8" stroke="#6b6559" stroke-width="2"/>
<text x="175" y="230" text-anchor="middle" font-size="16" font-weight="700" fill="#2d2a26">Appliance</text>
<text x="175" y="130" text-anchor="middle" font-size="14" fill="#8a2f1d">Top: see manual</text>
<text x="48" y="228" font-size="13" fill="#8a2f1d">Side</text>
<text x="302" y="228" text-anchor="end" font-size="13" fill="#8a2f1d">Side</text>
<text x="175" y="306" text-anchor="middle" font-size="14" fill="#8a2f1d">Rear: see manual</text>
<text x="350" y="100" font-size="16" font-weight="700" fill="#2d2a26">Examples from three manuals</text>
<text x="350" y="140" font-size="15" fill="#2d2a26">GE toaster oven: 4 in on all sides</text>
<text x="350" y="180" font-size="15" fill="#2d2a26">Panasonic NB-G211: 4 in side, 12 in top, 4 in rear</text>
<text x="350" y="220" font-size="15" fill="#2d2a26">GE countertop microwave: 3 in sides and top, 1 in rear</text>
<text x="350" y="272" font-size="14" fill="#8a2f1d">These are examples, not a rule. Your model manual decides.</text>
<text x="350" y="298" font-size="14" fill="#5b564f">Storing is not operating: running needs the open space.</text>
</svg>