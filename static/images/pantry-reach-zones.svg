ke-width='1' opacity='1'/><rect x='210' y='60' width='34' height='30' rx='3' fill='#e4dccb' stroke='#8a7a5c' stroke-width='1' opacity='1'/><rect x='28' y='452' width='46' height='10' rx='3' fill='#8a6a3b' stroke='none' stroke-width='1' opacity='1'/><rect x='32' y='462' width='6' height='48' rx='3' fill='#8a6a3b' stroke='none' stroke-width='1' opacity='1'/><rect x='64' y='462' width='6' height='48' rx='3' fill='#8a6a3b' stroke='none' stroke-width='1' opacity='1'/><rect x='30' y='486' width='42' height='6' rx='3' fill='#8a6a3b' stroke='none' stroke-width='1' opacity='1'/><text x='51' y='530' font-size='15' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>step stool</text><text x='290' y='100' font-size='22' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Above 48 in</text><text x='290' y='128' font-size='18' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Light, rarely used items</text><text x='290' y='152' font-size='18' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Use a step stool</text><text x='290' y='258' font-size='22' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>15 to 48 in</text><text x='290' y='286' font-size='18' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Daily items: rice, pasta,</text><text x='290' y='310' font-size='18' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>oats, flour, snacks</text><text x='290' y='334' font-size='18' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>(ADA forward reach range)</text><text x='290' y='450' font-size='22' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Below 15 in</text><text x='290' y='474' font-size='18' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Heavy, bulky items:</text><text x='290' y='496' font-size='18' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>bulk bags, oil, cans, baskets</text><text x='20' y='548' font-size='15' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Heights are planning examples. The ADA 15 to 48 in range is a</text><text x='20' y='568' font-size='15' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>comfort guide here, not a rule for your kitchen.</text></svg>