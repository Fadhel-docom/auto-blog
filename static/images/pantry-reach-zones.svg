<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 580' role='img' aria-labelledby='t d'><title id='t'>Shelf heights by reach zone</title><desc id='d'>Front view of a tall slim shelf with three zones: below 15 inches for heavy items, 15 to 48 inches for daily items, above 48 inches for light items reached with a step stool.</desc><rect width='700' height='580' fill='#fbf9f4'/><rect x='10' y='420' width='680' height='90' rx='0' fill='#ecdcc3' stroke='none' stroke-width='1' opacity='1'/><rect x='10' y='222' width='680' height='198' rx='0' fill='#dbe6cf' stroke='none' stroke-width='1' opacity='1'/><rect x='10' y='66' width='680' height='156' rx='0' fill='#efe9dd' stroke='none' stroke-width='1' opacity='1'/><line x1='10' y1='420' x2='690' y2='420' stroke='#8a6a3b' stroke-width='1.5' stroke-dasharray='6 5'/><text x='100' y='414' font-size='16' text-anchor='end' font-weight='bold' fill='#8a6a3b' font-family='Helvetica,Arial,sans-serif'>15 in</text><line x1='10' y1='222' x2='690' y2='222' stroke='#8a6a3b' stroke-width='1.5' stroke-dasharray='6 5'/><text x='100' y='216' font-size='16' text-anchor='end' font-weight='bold' fill='#8a6a3b' font-family='Helvetica,Arial,sans-serif'>48 in</text><rect x='110' y='78' width='8' height='432' rx='3' fill='#c9a56e' stroke='none' stroke-width='1' opacity='1'/><rect x='252' y='78' width='8' height='432' rx='3' fill='#c9a56e' stroke='none' stroke-width='1' opacity='1'/><rect x='110' y='480' width='150' height='6' rx='3' fill='#c9a56e' stroke='none' stroke-width='1' opacity='1'/><rect x='110' y='396' width='150' height='6' rx='3' fill='#c9a56e' stroke='none' stroke-width='1' opacity='1'/><rect x='110' y='312' width='150' height='6' rx='3' fill='#c9a56e' stroke='none' stroke-width='1' opacity='1'/><rect x='110' y='240' width='150' height='6' rx='3' fill='#c9a56e' stroke='none' stroke-width='1' opacity='1'/><rect x='110' y='156' width='150' height='6' rx='3' fill='#c9a56e' stroke='none' stroke-width='1' opacity='1'/><rect x='110' y='84'