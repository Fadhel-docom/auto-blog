<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 460' role='img' aria-labelledby='t d'><title id='t'>Studio width checks</title><desc id='d'>Four horizontal bars drawn to the same scale: 36 inch main path, 42 inch kitchen work aisle, 32 inches behind table chairs, and a 24 inch width that is too tight.</desc><rect width='700' height='460' fill='#fbf9f4'/><text x='20' y='30' font-size='21' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Check widths before you buy (inches)</text><text x='40' y='70' font-size='19' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Main path: 36 in minimum</text><rect x='40' y='84' width='216' height='34' rx='4' fill='#8f9a7a' stroke='#5b6a4a' stroke-width='2' opacity='1' /><text x='268' y='108' font-size='18' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>36 in</text><text x='40' y='156' font-size='19' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Kitchen work aisle: 42 in (one cook)</text><rect x='40' y='170' width='252' height='34' rx='4' fill='#e9d29b' stroke='#5b6a4a' stroke-width='2' opacity='1' /><text x='304' y='194' font-size='18' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>42 in</text><text x='40' y='242' font-size='19' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Behind table chairs: 32 in</text><rect x='40' y='256' width='192' height='34' rx='4' fill='#a9b8c9' stroke='#5b6a4a' stroke-width='2' opacity='1' /><text x='244' y='280' font-size='18' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>32 in</text><text x='40' y='328' font-size='19' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Under 36 in: you walk sideways</text><rect x='40' y='342' width='144' height='34' rx='4' fill='#d98c7a' stroke='#5b6a4a' stroke-width='2' opacity='1' /><text x='196' y='366' font-size='18' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>24 in</text><text x='20' y='420' font-size='15' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>ADA 403.5.1 and NKBA are benchmarks, not rules for your home.</text><text x='20' y='441' font-size='15' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Measure your own room.</text></svg>