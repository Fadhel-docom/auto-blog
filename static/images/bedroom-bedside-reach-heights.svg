<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 495' role='img' aria-labelledby='t d'><title id='t'>Bedside and shelf heights by reach</title><desc id='d'>Front view of a nightstand and a tall slim shelf over three zones: below 15 inches for heavy items, 15 to 48 inches for daily items, above 48 inches for light items.</desc><rect width='700' height='495' fill='#fbf9f4'/><text x='20' y='30' font-size='21' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Bedside and shelf heights (examples)</text><rect x='10' y='355' width='680' height='75' rx='0' fill='#ecdcc3' stroke='none' stroke-width='1' opacity='1' /><rect x='10' y='190' width='680' height='165' rx='0' fill='#dbe6cf' stroke='none' stroke-width='1' opacity='1' /><rect x='10' y='70' width='680' height='120' rx='0' fill='#efe9dd' stroke='none' stroke-width='1' opacity='1' /><line x1='10' y1='355' x2='690' y2='355' stroke='#8a6a3b' stroke-width='1.5' stroke-dasharray='6 5'/><text x='30' y='349' font-size='15' text-anchor='start' font-weight='bold' fill='#8a6a3b' font-family='Helvetica,Arial,sans-serif'>15 in</text><line x1='10' y1='190' x2='690' y2='190' stroke='#8a6a3b' stroke-width='1.5' stroke-dasharray='6 5'/><text x='30' y='184' font-size='15' text-anchor='start' font-weight='bold' fill='#8a6a3b' font-family='Helvetica,Arial,sans-serif'>48 in</text><rect x='70' y='300' width='100' height='130' rx='3' fill='#fff' stroke='#7a6a4f' stroke-width='2' opacity='1' /><line x1='70' y1='365' x2='170' y2='365' stroke='#7a6a4f' stroke-width='2' /><rect x='105' y='278' width='26' height='22' rx='3' fill='#f4efe0' stroke='#8a7a5c' stroke-width='2' opacity='1' /><rect x='138' y='270' width='18' height='30' rx='3' fill='#e9d29b' stroke='#8a7a5c' stroke-width='2' opacity='1' /><text x='120' y='452' font-size='15' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Nightstand</text><rect x='230' y='130' width='90' height='300' rx='3' fill='#fff' stroke='#7a6a4f' stroke-width='2' opacity='1' /><line x1='230' y1='410' x2='320' y2='410' stroke='#7a6a4f' stroke-width='3' /><line x1='230' y1='350' x2='320' y2='350' stroke='#7a6a4f' stroke-width='3' /><line x1='230' y1='290' x2='320' y2='290' stroke='#7a6a4f' stroke-width='3' /><line x1='230' y1='230' x2='320' y2='230' stroke='#7a6a4f' stroke-width='3' /><line x1='230' y1='170' x2='320' y2='170' stroke='#7a6a4f' stroke-width='3' /><rect x='244' y='376' width='62' height='34' rx='3' fill='#b88f5a' stroke='#8a7a5c' stroke-width='1.5' opacity='1' /><rect x='244' y='316' width='62' height='34' rx='3' fill='#d8d2c4' stroke='#8a7a5c' stroke-width='1.5' opacity='1' /><rect x='244' y='256' width='62' height='34' rx='3' fill='#e4dccb' stroke='#8a7a5c' stroke-width='1.5' opacity='1' /><rect x='244' y='196' width='62' height='34' rx='3' fill='#e4dccb' stroke='#8a7a5c' stroke-width='1.5' opacity='1' /><rect x='244' y='136' width='62' height='34' rx='3' fill='#f4efe0' stroke='#8a7a5c' stroke-width='1.5' opacity='1' /><text x='275' y='452' font-size='15' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Tall shelf</text><text x='350' y='94' font-size='21' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Above 48 in</text><text x='350' y='120' font-size='18' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Light, rare items. Step stool.</text><text x='350' y='220' font-size='21' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>15 to 48 in</text><text x='350' y='246' font-size='18' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Phone, glasses, book, daily items</text><text x='350' y='272' font-size='16' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>(ADA reach range, used as a guide)</text><text x='350' y='385' font-size='21' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Below 15 in</text><text x='350' y='409' font-size='18' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Heavy bins and spare bedding</text><text x='20' y='478' font-size='15' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Heights are planning examples. Measure your own furniture.</text></svg>