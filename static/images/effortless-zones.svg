<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 278" role="img" aria-labelledby="t d"><title id="t">One job per area</title><desc id="d">Four cards describing the single job of the entryway, kitchen, bedroom and bathroom and what belongs in each.</desc><rect width="800" height="278" fill="#faf6ef"/><text x="400.0" y="38" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#23363a">One job per area</text><text x="400.0" y="62" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#55696a">Decide the job first, then pick the container</text><rect x="24" y="84" width="178" height="170" rx="10" fill="#dbe9e4" stroke="#2f6f62" stroke-width="1.5"/><circle cx="46" cy="108" r="13" fill="#2f6f62"/><text x="46.0" y="113" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">1</text><text x="66.0" y="113" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#23363a">Entryway</text><text x="38.0" y="140" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#23363a">Job: arrive and leave</text><text x="38.0" y="157" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#23363a">Keys, bag, shoes, coat</text><text x="38.0" y="174" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#23363a">One hook or tray per</text><text x="38.0" y="191" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#23363a">person</text><rect x="216" y="84" width="178" height="170" rx="10" fill="#f3e3c8" stroke="#2f6f62" stroke-width="1.5"/><circle cx="238" cy="108" r="13" fill="#2f6f62"/><text x="237.5" y="113" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">2</text><text x="257.5" y="113" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#23363a">Kitchen</text><text x="229.5" y="140" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#23363a">Job: prep, cook, clean</text><text x="229.5" y="157" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#23363a">Tools live where used</text><text x="229.5" y="174" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#23363a">Counter keeps one clear</text><text x="229.5" y="191" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#23363a">work area</text><rect x="407" y="84" width="178" height="170" rx="10" fill="#e4dcef" stroke="#2f6f62" stroke-width="1.5"/><circle cx="429" cy="108" r="13" fill="#2f6f62"/><text x="429.0" y="113" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">3</text><text x="449.0" y="113" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#23363a">Bedroom</text><text x="421.0" y="140" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#23363a">Job: sleep, dress,</text><text x="421.0" y="157" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#23363a">laundry</text><text x="421.0" y="174" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#23363a">Daily clothes easiest to</text><text x="421.0" y="191" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#23363a">reach</text><text x="421.0" y="208" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#23363a">Seasonal items under bed</text><text x="421.0" y="225" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#23363a">or high</text><rect x="598" y="84" width="178" height="170" rx="10" fill="#f6d9d0" stroke="#2f6f62" stroke-width="1.5"/><circle cx="620" cy="108" r="13" fill="#2f6f62"/><text x="620.5" y="113" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">4</text><text x="640.5" y="113" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#23363a">Bathroom</text><text x="612.5" y="140" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#23363a">Job: daily vs backup</text><text x="612.5" y="157" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#23363a">Daily items within reach</text><text x="612.5" y="174" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#23363a">Spares grouped in one bin</text></svg>