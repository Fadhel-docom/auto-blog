<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 560' role='img' aria-labelledby='t d'><title id='t'>Adhesive hook steps</title><desc id='d'>Five numbered steps for applying clear adhesive hooks and a removal box: pull the strip straight down and stretch it at least 12 inches.</desc><rect width='700' height='560' fill='#fbf9f4'/><text x='20' y='34' font-size='22' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Adhesive hook steps (clear hooks)</text><rect x='20' y='52' width='660' height='50' rx='8' fill='#f2ede2' stroke='#d9cfb8' stroke-width='1.5' opacity='1'/><circle cx='52' cy='78' r='16' fill='#5b6a4a'/><text x='52' y='84' font-size='17' text-anchor='middle' font-weight='bold' fill='#fff' font-family='Helvetica,Arial,sans-serif'>1</text><text x='82' y='85' font-size='19' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Wipe the wall with rubbing alcohol; let it dry</text><rect x='20' y='114' width='660' height='50' rx='8' fill='#f2ede2' stroke='#d9cfb8' stroke-width='1.5' opacity='1'/><circle cx='52' cy='140' r='16' fill='#5b6a4a'/><text x='52' y='146' font-size='17' text-anchor='middle' font-weight='bold' fill='#fff' font-family='Helvetica,Arial,sans-serif'>2</text><text x='82' y='147' font-size='19' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Press the strip on the wall for 30 seconds</text><rect x='20' y='176' width='660' height='50' rx='8' fill='#f2ede2' stroke='#d9cfb8' stroke-width='1.5' opacity='1'/><circle cx='52' cy='202' r='16' fill='#5b6a4a'/><text x='52' y='208' font-size='17' text-anchor='middle' font-weight='bold' fill='#fff' font-family='Helvetica,Arial,sans-serif'>3</text><text x='82' y='209' font-size='19' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Press the hook onto the strip for 30 seconds</text><rect x='20' y='238' width='660' height='50' rx='8' fill='#f2ede2' stroke='#d9cfb8' stroke-width='1.5' opacity='1'/><circle cx='52' cy='264' r='16' fill='#5b6a4a'/><text x='52' y='270' font-size='17' text-anchor='middle' font-weight='bold' fill='#fff' font-family='Helvetica,Arial,sans-serif'>4</text><text x='82' y='271' font-size='19' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Wait 1 hour before hanging anything</text><rect x='20' y='300' width='660' height='50' rx='8' fill='#f2ede2' stroke='#d9cfb8' stroke-width='1.5' opacity='1'/><circle cx='52' cy='326' r='16' fill='#5b6a4a'/><text x='52' y='332' font-size='17' text-anchor='middle' font-weight='bold' fill='#fff' font-family='Helvetica,Arial,sans-serif'>5</text><text x='82' y='333' font-size='19' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Start light; stay within the package rating</text><rect x='20' y='398' width='660' height='118' rx='8' fill='#dbe6cf' stroke='#5b6a4a' stroke-width='2' opacity='1'/><text x='36' y='430' font-size='20' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>To remove</text><text x='36' y='458' font-size='18' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Hold the hook, pull the strip straight down, slowly,</text><text x='36' y='482' font-size='18' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>stretching it at least 12 in. Never pull toward you.</text><text x='20' y='545' font-size='15' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Based on Command's archived instructions (2026). Your package comes first.</text></svg>