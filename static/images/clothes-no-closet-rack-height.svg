<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 430' role='img' aria-labelledby='t d'><title id='t'>Garment lengths against a 58 inch rod height</title><desc id='d'>Vertical bars hang from a rod 58 inches above the floor. Shirts, jackets, folded slacks, skirts and hung slacks clear the floor; a 66 inch dress or coat reaches the floor and is 8 inches too long.</desc><rect x='0' y='0' width='700' height='430' rx='0' fill='#fbf9f4' stroke='none' stroke-width='1'/><text x='20' y='30' font-size='19' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>What a 60 in rack can hang</text><text x='20' y='54' font-size='13' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Longest length in each range, hanger included; rod assumed 58 in above the floor</text><line x1='40' y1='104' x2='660' y2='104' stroke='#2f3a2f' stroke-width='5'/><line x1='30' y1='336' x2='670' y2='336' stroke='#2f3a2f' stroke-width='2'/><text x='668' y='330' font-size='12' text-anchor='end' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Floor</text><rect x='60' y='104' width='40' height='160' rx='2' fill='#5b6a4a' stroke='none' stroke-width='1'/><text x='80' y='388' font-size='11' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Shirt</text><text x='80' y='402' font-size='11' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>40 in</text><text x='80' y='416' font-size='11' text-anchor='middle' font-weight='bold' fill='#5b6a4a' font-family='Helvetica,Arial,sans-serif'>18 in clear</text><rect x='160' y='104' width='40' height='176' rx='2' fill='#5b6a4a' stroke='none' stroke-width='1'/><text x='180' y='388' font-size='11' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Jacket</text><text x='180' y='402' font-size='11' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>44 in</text><text x='180' y='416' font-size='11' text-anchor='middle' font-weight='bold' fill='#5b6a4a' font-family='Helvetica,Arial,sans-serif'>14 in clear</text><rect x='260' y='104' width='40' height='128' rx='2' fill='#5b6a4a' stroke='none' stroke-width='1'/><text x='280' y='388' font-size='11' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Slacks, folded</text><text x='280' y='402' font-size='11' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>32 in</text><text x='280' y='416' font-size='11' text-anchor='middle' font-weight='bold' fill='#5b6a4a' font-family='Helvetica,Arial,sans-serif'>26 in clear</text><rect x='360' y='104' width='40' height='176' rx='2' fill='#5b6a4a' stroke='none' stroke-width='1'/><text x='380' y='388' font-size='11' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Skirt</text><text x='380' y='402' font-size='11' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>44 in</text><text x='380' y='416' font-size='11' text-anchor='middle' font-weight='bold' fill='#5b6a4a' font-family='Helvetica,Arial,sans-serif'>14 in clear</text><rect x='460' y='104' width='40' height='208' rx='2' fill='#5b6a4a' stroke='none' stroke-width='1'/><text x='480' y='388' font-size='11' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Slacks, hung</text><text x='480' y='402' font-size='11' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>52 in</text><text x='480' y='416' font-size='11' text-anchor='middle' font-weight='bold' fill='#5b6a4a' font-family='Helvetica,Arial,sans-serif'>6 in clear</text><rect x='560' y='104' width='40' height='264' rx='2' fill='#b5523b' stroke='none' stroke-width='1'/><text x='580' y='388' font-size='11' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Dress or coat</text><text x='580' y='402' font-size='11' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>66 in</text><text x='580' y='416' font-size='11' text-anchor='middle' font-weight='bold' fill='#b5523b' font-family='Helvetica,Arial,sans-serif'>8 in over</text></svg>
