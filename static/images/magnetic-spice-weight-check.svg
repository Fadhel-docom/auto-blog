<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 440' role='img' aria-labelledby='t d'><title id='t'>Rack load compared with rating</title><desc id='d'>Three horizontal bars: an example rack rating of 2 kilograms, 12 filled tins at 0.72 kilograms and 24 filled tins at 1.44 kilograms, with a dashed margin line below the rating.</desc><rect width='700' height='440' fill='#fbf9f4'/><text x='20' y='30' font-size='21' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Weight check (planning example)</text><text x='60' y='80' font-size='19' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Rack rating (example): 2.0 kg</text><rect x='60' y='94' width='400.0' height='36' rx='4' fill='#b7c2a6' stroke='#5b6a4a' stroke-width='2' opacity='1' /><text x='60' y='170' font-size='19' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>12 filled tins at 60 g: 0.72 kg</text><rect x='60' y='184' width='144.0' height='36' rx='4' fill='#8f9a7a' stroke='#5b6a4a' stroke-width='2' opacity='1' /><text x='60' y='260' font-size='19' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>24 filled tins at 60 g: 1.44 kg</text><rect x='60' y='274' width='288.0' height='36' rx='4' fill='#e9d29b' stroke='#5b6a4a' stroke-width='2' opacity='1' /><line x1='360.0' y1='70' x2='360.0' y2='330' stroke='#c0563f' stroke-width='3' stroke-dasharray='8 6'/><text x='360.0' y='352' font-size='17' text-anchor='middle' font-weight='bold' fill='#c0563f' font-family='Helvetica,Arial,sans-serif'>Keep a margin below the rating</text><text x='20' y='400' font-size='15' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Weigh one filled tin, multiply by the count, and compare with</text><text x='20' y='420' font-size='15' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>your own rack's stated limit. Numbers above are examples.</text></svg>