<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="t d">
<title id="t">Handled bins in a tight corner cabinet</title><desc id="d">Front-view sketch of a corner cabinet with three handled bins by category, heavy pans low and a 2 inch spare between an 8 inch bin and a 10 inch opening.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#37443b"/></marker></defs>
<rect width="1000" height="520" fill="#fff"/>
<text x="500" y="38" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#37443b">Fallback for a tight opening: one category per handled bin</text>
<rect x="120" y="70" width="520" height="360" rx="0" fill="#f8f5ee" stroke="#37443b" stroke-width="4"/>
<rect x="150" y="100" width="460" height="300" rx="0" fill="#fff" stroke="#8c9a8c" stroke-width="2"/>
<rect x="180" y="300" width="200" height="80" rx="6" fill="#cfd8c9" stroke="#4d6b55" stroke-width="2"/>
<text x="280" y="336" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#37443b">Bin 1, low</text>
<text x="280" y="360" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#37443b">heavy pans</text>
<rect x="180" y="200" width="200" height="80" rx="6" fill="#e6e1d6" stroke="#4d6b55" stroke-width="2"/>
<text x="280" y="236" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#37443b">Bin 2, middle</text>
<text x="280" y="260" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#37443b">mixing bowls</text>
<rect x="180" y="110" width="200" height="70" rx="6" fill="#f1ece0" stroke="#4d6b55" stroke-width="2"/>
<text x="280" y="142" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#37443b">Back: occasional</text>
<text x="280" y="164" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#37443b">deepest area</text>
<line x1="400" y1="340" x2="640" y2="340" stroke="#4d6b55" stroke-width="3" marker-end="url(#a)"/>
<text x="520" y="328" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#4d6b55">slides out</text>
<text x="690" y="120" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#37443b">Fit check</text>
<text x="690" y="160" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#37443b">Opening: 10 in (25 cm)</text>
<text x="690" y="198" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#37443b">Bin width: 8 in (20 cm)</text>
<text x="690" y="236" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#37443b">Spare to pass: 10 - 8 = 2 in</text>
<text x="690" y="274" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#37443b">Loaded bin you can lift: yes/no</text>
<text x="690" y="312" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#37443b">No sliding? Split the category</text>
<text x="500" y="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#58655b">Front-view sketch with example numbers. Do not cut a frame or alter hinges to force a product to fit.</text>

</svg>
