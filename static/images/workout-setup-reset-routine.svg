<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 330' role='img' aria-labelledby='t d'><title id='t'>Two-minute setup and reset routine</title><desc id='d'>Two rows of four steps. Setup: mat from the basket, bands from the rack, weights from the low shelf, start with a clear floor. Reset: weights back to the low shelf first, bands one per hook, dry the mat then roll it, check the floor.</desc><rect x='0' y='0' width='700' height='330' rx='0' fill='#fbf9f4' stroke='none' stroke-width='1'/><text x='20' y='30' font-size='19' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>A two-minute setup and reset</text><text x='16' y='62' font-size='14' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Setup</text><rect x='16' y='72' width='140' height='76' rx='6' fill='#f4f7ee' stroke='#5b6a4a' stroke-width='1.5'/><text x='86' y='104' font-size='15' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>1 Mat</text><text x='86' y='126' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>from the basket</text><rect x='192' y='72' width='140' height='76' rx='6' fill='#f4f7ee' stroke='#5b6a4a' stroke-width='1.5'/><text x='262' y='104' font-size='15' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>2 Bands</text><text x='262' y='126' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>from the rack</text><rect x='368' y='72' width='140' height='76' rx='6' fill='#f4f7ee' stroke='#5b6a4a' stroke-width='1.5'/><text x='438' y='104' font-size='15' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>3 Weights</text><text x='438' y='126' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>from the low shelf</text><rect x='544' y='72' width='140' height='76' rx='6' fill='#f4f7ee' stroke='#5b6a4a' stroke-width='1.5'/><text x='614' y='104' font-size='15' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>4 Start</text><text x='614' y='126' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>clear floor</text><line x1='162' y1='110' x2='186' y2='110' stroke='#5b6a4a' stroke-width='2'/><polygon points='186,104 192,110 186,116' fill='#5b6a4a'/><line x1='338' y1='110' x2='362' y2='110' stroke='#5b6a4a' stroke-width='2'/><polygon points='362,104 368,110 362,116' fill='#5b6a4a'/><line x1='514' y1='110' x2='538' y2='110' stroke='#5b6a4a' stroke-width='2'/><polygon points='538,104 544,110 538,116' fill='#5b6a4a'/><text x='16' y='186' font-size='14' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Reset</text><rect x='16' y='196' width='140' height='76' rx='6' fill='#f3e9d4' stroke='#5b6a4a' stroke-width='1.5'/><text x='86' y='228' font-size='15' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>1 Weights</text><text x='86' y='250' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>to the low shelf</text><rect x='192' y='196' width='140' height='76' rx='6' fill='#f3e9d4' stroke='#5b6a4a' stroke-width='1.5'/><text x='262' y='228' font-size='15' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>2 Bands</text><text x='262' y='250' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>one per hook</text><rect x='368' y='196' width='140' height='76' rx='6' fill='#f3e9d4' stroke='#5b6a4a' stroke-width='1.5'/><text x='438' y='228' font-size='15' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>3 Mat</text><text x='438' y='250' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>dry it, then roll</text><rect x='544' y='196' width='140' height='76' rx='6' fill='#f3e9d4' stroke='#5b6a4a' stroke-width='1.5'/><text x='614' y='228' font-size='15' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>4 Look</text><text x='614' y='250' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>floor clear?</text><line x1='162' y1='234' x2='186' y2='234' stroke='#5b6a4a' stroke-width='2'/><polygon points='186,228 192,234 186,240' fill='#5b6a4a'/><line x1='338' y1='234' x2='362' y2='234' stroke='#5b6a4a' stroke-width='2'/><polygon points='362,228 368,234 362,240' fill='#5b6a4a'/><line x1='514' y1='234' x2='538' y2='234' stroke='#5b6a4a' stroke-width='2'/><polygon points='538,228 544,234 538,240' fill='#5b6a4a'/><text x='20' y='310' font-size='13' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>If the reset takes much longer than two minutes, move the daily gear closer.</text></svg>