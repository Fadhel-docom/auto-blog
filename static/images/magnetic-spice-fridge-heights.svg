<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 480' role='img' aria-labelledby='t d'><title id='t'>Spice rows by reach height</title><desc id='d'>Side view of a refrigerator with two rows of magnetic spice tins: a weekly row above 48 inches and a daily row between 15 and 48 inches, with the area below 15 inches left empty.</desc><rect width='700' height='480' fill='#fbf9f4'/><text x='20' y='30' font-size='21' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Spice rows on a fridge side (example heights)</text><rect x='10' y='352.5' width='680' height='67.5' rx='0' fill='#ecdcc3' stroke='none' stroke-width='1' opacity='1' /><rect x='10' y='204.0' width='680' height='148.5' rx='0' fill='#dbe6cf' stroke='none' stroke-width='1' opacity='1' /><rect x='10' y='105.0' width='680' height='99.0' rx='0' fill='#efe9dd' stroke='none' stroke-width='1' opacity='1' /><line x1='10' y1='352.5' x2='690' y2='352.5' stroke='#8a6a3b' stroke-width='1.5' stroke-dasharray='6 5'/><text x='30' y='346.5' font-size='15' text-anchor='start' font-weight='bold' fill='#8a6a3b' font-family='Helvetica,Arial,sans-serif'>15 in</text><line x1='10' y1='204.0' x2='690' y2='204.0' stroke='#8a6a3b' stroke-width='1.5' stroke-dasharray='6 5'/><text x='30' y='198.0' font-size='15' text-anchor='start' font-weight='bold' fill='#8a6a3b' font-family='Helvetica,Arial,sans-serif'>48 in</text><rect x='90' y='105.0' width='130' height='315.0' rx='4' fill='#e4e4e4' stroke='#7a7a7a' stroke-width='3' opacity='1' /><circle cx='112' cy='155.0' r='16' fill='#d8d2c4'/><circle cx='152' cy='155.0' r='16' fill='#d8d2c4'/><circle cx='192' cy='155.0' r='16' fill='#d8d2c4'/><rect x='98' y='169.0' width='118' height='6' rx='2' fill='#9a9a9a' stroke='none' stroke-width='1' opacity='1' /><circle cx='112' cy='236.0' r='16' fill='#d8d2c4'/><circle cx='152' cy='236.0' r='16' fill='#d8d2c4'/><circle cx='192' cy='236.0' r='16' fill='#d8d2c4'/><rect x='98' y='250.0' width='118' height='6' rx='2' fill='#9a9a9a' stroke='none' stroke-width='1' opacity='1' /><text x='250' y='135.0' font-size='21' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Above 48 in</text><text x='250' y='161.0' font-size='18' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Second row: weekly spices</text><text x='250' y='238.0' font-size='21' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>15 to 48 in</text><text x='250' y='264.0' font-size='18' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Daily row: the spices you grab</text><text x='250' y='288.0' font-size='16' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>most (ADA reach range as a guide)</text><text x='250' y='382.5' font-size='21' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Below 15 in</text><text x='250' y='406.5' font-size='18' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Leave empty: hard to reach</text><text x='20' y='460' font-size='15' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Heights are planning examples. Measure your own fridge.</text></svg>