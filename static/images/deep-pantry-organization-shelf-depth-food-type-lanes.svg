<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="t d">
<title id="t">Pantry lane arithmetic</title><desc id="d">Top view of a 30 inch wide shelf divided into three 10 inch lanes, each holding 3 cans across and 2 cans deep, 6 cans per layer in an example.</desc>
