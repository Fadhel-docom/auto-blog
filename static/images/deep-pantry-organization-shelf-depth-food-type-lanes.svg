<text x="360" y="466" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#58655b">lane 2</text>
<rect x="466" y="274" width="188" height="160" rx="6" fill="#e6e1d6" stroke="#4d6b55" stroke-width="2"/>
