<text x="560" y="466" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#58655b">lane 3</text>
<text x="360.0" y="66" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#37443b">30 in (76 cm) wide</text>
<text x="720" y="150" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#37443b">Can lane arithmetic</text>
<text x="690" y="190" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#37443b">Lane: 10 in wide x 8 in deep</text>
<text x="690" y="222" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#37443b">Can diameter: 3 in</text>
<text x="690" y="254" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#37443b">Across: 3 cans (9 in)</text>
<text x="690" y="286" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#37443b">Deep: 2 cans (6 in)</text>
<text x="690" y="318" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#37443b">Per layer: 3 x 2 = 6 cans</text>
<text x="690" y="350" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#37443b">Two layers: 12 cans per lane</text>
<text x="500" y="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#58655b">Illustrative numbers. Weigh a full bin; keep dense cans on a lower shelf.</text>

