mily="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#55696a">the dishwasher.</text><text x="650.0" y="356.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#55696a"></text><text x="650.0" y="376.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#55696a">Sizes are a planning</text><text x="650.0" y="396.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#55696a">example.</text></svg>