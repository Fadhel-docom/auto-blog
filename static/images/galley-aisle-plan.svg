<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d"><title id="t">A narrow galley kitchen, to scale</title><desc id="d">Top view of a galley kitchen with two 24 inch deep cabinet runs and a 48 inch work aisle between them, with the sink, dishwasher, range, refrigerator and the spice pull-out cabinet marked.</desc><rect width="800" height="560" fill="#faf6ef"/><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5522f"/></marker></defs><text x="400.0" y="36.0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#23363a">A narrow galley kitchen, to scale</text><text x="400.0" y="60.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#55696a">Planning example: 120 in long, 96 in wall to wall, with a 48 in work aisle</text><rect x="40" y="100" width="540.0" height="432.0" fill="#fff" stroke="#23363a" stroke-width="3"/><rect x="40.0" y="100.0" width="135.0" height="108.0" rx="3" fill="#dbe9e4" stroke="#2f6f62" stroke-width="1.5"/><text x="107.5" y="158.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#23363a">Fridge</text><rect x="175.0" y="100.0" width="162.0" height="108.0" rx="3" fill="#dbe9e4" stroke="#2f6f62" stroke-width="1.5"/><text x="256.0" y="158.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#23363a">Sink (clean)</text><rect x="337.0" y="100.0" width="108.0" height="108.0" rx="3" fill="#dbe9e4" stroke="#2f6f62" stroke-width="1.5"/><text x="391.0" y="158.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#23363a">Dishwasher</text><rect x="445.0" y="100.0" width="135.0" height="108.0" rx="3" fill="#dbe9e4" stroke="#2f6f62" stroke-width="1.5"/><text x="512.5" y="158.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#23363a">Cabinet</text><rect x="40.0" y="424.0" width="162.0" height="108.0" rx="3" fill="#dbe9e4" stroke="#2f6f62" stroke-width="1.5"/><text x="121.0" y="482.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#23363a">Prep counter</text><rect x="202.0" y="424.0" width="135.0" height="108.0" rx="3" fill="#f3e3c8" stroke="#b5522f" stroke-width="1.5"/><text x="269.5" y="482.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#23363a">Range (cook)</text><rect x="337.0" y="424.0" width="54.0" height="108.0" rx="3" fill="#dbe9e4" stroke="#2f6f62" stroke-width="1.5"/><text x="364.0" y="482.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#23363a">Cab.</text><rect x="391.0" y="424.0" width="54.0" height="108.0" rx="3" fill="#e6efd2" stroke="#2f6f62" stroke-width="1.5"/><text x="418.0" y="482.0" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#23363a">Spice</text><rect x="445.0" y="424.0" width="135.0" height="108.0" rx="3" fill="#dbe9e4" stroke="#2f6f62" stroke-width="1.5"/><text x="512.5" y="482.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#23363a">Cabinet</text><rect x="40.0" y="208.0" width="540.0" height="216.0" rx="3" fill="#fbf3e4" stroke="#fbf3e4" stroke-width="0"/><text x="287.5" y="320.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#23363a">Work aisle: keep it clear</text><line x1="544.0" y1="208.0" x2="544.0" y2="424.0" stroke="#b5522f" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/><rect x="504.0" y="306.0" width="80" height="20" rx="4" fill="#faf6ef"/><text x