<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" role="img" aria-labelledby="t14 d14"><title id="t14">Drawer slide side clearance</title><desc id="d14">Front view of an under-bed drawer box between two side supports with a slide on each side. The box width equals the opening width minus the slide space on both sides.</desc><rect width="800" height="370" fill="#fbf7f1"/><rect x="60" y="40" width="680" height="300" rx="0" fill="#fffdf9" stroke="#5b4a3a" stroke-width="5"/><rect x="60" y="40" width="60" height="300" rx="0" fill="#cfe3ea" stroke="#3d6f80" stroke-width="3"/><rect x="680" y="40" width="60" height="300" rx="0" fill="#cfe3ea" stroke="#3d6f80" stroke-width="3"/><rect x="140" y="200" width="50" height="16" rx="2" fill="#9a9a9a" stroke="#555" stroke-width="2"/><rect x="610" y="200" width="50" height="16" rx="2" fill="#9a9a9a" stroke="#555" stroke-width="2"/><rect x="200" y="150" width="400" height="140" rx="4" fill="#ffffff" stroke="#2e8b57" stroke-width="3"/><text x="400" y="228" font-size="20" font-weight="bold" fill="#256b43" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Drawer box</text><text x="165" y="190" font-size="15" font-weight="bold" fill="#444" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">slide</text><text x="635" y="190" font-size="15" font-weight="bold" fill="#444" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">slide</text><text x="400" y="80" font-size="18" font-weight="bold" fill="#3b2f23" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Opening width between supports</text><line x1="120" y1="96" x2="680" y2="96" stroke="#c0392b" stroke-width="3"/><text x="400" y="320" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Box width = opening minus slide space on both sides (see the data sheet)</text></svg>