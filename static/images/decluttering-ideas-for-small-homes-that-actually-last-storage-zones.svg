<svg xmlns="http://www.w3.org/2000/svg" width="700" height="427" viewBox="0 0 700 427" role="img" aria-labelledby="title desc">
<title id="title">Zone-first storage map</title>
<desc id="desc">A practical map placing frequent-use household items near the point where they are used.</desc>
<defs>
<style>.c0{font:700 26px DejaVu Sans, Helvetica, Arial, sans-serif;fill:#1F3A34} .c1{font:20px DejaVu Sans, Helvetica, Arial, sans-serif;fill:#5E6B66} .c2{font:700 20px DejaVu Sans, Helvetica, Arial, sans-serif;fill:#F6F1E8} .c3{font:700 21px DejaVu Sans, Helvetica, Arial, sans-serif;fill:#1F3A34}</style>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2F7F79"/></marker>
</defs>
<rect width="700" height="427" rx="24" fill="#F6F1E8"/>
<text x="40" y="48" class="c0">Store by point of use</text>
<text x="40" y="78" class="c1">Frequent-use items should be quick to put away.</text>
<rect x="40" y="110" width="196" height="130" rx="18" fill="#E6EEF2"/>
<circle cx="74" cy="146" r="21" fill="#2F7F79"/>
<text x="74" y="153" class="c2" text-anchor="middle">1</text>
<text x="104" y="153" class="c3">ENTRY</text>
<text x="60" y="196" class="c1">keys</text>
<text x="60" y="224" class="c1">everyday bags</text>
<rect x="252" y="110" width="196" height="130" rx="18" fill="#DCEBDD"/>
<circle cx="286" cy="146" r="21" fill="#C4622D"/>
<text x="286" y="153" class="c2" text-anchor="middle">2</text>
<text x="316" y="153" class="c3">KITCHEN</text>
<text x="272" y="196" class="c1">daily tools</text>
<text x="272" y="224" class="c1">food containers</text>
<rect x="464" y="110" width="196" height="130" rx="18" fill="#F3E3D3"/>
<circle cx="498" cy="146" r="21" fill="#2F7F79"/>
<text x="498" y="153" class="c2" text-anchor="middle">3</text>
<text x="528" y="153" class="c3">BEDROOM</text>
<text x="484" y="196" class="c1">daily clothing</text>
<text x="484" y="224" class="c1">chargers</text>
<path d="M350 242 L350 272" stroke="#2F7F79" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="40" y="280" width="620" height="117" rx="18" fill="#E6EEF2"/>
<text x="350" y="318" class="c3" text-anchor="middle">Test the storage location</text>
<text x="70" y="350" class="c1">If the same item keeps moving, move its home closer</text>
<text x="70" y="376" class="c1">to the routine that uses it.</text>
</svg>