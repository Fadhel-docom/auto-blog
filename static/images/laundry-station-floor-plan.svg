<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 450' role='img' aria-labelledby='t d'><title id='t'>Laundry station floor plan</title><desc id='d'>Top view of a small room: a 30 by 48 inch clear floor space beside a folding drying rack and a rolling cart along one wall, separated from a 36 inch wide walkway.</desc><rect x='0' y='0' width='700' height='450' rx='0' fill='#fbf9f4' stroke='none' stroke-width='1'/><text x='20' y='30' font-size='19' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Laundry station plan: floor space and walkway (top view, example)</text><rect x='40' y='60' width='620' height='330' rx='0' fill='#f6f2e8' stroke='#b8ad92' stroke-width='1'/><rect x='300' y='54' width='200' height='12' rx='0' fill='#cfe3f0' stroke='#6b8fa8' stroke-width='1'/><text x='400' y='48' font-size='12' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Window wall</text><rect x='110' y='100' width='150' height='240' rx='0' fill='#dbe6cf' stroke='#5b6a4a' stroke-width='2' stroke-dasharray='6 4'/><text x='185' y='205' font-size='14' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Clear floor space</text><text x='185' y='226' font-size='14' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>30 x 48 in</text><rect x='44' y='100' width='60' height='150' rx='0' fill='#e6d3a8' stroke='#8a6a3b' stroke-width='1'/><text x='74' y='168' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Rack</text><text x='74' y='186' font-size='12' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>(open)</text><rect x='44' y='270' width='60' height='70' rx='0' fill='#ffffff' stroke='#6b6b6b' stroke-width='1'/><text x='74' y='310' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Cart</text><rect x='290' y='100' width='180' height='240' rx='0' fill='#f3e9d2' stroke='#c9a56e' stroke-width='2' stroke-dasharray='6 4'/><text x='380' y='205' font-size='14' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Walkway</text><text x='380' y='226' font-size='14' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>36 in clear width</text><line x1='110' y1='362' x2='260' y2='362' stroke='#5b6a4a' stroke-width='2'/><text x='185' y='382' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>30 in</text><line x1='290' y1='362' x2='470' y2='362' stroke='#5b6a4a' stroke-width='2'/><text x='380' y='382' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>36 in</text><text x='20' y='430' font-size='13' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Keep the station beside the walkway, never inside it. Furniture is schematic.</text></svg>