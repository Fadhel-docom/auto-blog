<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t d"><title id="t">Clearances from wall to wall in a small living room</title><desc id="d">A side-by-side strip showing a wall, then 3 to 5 inches behind the sofa, the sofa, 14 to 18 inches to the coffee table, the coffee table, 30 to 36 inches of walkway and a media console.</desc><rect width="800" height="380" fill="#faf6ef"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f62"/></marker></defs><text x="400" y="34" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#23363a">The numbers to check between pieces</text><text x="400" y="58" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#55696a">Top-down strip across one room. Not to scale. Measure your own room at its narrowest point.</text><rect x="30" y="110" width="12" height="120" fill="#23363a"/><text x="36" y="244" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#23363a">Wall</text><rect x="70" y="130" width="150" height="80" rx="6" fill="#e6efd2" stroke="#23363a" stroke-width="2"/><text x="145.0" y="175.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#23363a">Sofa</text><rect x="290" y="130" width="95" height="80" rx="6" fill="#f6e6b8" stroke="#23363a" stroke-width="2"/><text x="337.5" y="175.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#23363a">Coffee table</text><rect x="590" y="130" width="130" height="80" rx="6" fill="#e6efd2" stroke="#23363a" stroke-width="2"/><text x="655.0" y="175.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#23363a">Media console</text><line x1="42" y1="100" x2="70" y2="100" stroke="#b5522f" stroke-width="3"/><line x1="42" y1="92" x2="42" y2="108" stroke="#b5522f" stroke-width="2"/><line x1="70" y1="92" x2="70" y2="108" stroke="#b5522f" stroke-width="2"/><text x="56.0" y="84" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#b5522f">3–5 in</text><text x="56.0" y="268" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Behind the sofa</text><line x1="220" y1="100" x2="290" y2="100" stroke="#2f6f62" stroke-width="3"/><line x1="220" y1="92" x2="220" y2="108" stroke="#2f6f62" stroke-width="2"/><line x1="290" y1="92" x2="290" y2="108" stroke="#2f6f62" stroke-width="2"/><text x="255.0" y="84" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#2f6f62">14–18 in</text><text x="255.0" y="268" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Sofa to table</text><line x1="385" y1="100" x2="590" y2="100" stroke="#2f6f62" stroke-width="3"/><line x1="385" y1="92" x2="385" y2="108" stroke="#2f6f62" stroke-width="2"/><line x1="590" y1="92" x2="590" y2="108" stroke="#2f6f62" stroke-width="2"/><text x="487.5" y="84" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#2f6f62">30–36 in</text><text x="487.5" y="268" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Walkway between large pieces</text><line x1="750" y1="110" x2="750" y2="230" stroke="#23363a" stroke-width="12"/><text x="750" y="244" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#23363a">Wall</text><rect x="60" y="290" width="680" height="62" rx="10" fill="#fff" stroke="#23363a" stroke-width="2"/><text x="400" y="316" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#23363a">Tight room? 24 in is only a designer rule of thumb, not a safety limit.</text><text x="400" y="336" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Measure from furniture edge to furniture edge, including arms, corners and open doors.</text></svg>