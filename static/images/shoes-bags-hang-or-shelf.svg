<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d"><title id="t">Hook or shelf for each bag</title><desc id="d">A four-row guide matching sturdy wide-strap bags to hooks, structured leather handbags and thin-strap crossbody bags to shelves and rarely used bags to lidded boxes.</desc><rect width="800" height="560" fill="#faf6ef"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f62"/></marker></defs><text x="400" y="36" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#23363a">Hook or shelf for each bag</text><text x="400" y="60" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#55696a">Where each kind of bag lives</text><rect x="30" y="95" width="330" height="80" rx="8" fill="#fff" stroke="#23363a" stroke-width="2"/><text x="195" y="129" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#23363a">Backpack or canvas tote with</text><text x="195" y="149" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#23363a">wide straps</text><line x1="366" y1="135" x2="430" y2="135" stroke="#2f6f62" stroke-width="3" marker-end="url(#a)"/><rect x="436" y="95" width="334" height="80" rx="8" fill="#e6efd2" stroke="#2f6f62" stroke-width="2"/><text x="603" y="141" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#23363a">Hook in the daily half</text><rect x="30" y="200" width="330" height="80" rx="8" fill="#fff" stroke="#23363a" stroke-width="2"/><text x="195" y="246" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#23363a">Structured leather handbag</text><line x1="366" y1="240" x2="430" y2="240" stroke="#23363a" stroke-width="3" marker-end="url(#a)"/><rect x="436" y="200" width="334" height="80" rx="8" fill="#f3e3c8" stroke="#23363a" stroke-width="2"/><text x="603" y="234" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#23363a">Shelf, upright, lightly stuffed,</text><text x="603" y="254" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#23363a">in a dust bag</text><rect x="30" y="305" width="330" height="80" rx="8" fill="#fff" stroke="#23363a" stroke-width="2"/><text x="195" y="339" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#23363a">Crossbody bag with a thin</text><text x="195" y="359" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#23363a">strap</text><line x1="366" y1="345" x2="430" y2="345" stroke="#23363a" stroke-width="3" marker-end="url(#a)"/><rect x="436" y="305" width="334" height="80" rx="8" fill="#f3e3c8" stroke="#23363a" stroke-width="2"/><text x="603" y="351" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#23363a">Shelf, strap tucked inside</text><rect x="30" y="410" width="330" height="80" rx="8" fill="#fff" stroke="#23363a" stroke-width="2"/><text x="195" y="456" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#23363a">Out of season or rarely used</text><line x1="366" y1="450" x2="430" y2="450" stroke="#2f6f62" stroke-width="3" marker-end="url(#a)"/><rect x="436" y="410" width="334" height="80" rx="8" fill="#e6efd2" stroke="#2f6f62" stroke-width="2"/><text x="603" y="444" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#23363a">Lidded fabric box on the top</text><text x="603" y="464" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#23363a">shelf</text><text x="400" y="530" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#23363a">Hang only what you use every week</text></svg>