<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 430' role='img' aria-labelledby='t d'><title id='t'>Cleaning supply storage levels</title><desc id='d'>Three rows matching household types to storage: adults only use a closed cabinet or cart with original containers; homes with children or pets use a locked cabinet with only cloths on the cart; homes with toddlers or chewing pets add a lock and keep nothing hazardous on open shelves.</desc><rect x='0' y='0' width='700' height='430' rx='0' fill='#fbf9f4' stroke='none' stroke-width='1'/><text x='20' y='30' font-size='19' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Pick the storage level by who lives in the home</text><rect x='30' y='60' width='230' height='80' rx='8' fill='#dbe6cf' stroke='#5b6a4a' stroke-width='2'/><text x='145' y='107' font-size='15' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Adults only</text><line x1='262' y1='100' x2='318' y2='100' stroke='#6b6b6b' stroke-width='3'/><text x='300' y='94' font-size='16' text-anchor='middle' font-weight='normal' fill='#6b6b6b' font-family='Helvetica,Arial,sans-serif'>></text><rect x='330' y='60' width='340' height='80' rx='8' fill='#ffffff' stroke='#5b6a4a' stroke-width='2'/><text x='350' y='94' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Closed cabinet or cart,</text><text x='350' y='116' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>original containers, lids on</text><rect x='30' y='170' width='230' height='80' rx='8' fill='#f1e3a6' stroke='#b59a3b' stroke-width='2'/><text x='145' y='217' font-size='15' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Children or pets at home</text><line x1='262' y1='210' x2='318' y2='210' stroke='#6b6b6b' stroke-width='3'/><text x='300' y='204' font-size='16' text-anchor='middle' font-weight='normal' fill='#6b6b6b' font-family='Helvetica,Arial,sans-serif'>></text><rect x='330' y='170' width='340' height='80' rx='8' fill='#ffffff' stroke='#b59a3b' stroke-width='2'/><text x='350' y='204' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Locked cabinet: products live</text><text x='350' y='226' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>only inside, cart holds cloths</text><rect x='30' y='280' width='230' height='80' rx='8' fill='#e8b4a8' stroke='#a8584a' stroke-width='2'/><text x='145' y='327' font-size='15' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Toddlers or chewing pets</text><line x1='262' y1='320' x2='318' y2='320' stroke='#6b6b6b' stroke-width='3'/><text x='300' y='314' font-size='16' text-anchor='middle' font-weight='normal' fill='#6b6b6b' font-family='Helvetica,Arial,sans-serif'>></text><rect x='330' y='280' width='340' height='80' rx='8' fill='#ffffff' stroke='#a8584a' stroke-width='2'/><text x='350' y='314' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Lock on the cabinet door and</text><text x='350' y='336' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>nothing hazardous on open shelves</text><text x='20' y='400' font-size='13' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Rule from Poison Help: locked cabinets or out of reach of children, in original containers.</text></svg>