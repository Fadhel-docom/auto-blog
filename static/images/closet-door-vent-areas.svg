<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 432' role='img' aria-labelledby='t d'><title id='t'>Closet door vent openings for a dryer</title><desc id='d'>A louvered closet door with an upper vent opening of at least 48 square inches no lower than 6 feet above the floor and a lower vent opening of at least 24 square inches within 1 foot of the floor, plus the GE figures of 60 and 120 square inches.</desc><rect x='0' y='0' width='700' height='432' rx='0' fill='#fbf9f4' stroke='none' stroke-width='1'/><text x='20' y='30' font-size='19' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Closet door vents: count the open area</text><rect x='60' y='60' width='210' height='310' rx='0' fill='#ffffff' stroke='#5b6a4a' stroke-width='2'/><rect x='75' y='78' width='180' height='82' rx='0' fill='#f1e3a6' stroke='#b8ad92' stroke-width='1'/><rect x='75' y='298' width='180' height='56' rx='0' fill='#bfd9b0' stroke='#b8ad92' stroke-width='1'/><line x1='85' y1='86' x2='245' y2='86' stroke='#b8ad92' stroke-width='2'/><line x1='85' y1='96' x2='245' y2='96' stroke='#b8ad92' stroke-width='2'/><line x1='85' y1='106' x2='245' y2='106' stroke='#b8ad92' stroke-width='2'/><line x1='85' y1='116' x2='245' y2='116' stroke='#b8ad92' stroke-width='2'/><line x1='85' y1='126' x2='245' y2='126' stroke='#b8ad92' stroke-width='2'/><line x1='85' y1='136' x2='245' y2='136' stroke='#b8ad92' stroke-width='2'/><line x1='85' y1='146' x2='245' y2='146' stroke='#b8ad92' stroke-width='2'/><line x1='85' y1='156' x2='245' y2='156' stroke='#b8ad92' stroke-width='2'/><line x1='85' y1='304' x2='245' y2='304' stroke='#b8ad92' stroke-width='2'/><line x1='85' y1='314' x2='245' y2='314' stroke='#b8ad92' stroke-width='2'/><line x1='85' y1='324' x2='245' y2='324' stroke='#b8ad92' stroke-width='2'/><line x1='85' y1='334' x2='245' y2='334' stroke='#b8ad92' stroke-width='2'/><line x1='85' y1='344' x2='245' y2='344' stroke='#b8ad92' stroke-width='2'/><line x1='60' y1='370' x2='270' y2='370' stroke='#2f3a2f' stroke-width='2'/><text x='165' y='392' font-size='12' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Floor</text><line x1='255' y1='119' x2='300' y2='119' stroke='#5b6a4a' stroke-width='1.5'/><text x='310' y='112' font-size='15' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Upper vent: at least 48 sq in</text><text x='310' y='132' font-size='13' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>no lower than 6 ft above the floor (LG)</text><line x1='255' y1='326' x2='300' y2='326' stroke='#5b6a4a' stroke-width='1.5'/><text x='310' y='319' font-size='15' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Lower vent: at least 24 sq in</text><text x='310' y='339' font-size='13' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>no more than 1 ft above the floor (LG)</text><rect x='290' y='170' width='390' height='110' rx='0' fill='#ffffff' stroke='#b8ad92' stroke-width='1'/><text x='306' y='198' font-size='14' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>GE spec sheet, dryer closet: 60 sq in open area</text><text x='306' y='220' font-size='14' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>120 sq in if the washer shares the closet</text><text x='306' y='248' font-size='13' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Count the gaps between the slats, not the panel.</text><text x='20' y='418' font-size='12' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>LG figures: compact heat pump dryer manual. GE figures: matching dryer. Check your own manual.</text></svg>