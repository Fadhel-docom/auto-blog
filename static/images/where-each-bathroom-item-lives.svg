<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" role="img" aria-labelledby="t3 d3" font-family="Arial, Helvetica, sans-serif">
<title id="t3">Where each bathroom item lives</title>
<desc id="d3">A four-question path: used by everyone at the sink most mornings goes beside the tap; personal daily items go in a caddy or on a hook; medicines and cleaning products go out of the damp zone, latched or closed; spares go in a shared bin or outside the room.</desc>
<rect width="800" height="490" fill="#fbf8f3"/>
<text x="400" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#2d2a26">Where does this item live?</text>
<g fill="#dcefd9" stroke="#3f7d3a" stroke-width="2">
<rect x="40" y="56" width="400" height="64" rx="8"/><rect x="40" y="150" width="400" height="64" rx="8"/><rect x="40" y="244" width="400" height="64" rx="8"/><rect x="40" y="338" width="400" height="64" rx="8"/></g>
<g fill="#f6e4c8" stroke="#a8721b" stroke-width="2">
<rect x="490" y="56" width="280" height="64" rx="8"/><rect x="490" y="150" width="280" height="64" rx="8"/><rect x="490" y="244" width="280" height="64" rx="8"/><rect x="490" y="338" width="280" height="64" rx="8"/></g>
<g font-size="15" fill="#2d2a26">
<text x="56" y="94">1. Does everyone use it at the sink most mornings?</text>
<text x="56" y="188">2. Is it personal and used every day?</text>
<text x="56" y="282">3. Is it a medicine or a cleaning product?</text>
<text x="56" y="376">4. Is it a spare, a refill or a bulk pack?</text>
<text x="506" y="94">Yes: sink-side (soap, one cup)</text>
<text x="506" y="188">Yes: personal caddy or hook</text>
<text x="506" y="282">Yes: out of the damp zone, latched</text>
<text x="506" y="376">Yes: shared bin; bulk elsewhere</text></g>
<g stroke="#2d2a26" stroke-width="2" fill="none"><line x1="240" y1="120" x2="240" y2="150"/><line x1="240" y1="214" x2="240" y2="244"/><line x1="240" y1="308" x2="240" y2="338"/><line x1="440" y1="88" x2="490" y2="88"/><line x1="440" y1="182" x2="490" y2="182"/><line x1="440" y1="276" x2="490" y2="276"/><line x1="440" y1="370" x2="490" y2="370"/></g>
<g font-size="12" fill="#2d2a26"><text x="248" y="139">No</text><text x="248" y="233">No</text><text x="248" y="327">No</text></g>
<rect x="40" y="428" width="400" height="44" rx="8" fill="#245a20"/>
<line x1="240" y1="402" x2="240" y2="428" stroke="#2d2a26" stroke-width="2"/>
<text x="240" y="456" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">No to all four: does it need to be here?</text>
</svg>
