<svg xmlns="http://www.w3.org/2000/svg" width="700" height="509" viewBox="0 0 700 509" role="img" aria-labelledby="t d"><title id="t">A rolling cart needs room to move</title><desc id="d">Top view of a stovetop on the left, a keep-clear zone in the middle and a rolling cart on the right, with notes on what can catch fire and what a cart needs.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C4622D"/></marker></defs><rect width="700" height="509" rx="24" fill="#F6F1E8"/><text x="40" y="48" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1F3A34" text-anchor="start">A rolling cart needs room to move</text><text x="40" y="78" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5E6B66" text-anchor="start">Keep it, and anything that can burn, away from the stovetop.</text><rect x="40" y="126" width="210" height="120" rx="8" fill="#D9D2C3" stroke="#1F3A34" stroke-width="3"/><circle cx="88" cy="160" r="17" fill="#5E6B66" stroke="#1F3A34" stroke-width="2"/><circle cx="202" cy="160" r="17" fill="#5E6B66" stroke="#1F3A34" stroke-width="2"/><circle cx="88" cy="212" r="17" fill="#5E6B66" stroke="#1F3A34" stroke-width="2"/><circle cx="202" cy="212" r="17" fill="#5E6B66" stroke="#1F3A34" stroke-width="2"/><text x="145" y="272" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5E6B66" text-anchor="middle">Stovetop</text><rect x="262" y="126" width="110" height="120" rx="8" fill="none" stroke="#C4622D" stroke-width="3" stroke-dasharray="8 6"/><text x="317" y="192" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#C4622D" text-anchor="middle">Keep clear</text><rect x="396" y="134" width="264" height="104" rx="8" fill="#DCEBDD" stroke="#1F3A34" stroke-width="3"/><circle cx="412" cy="146" r="7" fill="#1F3A34"/><circle cx="644" cy="146" r="7" fill="#1F3A34"/><circle cx="412" cy="226" r="7" fill="#1F3A34"/><circle cx="644" cy="226" r="7" fill="#1F3A34"/><text x="528" y="178" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F3A34" text-anchor="middle">Rolling cart</text><text x="528" y="204" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="middle">about 24 in x 15 in x 30 in</text><rect x="40" y="302" width="303" height="173" rx="16" fill="#F3E3D3"/><text x="56" y="337" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F3A34" text-anchor="start">Away from the stovetop</text><text x="56" y="363" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5E6B66" text-anchor="start">Oven mitts, wooden utensils,</text><text x="56" y="385" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5E6B66" text-anchor="start">food packaging, towels and</text><text x="56" y="407" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5E6B66" text-anchor="start">curtains can catch fire. Follow</text><text x="56" y="429" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5E6B66" text-anchor="start">your range instructions for</text><text x="56" y="451" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5E6B66" text-anchor="start">clearance.</text><rect x="357" y="302" width="303" height="173" rx="16" fill="#E6EEF2"/><text x="373" y="337" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F3A34" text-anchor="start">Cart checklist</text><text x="373" y="363" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5E6B66" text-anchor="start">Locking wheels, at least two</text><text x="373" y="385" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5E6B66" text-anchor="start">shelves and a sturdy top. Keep</text><text x="373" y="407" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5E6B66" text-anchor="start">only lightweight items on it;</text><text x="373" y="429" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5E6B66" text-anchor="start">heavy cookware stays in</text><text x="373" y="451" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5E6B66" text-anchor="start">cabinets.</text></svg>
