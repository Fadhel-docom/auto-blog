<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 416' role='img' aria-labelledby='t d'><title id='t'>Floor plan with a heavy zone, a light zone and a clear path</title><desc id='d'>Top-down plan of a living room corner: a bench for weights and a mat basket along the top wall, a band rack beside them, a clear path to an exercise spot, a sofa and a door. No measurements are assumed.</desc><rect x='0' y='0' width='700' height='416' rx='0' fill='#fbf9f4' stroke='none' stroke-width='1'/><text x='20' y='30' font-size='19' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Two zones and a clear path: a plan, not a measurement</text><rect x='20' y='50' width='660' height='330' rx='0' fill='#ffffff' stroke='#5b6a4a' stroke-width='2'/><rect x='470' y='47' width='170' height='6' rx='0' fill='#9fc3d9' stroke='none' stroke-width='1'/><text x='555' y='44' font-size='11' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Window</text><rect x='96' y='58' width='176' height='56' rx='0' fill='#f3e9d4' stroke='#b5523b' stroke-width='1.5' stroke-dasharray='5 4'/><rect x='100' y='62' width='160' height='44' rx='0' fill='#d8c3a0' stroke='#8a6d3b' stroke-width='1.5'/><circle cx='62' cy='92' r='24' fill='#cdb98f' stroke='#8a6d3b' stroke-width='1.5'/><rect x='292' y='62' width='64' height='30' rx='0' fill='#e7efdd' stroke='#5b6a4a' stroke-width='1.5'/><text x='62' y='132' font-size='12' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Mat basket</text><text x='180' y='132' font-size='12' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Bench: weights low</text><text x='324' y='112' font-size='12' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Band rack</text><text x='180' y='150' font-size='12' text-anchor='middle' font-weight='bold' fill='#b5523b' font-family='Helvetica,Arial,sans-serif'>Heavy zone: low, rated, against a wall</text><rect x='40' y='180' width='440' height='64' rx='0' fill='#e8f0e0' stroke='#5b6a4a' stroke-width='1.5' stroke-dasharray='6 4'/><text x='260' y='218' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Keep clear: the path from storage to the exercise spot</text><rect x='250' y='272' width='190' height='86' rx='0' fill='#f4f7ee' stroke='#5b6a4a' stroke-width='1.5' stroke-dasharray='6 4'/><text x='345' y='320' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Exercise spot</text><text x='345' y='338' font-size='12' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>(unrolled mat)</text><rect x='500' y='260' width='160' height='100' rx='0' fill='#cfd6dc' stroke='#8a949c' stroke-width='1.5'/><text x='580' y='314' font-size='13' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Sofa</text><rect x='60' y='376' width='64' height='8' rx='0' fill='#8a6d3b' stroke='none' stroke-width='1'/><text x='92' y='368' font-size='12' text-anchor='middle' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Door</text><text x='20' y='404' font-size='12' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Tape test: mark every footprint on the floor for a few days before you buy.</text></svg>