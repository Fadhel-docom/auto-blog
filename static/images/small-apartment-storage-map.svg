<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t5 d5"><title id="t5">Small apartment zone map</title><desc id="d5">Top view of a small apartment with an entry zone, kitchen zone, sleeping zone and living zone, each with a short storage note, joined by a clear walking path.</desc><rect width="800" height="400" fill="#fbf7f1"/><rect x="40" y="40" width="480" height="330" rx="0" fill="#fffdf9" stroke="#5b4a3a" stroke-width="6"/><rect x="46" y="46" width="150" height="120" rx="4" fill="#e7f0d9" stroke="#6f9a3a" stroke-width="3"/><text x="121" y="100" font-size="18" font-weight="bold" fill="#456b1d" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Entry</text><text x="121" y="124" font-size="14" font-weight="normal" fill="#456b1d" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">hooks, tray, shoes</text><rect x="320" y="46" width="194" height="120" rx="4" fill="#f3dccf" stroke="#b5683c" stroke-width="3"/><text x="417" y="100" font-size="18" font-weight="bold" fill="#8d4a22" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Kitchen</text><text x="417" y="124" font-size="14" font-weight="normal" fill="#8d4a22" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">daily tools only</text><rect x="46" y="250" width="200" height="114" rx="4" fill="#cfe3ea" stroke="#3d6f80" stroke-width="3"/><text x="146" y="300" font-size="18" font-weight="bold" fill="#24505f" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Sleep</text><text x="146" y="324" font-size="14" font-weight="normal" fill="#24505f" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">under-bed: rare items</text><rect x="300" y="230" width="214" height="134" rx="4" fill="#fff2b8" stroke="#c8a600" stroke-width="3"/><text x="407" y="290" font-size="18" font-weight="bold" fill="#7a6400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Living</text><text x="407" y="314" font-size="14" font-weight="normal" fill="#7a6400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">slim tall unit, anchored</text><path d="M121 170 C 130 210, 200 215, 300 205" fill="none" stroke="#2e8b57" stroke-width="4" stroke-dasharray="10 7"/><rect x="550" y="40" width="220" height="330" rx="10" fill="#fff" stroke="#d9cdbd" stroke-width="2"/><text x="570" y="74" font-size="19" font-weight="bold" fill="#3b2f23" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Rules of the map</text><text x="570" y="108" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">One zone per item</text><text x="570" y="138" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Green path stays clear</text><text x="570" y="168" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Reserve stock: one bin,</text><text x="570" y="198" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">one place</text><text x="570" y="228" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Tall pieces: anchored,</text><text x="570" y="258" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">never near the door</text></svg>