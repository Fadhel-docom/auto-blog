<svg xmlns="http://www.w3.org/2000/svg" width="700" height="590" viewBox="0 0 700 590" role="img" aria-labelledby="t d"><title id="t">Measure before buying storage</title><desc id="d">Top view of a washer and dryer with dashed door-swing arcs in front of each machine, and a two-column checklist of eight measurements to record.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C4622D"/></marker></defs><rect width="700" height="590" rx="24" fill="#F6F1E8"/><text x="40" y="48" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1F3A34" text-anchor="start">Measure before buying storage</text><text x="40" y="78" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5E6B66" text-anchor="start">The usable working area is more than the empty floor you can see.</text><rect x="150" y="122" width="150" height="100" rx="8" fill="#FFFFFF" stroke="#1F3A34" stroke-width="3"/><text x="225" y="178" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F3A34" text-anchor="middle">Washer</text><rect x="330" y="122" width="150" height="100" rx="8" fill="#FFFFFF" stroke="#1F3A34" stroke-width="3"/><text x="405" y="178" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F3A34" text-anchor="middle">Dryer</text><path d="M165 222 A60 60 0 0 0 285 222" fill="none" stroke="#C4622D" stroke-width="3" stroke-dasharray="7 5"/><path d="M345 222 A60 60 0 0 0 465 222" fill="none" stroke="#C4622D" stroke-width="3" stroke-dasharray="7 5"/><text x="225" y="272" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#C4622D" text-anchor="middle">Door swing</text><text x="405" y="272" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#C4622D" text-anchor="middle">Door swing</text><text x="525" y="178" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="start">Gaps beside</text><text x="525" y="198" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5E6B66" text-anchor="start">the machines</text><line x1="485" y1="172" x2="515" y2="172" stroke="#5E6B66" stroke-width="2"/><circle cx="48" cy="313" r="5" fill="#2F7F79"/><text x="66" y="318" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1F3A34" text-anchor="start">Room width and depth</text><circle cx="48" cy="349" r="5" fill="#2F7F79"/><text x="66" y="354" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1F3A34" text-anchor="start">Floor to ceiling</text><circle cx="48" cy="385" r="5" fill="#2F7F79"/><text x="66" y="390" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1F3A34" text-anchor="start">Top of the machines to ceiling</text><circle cx="48" cy="421" r="5" fill="#2F7F79"/><text x="66" y="426" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1F3A34" text-anchor="start">Width and depth of gaps beside</text><text x="66" y="448" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1F3A34" text-anchor="start">the machines</text><circle cx="374" cy="313" r="5" fill="#2F7F79"/><text x="392" y="318" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1F3A34" text-anchor="start">Existing shelf depth</text><circle cx="374" cy="349" r="5" fill="#2F7F79"/><text x="392" y="354" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1F3A34" text-anchor="start">Door and cabinet swing</text><circle cx="374" cy="385" r="5" fill="#2F7F79"/><text x="392" y="390" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1F3A34" text-anchor="start">Space around a utility sink</text><circle cx="374" cy="421" r="5" fill="#2F7F79"/><text x="392" y="426" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1F3A34" text-anchor="start">Outlets, water lines, vents and</text><text x="392" y="448" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1F3A34" text-anchor="start">trim</text><rect x="40" y="488" width="620" height="68" rx="14" fill="#1F3A34"/><text x="56" y="517" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#F6F1E8" text-anchor="start">Leave enough room to open every appliance door fully without</text><text x="56" y="541" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#F6F1E8" text-anchor="start">twisting around storage.</text></svg>
