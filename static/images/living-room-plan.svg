<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d"><title id="t">A 12 by 10 ft living room, zoned</title><desc id="d">Top-down plan of a small living room: a shallow media console on one wall, a sofa on the opposite wall, a coffee table between them and a 36 inch clear walking path along one side.</desc><rect width="800" height="560" fill="#faf6ef"/><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5522f"/></marker></defs><text x="400.0" y="36" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#23363a">A 12 by 10 ft living room, zoned</text><text x="400.0" y="60" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#55696a">Top view, planning example: furniture on two walls, one clear path along the side</text><rect x="60" y="90" width="518.4" height="432.0" fill="#fff" stroke="#23363a" stroke-width="3"/><rect x="448.8" y="90.0" width="129.6" height="432.0" rx="4" fill="#e6efd2" stroke="#2f6f62" stroke-width="1.5"/><text x="513.6" y="306.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#23363a">Keep clear</text><text x="513.6" y="324.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#23363a">walking path</text><rect x="146.4" y="90.0" width="259.2" height="57.6" rx="4" fill="#dbe9e4" stroke="#2f6f62" stroke-width="1.5"/><text x="276.0" y="123.8" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Media console + TV</text><rect x="189.6" y="270.0" width="172.8" height="64.8" rx="4" fill="#f3e3c8" stroke="#b5522f" stroke-width="1.5"/><text x="276.0" y="307.4" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Coffee table</text><rect x="103.2" y="392.4" width="302.4" height="129.6" rx="4" fill="#dbe9e4" stroke="#2f6f62" stroke-width="1.5"/><text x="254.4" y="462.2" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#23363a">Sofa</text><line x1="448.8" y1="198.0" x2="578.4" y2="198.0" stroke="#b5522f" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/><rect x="479.6" y="188.0" width="68" height="20" rx="4" fill="#faf6ef"/><text x="513.6" y="203.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#b5522f">36 in</text><line x1="276.0" y1="334.8" x2="276.0" y2="392.40000000000003" stroke="#b5522f" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/><rect x="242.0" y="353.6" width="68" height="20" rx="4" fill="#faf6ef"/><text x="276.0" y="368.6" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#b5522f">16 in</text><line x1="412.8" y1="90" x2="412.8" y2="147.6" stroke="#b5522f" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/><rect x="378.8" y="108.8" width="68" height="20" rx="4" fill="#faf6ef"/><text x="412.8" y="123.8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#b5522f">16 in</text><text x="620" y="150" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#23363a">How to read it</text><text x="620" y="176" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#55696a">Storage sits on two walls only.</text><text x="620" y="196" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#55696a">The side strip stays empty so</text><text x="620" y="216" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#55696a">you can walk through the room</text><text x="620" y="236" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#55696a">without turning sideways.</text><text x="620" y="256" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#55696a"></text><text x="620" y="276" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#55696a">Sizes are a planning example,</text><text x="620" y="296" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#55696a">not a code requirement.</text></svg>