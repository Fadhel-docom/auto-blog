<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
<title id="title">Daily and expanded table footprints</title><desc id="desc">Two top-down sketches compare a compact daily table with an expanded table. Retest chair positions and circulation in each state.</desc>
<rect width="1000" height="520" fill="#fff"/><text x="250" y="45" text-anchor="middle" font-family="Arial" font-size="26" fill="#37443b">Daily position</text><text x="750" y="45" text-anchor="middle" font-family="Arial" font-size="26" fill="#37443b">Expanded position</text><rect x="60" y="80" width="380" height="360" fill="#f8f5ee" stroke="#8c9a8c" stroke-width="3"/><rect x="560" y="80" width="380" height="360" fill="#f8f5ee" stroke="#8c9a8c" stroke-width="3"/><rect x="160" y="190" width="180" height="130" rx="8" fill="#d7b58c" stroke="#9b7955" stroke-width="3"/><rect x="205" y="125" width="90" height="48" rx="8" fill="#9aa99a"/><rect x="205" y="338" width="90" height="48" rx="8" fill="#9aa99a"/><rect x="620" y="190" width="260" height="130" rx="8" fill="#d7b58c" stroke="#9b7955" stroke-width="3"/><rect x="705" y="125" width="90" height="48" rx="8" fill="#9aa99a"/><rect x="705" y="338" width="90" height="48" rx="8" fill="#9aa99a"/><rect x="590" y="230" width="25" height="50" rx="5" fill="#9aa99a"/><rect x="885" y="230" width="25" height="50" rx="5" fill="#9aa99a"/><text x="250" y="475" text-anchor="middle" font-family="Arial" font-size="18" fill="#58655b">Mark table + occupied seats + route</text><text x="750" y="475" text-anchor="middle" font-family="Arial" font-size="18" fill="#58655b">Repeat the complete fit test</text></svg>