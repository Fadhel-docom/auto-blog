<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t6 d6"><title id="t6">Reserve storage limit</title><desc id="d6">Side view of shelves: daily items at eye level, weekly items on a lower shelf and reserve stock limited to one labeled bin.</desc><rect width="800" height="400" fill="#fbf7f1"/><rect x="60" y="40" width="300" height="330" rx="0" fill="#fffdf9" stroke="#5b4a3a" stroke-width="6"/><rect x="76" y="60" width="268" height="76" rx="4" fill="#d4e7ee" stroke="#5b4a3a" stroke-width="2"/><text x="210" y="106" font-size="18" font-weight="bold" fill="#2b2b2b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Daily: eye level</text><rect x="76" y="150" width="268" height="76" rx="4" fill="#e7f0d9" stroke="#5b4a3a" stroke-width="2"/><text x="210" y="196" font-size="18" font-weight="bold" fill="#2b2b2b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Weekly: lower shelf</text><rect x="76" y="240" width="268" height="76" rx="4" fill="#f3dccf" stroke="#5b4a3a" stroke-width="2"/><text x="210" y="286" font-size="18" font-weight="bold" fill="#2b2b2b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Reserve: ONE bin</text><rect x="420" y="40" width="350" height="330" rx="10" fill="#fff" stroke="#d9cdbd" stroke-width="2"/><text x="440" y="74" font-size="19" font-weight="bold" fill="#3b2f23" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Set a reserve limit</text><text x="440" y="108" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Spare soap, cleaners, tools:</text><text x="440" y="136" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">one labeled bin per category.</text><text x="440" y="164" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">When the bin is full,</text><text x="440" y="192" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">stop buying more.</text><text x="440" y="220" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Before restocking, finish</text><text x="440" y="248" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">what is on the daily shelf.</text></svg>