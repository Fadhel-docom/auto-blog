<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d"><title id="t">Four stations for a small kitchen</title><desc id="d">Four cards showing the cabinet slide, door bag, counter crock and slim gap station, with what each holds and its rules.</desc><rect width="800" height="560" fill="#faf6ef"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f62"/></marker></defs><text x="400" y="36" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#23363a">Four stations for a small kitchen</text><text x="400" y="60" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#55696a">What each station holds, and its rules</text><rect x="20" y="90" width="175" height="380" rx="10" fill="#fff" stroke="#23363a" stroke-width="2"/><rect x="20" y="90" width="175" height="50" rx="10" fill="#e6efd2" stroke="#2f6f62" stroke-width="2"/><text x="107" y="121" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#23363a">Cabinet slide</text><text x="107" y="170" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2f6f62">Holds</text><text x="107" y="190" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Trash and recycling</text><text x="107" y="206" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">bins</text><text x="107" y="260" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#b5522f">Rules</text><text x="107" y="284" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Equal bins for fresh food</text><line x1="50" y1="296" x2="165" y2="296" stroke="#e4ddd0" stroke-width="1"/><text x="107" y="324" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Fold liner over the rim</text><line x1="50" y1="336" x2="165" y2="336" stroke="#e4ddd0" stroke-width="1"/><text x="107" y="364" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Keep the slide clear</text><rect x="215" y="90" width="175" height="380" rx="10" fill="#fff" stroke="#23363a" stroke-width="2"/><rect x="215" y="90" width="175" height="50" rx="10" fill="#e6efd2" stroke="#2f6f62" stroke-width="2"/><text x="302" y="121" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#23363a">Door bag</text><text x="302" y="170" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2f6f62">Holds</text><text x="302" y="190" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Spare liners, flat</text><text x="302" y="206" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">paper</text><text x="302" y="260" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#b5522f">Rules</text><text x="302" y="284" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Clear hinge and shelf edge</text><line x1="245" y1="296" x2="360" y2="296" stroke="#e4ddd0" stroke-width="1"/><text x="302" y="324" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Nothing heavy</text><line x1="245" y1="336" x2="360" y2="336" stroke="#e4ddd0" stroke-width="1"/><text x="302" y="364" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Flatten boxes first</text><rect x="410" y="90" width="175" height="380" rx="10" fill="#fff" stroke="#23363a" stroke-width="2"/><rect x="410" y="90" width="175" height="50" rx="10" fill="#e6efd2" stroke="#2f6f62" stroke-width="2"/><text x="497" y="121" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#23363a">Counter crock</text><text x="497" y="170" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2f6f62">Holds</text><text x="497" y="190" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Food scraps, with a</text><text x="497" y="206" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">lid</text><text x="497" y="260" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#b5522f">Rules</text><text x="497" y="284" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Near the cutting board</text><line x1="440" y1="296" x2="555" y2="296" stroke="#e4ddd0" stroke-width="1"/><text x="497" y="324" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Empty every few days</text><line x1="440" y1="336" x2="555" y2="336" stroke="#e4ddd0" stroke-width="1"/><text x="497" y="364" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Only with a program</text><rect x="605" y="90" width="175" height="380" rx="10" fill="#fff" stroke="#23363a" stroke-width="2"/><rect x="605" y="90" width="175" height="50" rx="10" fill="#e6efd2" stroke="#2f6f62" stroke-width="2"/><text x="692" y="121" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#23363a">Slim gap</text><text x="692" y="170" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2f6f62">Holds</text><text x="692" y="190" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Returnables or</text><text x="692" y="206" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">overflow</text><text x="692" y="260" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#b5522f">Rules</text><text x="692" y="284" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Measure the gap first</text><line x1="635" y1="296" x2="750" y2="296" stroke="#e4ddd0" stroke-width="1"/><text x="692" y="324" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Keep fridge clearance</text><line x1="635" y1="336" x2="750" y2="336" stroke="#e4ddd0" stroke-width="1"/><text x="692" y="364" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Skip it if it blocks</text><text x="400" y="510" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#23363a">Two good stations beat four crowded ones</text></svg>