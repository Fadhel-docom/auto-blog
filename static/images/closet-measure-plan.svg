<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 490' role='img' aria-labelledby='t d'><title id='t'>Five closet measurements</title><desc id='d'>Front view of a reach-in closet with width, floor to shelf and floor to rod marked A, B and C, plus a key for depth and door clearance and typical rod heights.</desc><rect width='700' height='490' fill='#fbf9f4'/><text x='20' y='34' font-size='22' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Measure these five things first</text><rect x='70' y='60' width='230' height='350' rx='2' fill='#f6f2e8' stroke='#7a6a4f' stroke-width='3' opacity='1'/><rect x='70' y='90' width='230' height='9' rx='1' fill='#fff' stroke='#7a6a4f' stroke-width='2' opacity='1'/><line x1='70' y1='150' x2='300' y2='150' stroke='#b9b9b9' stroke-width='6' /><rect x='84' y='160' width='18' height='95' rx='2' fill='#8f9a7a' stroke='#5b6a4a' stroke-width='1.5' opacity='1'/><rect x='110' y='160' width='18' height='95' rx='2' fill='#e4dccb' stroke='#5b6a4a' stroke-width='1.5' opacity='1'/><rect x='136' y='160' width='18' height='95' rx='2' fill='#a9b8c9' stroke='#5b6a4a' stroke-width='1.5' opacity='1'/><rect x='162' y='160' width='18' height='95' rx='2' fill='#f4efe0' stroke='#5b6a4a' stroke-width='1.5' opacity='1'/><rect x='188' y='160' width='18' height='95' rx='2' fill='#8f9a7a' stroke='#5b6a4a' stroke-width='1.5' opacity='1'/><rect x='214' y='160' width='18' height='95' rx='2' fill='#e4dccb' stroke='#5b6a4a' stroke-width='1.5' opacity='1'/><rect x='240' y='160' width='18' height='95' rx='2' fill='#a9b8c9' stroke='#5b6a4a' stroke-width='1.5' opacity='1'/><rect x='266' y='160' width='18' height='95' rx='2' fill='#f4efe0' stroke='#5b6a4a' stroke-width='1.5' opacity='1'/><rect x='90' y='370' width='120' height='30' rx='2' fill='#c9a56e' stroke='#8a6a3b' stroke-width='2' opacity='1'/><line x1='70' y1='410' x2='300' y2='410' stroke='#8a6a3b' stroke-width='2' /><line x1='40' y1='150' x2='40' y2='410' stroke='#8a6a3b' stroke-width='2' /><line x1='33' y1='150' x2='47' y2='150' stroke='#8a6a3b' stroke-width='2' /><line x1='33' y1='410' x2='47' y2='410' stroke='#8a6a3b' stroke-width='2' /><circle cx='40' cy='278' r='13' fill='#8a6a3b'/><text x='40' y='284' font-size='17' text-anchor='middle' font-weight='bold' fill='#fff' font-family='Helvetica,Arial,sans-serif'>C</text><line x1='335' y1='99' x2='335' y2='410' stroke='#8a6a3b' stroke-width='2' /><line x1='328' y1='99' x2='342' y2='99' stroke='#8a6a3b' stroke-width='2' /><line x1='328' y1='410' x2='342' y2='410' stroke='#8a6a3b' stroke-width='2' /><circle cx='335' cy='255' r='13' fill='#8a6a3b'/><text x='335' y='261' font-size='17' text-anchor='middle' font-weight='bold' fill='#fff' font-family='Helvetica,Arial,sans-serif'>B</text><line x1='70' y1='438' x2='300' y2='438' stroke='#8a6a3b' stroke-width='2' /><line x1='70' y1='431' x2='70' y2='445' stroke='#8a6a3b' stroke-width='2' /><line x1='300' y1='431' x2='300' y2='445' stroke='#8a6a3b' stroke-width='2' /><circle cx='185' cy='462' r='13' fill='#8a6a3b'/><text x='185' y='468' font-size='17' text-anchor='middle' font-weight='bold' fill='#fff' font-family='Helvetica,Arial,sans-serif'>A</text><circle cx='395' cy='84' r='14' fill='#5b6a4a'/><text x='395' y='90' font-size='17' text-anchor='middle' font-weight='bold' fill='#fff' font-family='Helvetica,Arial,sans-serif'>A</text><text x='420' y='91' font-size='19' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Width, wall to wall</text><circle cx='395' cy='128' r='14' fill='#5b6a4a'/><text x='395' y='134' font-size='17' text-anchor='middle' font-weight='bold' fill='#fff' font-family='Helvetica,Arial,sans-serif'>B</text><text x='420' y='135' font-size='19' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Floor to shelf</text><circle cx='395' cy='172' r='14' fill='#5b6a4a'/><text x='395' y='178' font-size='17' text-anchor='middle' font-