<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d"><title id="t">How wide is a walkway? 24 to 36 inches compared</title><desc id="d">A scale from 0 to 48 inches showing 24 inches as a tight minimum, 30 to 36 inches as the usual design range between large furniture, and 36 inches as the ADA accessible-route minimum, which is not a rule for private homes.</desc><rect width="800" height="400" fill="#faf6ef"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f62"/></marker></defs><text x="400" y="36" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#23363a">Walkway width: what each number means</text><text x="400" y="60" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#55696a">Clear width between furniture, measured at the narrowest point</text><rect x="80" y="150" width="312" height="60" fill="#f3d3c8" stroke="#23363a" stroke-width="2"/><text x="236.0" y="185" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#23363a">Too tight</text><rect x="392" y="150" width="78" height="60" fill="#f6e6b8" stroke="#23363a" stroke-width="2"/><text x="431.0" y="185" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#23363a">Pinch only</text><rect x="470" y="150" width="78" height="60" fill="#cfe3c3" stroke="#23363a" stroke-width="2"/><text x="509.0" y="185" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#23363a">Best range</text><rect x="548" y="150" width="156" height="60" fill="#a9d1bf" stroke="#23363a" stroke-width="2"/><text x="626.0" y="185" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#23363a">Roomy</text><line x1="80" y1="210" x2="80" y2="224" stroke="#23363a" stroke-width="2"/><text x="80" y="242" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#23363a">0 in</text><line x1="236" y1="210" x2="236" y2="224" stroke="#23363a" stroke-width="2"/><text x="236" y="242" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#23363a">12 in</text><line x1="392" y1="210" x2="392" y2="224" stroke="#23363a" stroke-width="2"/><text x="392" y="242" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#23363a">24 in</text><line x1="470" y1="210" x2="470" y2="224" stroke="#23363a" stroke-width="2"/><text x="470" y="242" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#23363a">30 in</text><line x1="548" y1="210" x2="548" y2="224" stroke="#23363a" stroke-width="2"/><text x="548" y="242" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#23363a">36 in</text><line x1="704" y1="210" x2="704" y2="224" stroke="#23363a" stroke-width="2"/><text x="704" y="242" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#23363a">48 in</text><line x1="496" y1="150" x2="496" y2="136" stroke="#b5522f" stroke-width="2"/><text x="496" y="128" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#b5522f">32 in: ADA exception, 24 in long at most</text><rect x="40" y="268" width="220" height="100" rx="10" fill="#fff" stroke="#b5522f" stroke-width="2"/><text x="150" y="296" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#b5522f">24 in</text><text x="150" y="318" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Lowest figure designers give</text><text x="150" y="334" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">for tight rooms. Anything less</text><text x="150" y="350" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">feels cramped.</text><rect x="290" y="268" width="220" height="100" rx="10" fill="#fff" stroke="#2f6f62" stroke-width="2"/><text x="400" y="296" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2f6f62">30–36 in</text><text x="400" y="318" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">Designer advice between large</text><text x="400" y="334" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">furniture pieces. Aim for 36</text><text x="400" y="350" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">where the room allows.</text><rect x="540" y="268" width="220" height="100" rx="10" fill="#fff" stroke="#23363a" stroke-width="2"/><text x="650" y="296" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#23363a">36 in</text><text x="650" y="318" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">ADA minimum for accessible</text><text x="650" y="334" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">routes. Not a rule for</text><text x="650" y="350" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#23363a">ordinary private homes.</text><text x="400" y="390" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#55696a">Sources: Homes &amp; Gardens designer advice; 2010 ADA Standards 403.5.1. Not to scale between cards.</text></svg>