<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440"><rect width="700" height="440" fill="#F6F1E8"/><defs>
<marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C4622D"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#C4622D" stroke-width="2" opacity="0.35"/></pattern>
</defs><text x="350" y="40" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="24" fill="#1F3A34" text-anchor="middle" font-weight="bold" >Worked example: 30-inch cabinet, 4-inch pipe</text><rect x="80" y="140" width="540" height="190" fill="#fff" stroke="#1F3A34" stroke-width="5"/><rect x="314" y="140" width="72" height="190" fill="#8FA3B0"/><text x="350.0" y="240" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold" >pipe</text><text x="350.0" y="266" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold" >4 in</text><rect x="84.5" y="200" width="225.0" height="120" rx="12" fill="#DCEBDD" stroke="#2F7F79" stroke-width="4"/><rect x="390.5" y="200" width="225.0" height="120" rx="12" fill="#F3E3D3" stroke="#C4622D" stroke-width="4"/><text x="197.0" y="275" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="24" fill="#1F3A34" text-anchor="middle" font-weight="bold" >bin 12½ in</text><text x="503.0" y="275" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="24" fill="#1F3A34" text-anchor="middle" font-weight="bold" >bin 12½ in</text><line x1="80" y1="108" x2="620" y2="108" stroke="#C4622D" stroke-width="3" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="350" y="100" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#1F3A34" text-anchor="middle" font-weight="normal" >30 in inside width</text><line x1="80" y1="365" x2="314" y2="365" stroke="#C4622D" stroke-width="3" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="197.0" y="400" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#1F3A34" text-anchor="middle" font-weight="normal" >13 in pocket</text><line x1="386" y1="365" x2="620" y2="365" stroke="#C4622D" stroke-width="3" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="503.0" y="400" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#1F3A34" text-anchor="middle" font-weight="normal" >13 in pocket</text><text x="350" y="431" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="21" fill="#5E6B66" text-anchor="middle" font-weight="normal" >(30 − 4) ÷ 2 = 13 in, minus ½ in for your hand = 12½ in</text></svg>