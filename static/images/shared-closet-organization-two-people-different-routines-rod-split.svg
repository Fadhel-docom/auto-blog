<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="t d">
<title id="t">Rod split for two people</title><desc id="d">A 72 inch closet rod split 36 and 36 inches leaves person A 4 inches short of the 40 inches needed, while a needs-based split gives A 44 inches, B 22 inches and 6 inches shared.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#37443b"/></marker></defs>
<rect width="1000" height="520" fill="#fff"/>
<text x="500" y="38" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#37443b">Rod allocation: 72 in of rod, 50/50 versus by need</text>
<text x="60" y="138" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#37443b">50/50</text>
<rect x="140" y="110" width="360" height="44" rx="0" fill="#cfd8c9" stroke="#4d6b55" stroke-width="2"/>
<text x="320.0" y="138" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#37443b">Person A 36 in</text>
<rect x="500" y="110" width="360" height="44" rx="0" fill="#e6e1d6" stroke="#4d6b55" stroke-width="2"/>
<text x="680.0" y="138" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#37443b">Person B 36 in</text>
<text x="740" y="176" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#b5533c">A needs 40 in of hanging</text>
<text x="740" y="200" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#b5533c">50/50 leaves 36: 4 in short</text>
<text x="60" y="246" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#37443b">By need</text>
<rect x="140" y="218" width="440" height="44" rx="0" fill="#cfd8c9" stroke="#4d6b55" stroke-width="2"/>
<text x="360.0" y="246" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#37443b">A 44 in</text>
<rect x="580" y="218" width="220" height="44" rx="0" fill="#e6e1d6" stroke="#4d6b55" stroke-width="2"/>
<text x="690.0" y="246" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#37443b">B 22 in</text>
<rect x="800" y="218" width="60" height="44" rx="0" fill="#f1ece0" stroke="#4d6b55" stroke-width="2"/>
<text x="830.0" y="246" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#37443b">6</text>
<text x="500" y="330" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#37443b">Inventory: A hangs 40 garments, B hangs 18; allow about 1 in of rod per garment as a starting point.</text>
<text x="500" y="360" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#37443b">40 + 18 = 58 in of 72; 14 in left: A 44 + B 22 + shared 6 = 72 in.</text>
<text x="500" y="392" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#58655b">Metric: 72 in = 183 cm; 44 in = 112 cm; 22 in = 56 cm.</text>
<text x="500" y="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#58655b">Hanger spacing is an assumption for the example. Measure your own garments, especially coats and long dresses.</text>

</svg>
