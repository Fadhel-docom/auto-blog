<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 470' role='img' aria-labelledby='t d'><title id='t'>Magnet test spots on a refrigerator</title><desc id='d'>Front view of a refrigerator door and side panel with four numbered test spots: spot 1 slides off, spot 2 holds weakly, spots 3 and 4 hold firmly.</desc><rect width='700' height='470' fill='#fbf9f4'/><text x='20' y='30' font-size='21' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Test every spot with a strong magnet</text><rect x='60' y='60' width='170' height='340' rx='6' fill='#d8d8d8' stroke='#7a7a7a' stroke-width='3' opacity='1' /><text x='145' y='425' font-size='18' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Door</text><rect x='250' y='60' width='90' height='340' rx='6' fill='#cfcfcf' stroke='#7a7a7a' stroke-width='3' opacity='1' /><text x='295' y='425' font-size='18' text-anchor='middle' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Side</text><circle cx='110' cy='150' r='17' fill='#c0563f'/><text x='110' y='156' font-size='17' text-anchor='middle' font-weight='bold' fill='#fff' font-family='Helvetica,Arial,sans-serif'>1</text><circle cx='180' cy='300' r='17' fill='#d9a441'/><text x='180' y='306' font-size='17' text-anchor='middle' font-weight='bold' fill='#fff' font-family='Helvetica,Arial,sans-serif'>2</text><circle cx='295' cy='130' r='17' fill='#5b8a4a'/><text x='295' y='136' font-size='17' text-anchor='middle' font-weight='bold' fill='#fff' font-family='Helvetica,Arial,sans-serif'>3</text><circle cx='295' cy='280' r='17' fill='#5b8a4a'/><text x='295' y='286' font-size='17' text-anchor='middle' font-weight='bold' fill='#fff' font-family='Helvetica,Arial,sans-serif'>4</text><text x='370' y='80' font-size='19' text-anchor='start' font-weight='bold' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Hold the magnet at each spot</text><text x='370' y='106' font-size='19' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>where the rack will sit.</text><circle cx='386' cy='170' r='11' fill='#5b8a4a'/><text x='408' y='177' font-size='18' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Holds firmly: use this spot</text><circle cx='386' cy='210' r='11' fill='#d9a441'/><text x='408' y='217' font-size='18' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Holds weakly: skip it</text><circle cx='386' cy='250' r='11' fill='#c0563f'/><text x='408' y='257' font-size='18' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Slides off: not magnetic</text><text x='370' y='310' font-size='18' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Door and side can differ.</text><text x='370' y='336' font-size='18' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Try both, then buy the rack.</text><text x='20' y='452' font-size='15' text-anchor='start' font-weight='normal' fill='#2f3a2f' font-family='Helvetica,Arial,sans-serif'>Example results only. Your fridge may behave differently.</text></svg>