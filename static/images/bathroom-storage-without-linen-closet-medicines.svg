<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="t d">
<title id="t">Where medicines belong</title><desc id="d">Three storage places compared: a bathroom cabinet where heat and moisture can damage medicines, and a bedroom drawer or kitchen cabinet away from the stove and sink; keep in original containers out of children's sight.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#37443b"/></marker></defs>
<rect width="1000" height="520" fill="#fff"/>
<text x="500" y="38" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#37443b">Medicines: pick the place by the label, not by habit</text>
<rect x="30" y="80" width="300" height="260" rx="12" fill="#fff3f0" stroke="#b5533c" stroke-width="3"/>
<text x="180" y="118" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#b5533c">Bathroom cabinet</text>
<text x="180" y="170" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#37443b">Heat and moisture from</text>
<text x="180" y="200" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#37443b">showers and sinks can damage</text>
<text x="180" y="230" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#37443b">medicines</text>
<rect x="350" y="80" width="300" height="260" rx="12" fill="#eef4ec" stroke="#4d6b55" stroke-width="3"/>
<text x="500" y="118" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#4d6b55">Bedroom dresser drawer</text>
<text x="500" y="170" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#37443b">Cool, dry place if the label</text>
<text x="500" y="200" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#37443b">allows</text>
<rect x="670" y="80" width="300" height="260" rx="12" fill="#eef4ec" stroke="#4d6b55" stroke-width="3"/>
<text x="820" y="118" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#4d6b55">Kitchen cabinet</text>
<text x="820" y="170" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#37443b">Away from the stove, sink and</text>
<text x="820" y="200" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#37443b">hot appliances</text>
<rect x="30" y="370" width="940" height="90" rx="10" fill="#f8f5ee" stroke="#8c9a8c" stroke-width="2"/>
<text x="500" y="404" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#37443b">Keep medicines in the original container and out of reach and out of sight of children.</text>
<text x="500" y="434" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#37443b">Follow label instructions, and ask a pharmacist when unsure.</text>
<text x="500" y="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#58655b">Storage guidance summarised from MedlinePlus (U.S. National Library of Medicine).</text>

</svg>
