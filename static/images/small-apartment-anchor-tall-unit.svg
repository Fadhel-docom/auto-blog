<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t13 d13"><title id="t13">Anchoring a tall storage unit</title><desc id="d13">Side view of a tall shelf unit against a wall. A strap runs from the top of the unit to a wall anchor, heavy items sit on the lowest shelves and light items on the top.</desc><rect width="800" height="380" fill="#fbf7f1"/><rect x="80" y="30" width="16" height="320" rx="0" fill="#d9cdbd" stroke="#8a6a3b" stroke-width="2"/><rect x="96" y="60" width="170" height="280" rx="0" fill="#e8d5b7" stroke="#8a6a3b" stroke-width="4"/><line x1="96" y1="130" x2="266" y2="130" stroke="#8a6a3b" stroke-width="3"/><line x1="96" y1="200" x2="266" y2="200" stroke="#8a6a3b" stroke-width="3"/><line x1="96" y1="270" x2="266" y2="270" stroke="#8a6a3b" stroke-width="3"/><rect x="110" y="262" width="60" height="60" rx="4" fill="#f3dccf" stroke="#b5683c" stroke-width="2"/><rect x="180" y="272" width="70" height="50" rx="4" fill="#f3dccf" stroke="#b5683c" stroke-width="2"/><rect x="110" y="84" width="40" height="40" rx="4" fill="#ffffff" stroke="#8a6a3b" stroke-width="2"/><path d="M96 70 L180 70 L266 66" fill="none" stroke="#c0392b" stroke-width="4"/><circle cx="96" cy="70" r="7" fill="#c0392b"/><rect x="300" y="30" width="470" height="320" rx="10" fill="#fff" stroke="#d9cdbd" stroke-width="2"/><text x="320" y="64" font-size="19" font-weight="bold" fill="#3b2f23" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Anchor a tall unit</text><text x="320" y="98" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Red strap: top of the unit to a</text><text x="320" y="128" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">wall anchor or stud, using the</text><text x="320" y="158" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">kit and the maker's instructions</text><text x="320" y="188" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Heavy items on the lowest shelves</text><text x="320" y="218" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Light items high</text><text x="320" y="248" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Never rely on weight alone</text><text x="320" y="278" font-size="16" font-weight="normal" fill="#2b2b2b" text-anchor="start" font-family="Arial, Helvetica, sans-serif">to keep it upright</text></svg>