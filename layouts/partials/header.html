{{ $homeURL := site.Home.RelPermalink }}

<header class="site-header">
  <div class="site-container">
    <div class="site-header-inner">

      <a href="{{ $homeURL }}" class="site-brand" aria-label="{{ .Site.Title }} home">
        <svg
          class="site-logo"
          viewBox="0 0 48 48"
          role="img"
          aria-labelledby="logo-title logo-desc"
        >
          <title id="logo-title">Home Organization Ideas</title>
          <desc id="logo-desc">Minimal geometric home organization logo</desc>
          <path
            class="site-logo-mark"
            d="M7 21.5 24 7l17 14.5M11 20v21h26V20M16 41V27h16v14M15 23h6M27 23h6"
          />
          <path
            class="site-logo-accent"
            d="M17 17h14v4H17zM17 24h5v3h-5zM27 24h4v3h-4z"
          />
        </svg>

        <span class="site-brand-text">
          <span class="site-title">{{ .Site.Title }}</span>
          <span class="site-description">{{ .Site.Params.description }}</span>
        </span>
      </a>

      <button
        class="nav-toggle"
        id="nav-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="primary-navigation"
        aria-label="Open menu"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav
        class="site-nav"
        id="primary-navigation"
        aria-label="Primary navigation"
      >
        <a href="{{ $homeURL }}" class="site-nav-link">Home</a>
        <a href="{{ printf "%scategories/" $homeURL }}" class="site-nav-link">Categories</a>
        <a href="{{ printf "%sabout/" $homeURL }}" class="site-nav-link">About</a>
        <a href="{{ printf "%s#site-search" $homeURL }}" class="site-nav-link">Search</a>
      </nav>

    </div>
  </div>
</header>
