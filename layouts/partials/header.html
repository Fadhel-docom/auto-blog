<header class="site-header">

  <div class="site-container">

    <div class="site-header-inner">

      <a
        href="{{ "/" | relURL }}"
        class="site-brand"
        aria-label="{{ .Site.Title }} home"
      >

        <svg
          class="site-logo"
          viewBox="0 0 48 48"
          role="img"
          aria-labelledby="logo-title logo-desc"
        >

          <title id="logo-title">
            Home Organization Ideas
          </title>

          <desc id="logo-desc">
            Minimal geometric home organization logo
          </desc>

          <path
            class="site-logo-mark"
            d="M8 22.5 24 8l16 14.5"
          />

          <path
            class="site-logo-mark"
            d="M12 20v19h24V20"
          />

          <path
            class="site-logo-mark"
            d="M18 39V27h12v12"
          />

          <path
            class="site-logo-mark"
            d="M15 24h6M27 24h6"
          />

          <rect
            class="site-logo-accent"
            x="16"
            y="15"
            width="5"
            height="5"
            rx="1"
          />

          <rect
            class="site-logo-accent"
            x="27"
            y="15"
            width="5"
            height="5"
            rx="1"
          />

        </svg>

        <span class="site-brand-text">

          <span class="site-title">
            {{ .Site.Title }}
          </span>

          <span class="site-description">
            {{ .Site.Params.description }}
          </span>

        </span>

      </a>


      <nav
        class="site-nav"
        aria-label="Primary navigation"
      >

        <a
          href="{{ "/" | relURL }}"
          class="site-nav-link"
        >
          Home
        </a>

        <a
          href="{{ "/categories/" | relURL }}"
          class="site-nav-link"
        >
          Categories
        </a>

        <a
          href="{{ "/about/" | relURL }}"
          class="site-nav-link"
        >
          About
        </a>

        <a
          href="{{ "/#site-search" | relURL }}"
          class="site-nav-link"
        >
          Search
        </a>

      </nav>

    </div>

  </div>

</header>
