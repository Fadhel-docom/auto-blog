<div class="post-meta">
  <span class="post-meta-item">
    Published {{ .Date.Format "January 2, 2006" }}
  </span>
  <span class="post-meta-separator">·</span>
  <span class="post-meta-item">
    {{ .ReadingTime }} min read
  </span>
  <span class="post-meta-separator">·</span>
  <span class="post-meta-item">
    {{ .WordCount }} words
  </span>
  {{ if ne .Lastmod .Date }}
  <span class="post-meta-separator">·</span>
  <span class="post-meta-item post-updated">
    Updated {{ .Lastmod.Format "January 2, 2006" }}
  </span>
  {{ end }}
</div>
