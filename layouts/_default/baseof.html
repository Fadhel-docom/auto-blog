<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    {{ if .IsHome }}
      {{ .Site.Title }}
    {{ else }}
      {{ .Title }} | {{ .Site.Title }}
    {{ end }}
  </title>

  <meta
    name="description"
    content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}"
  >

  <meta
    name="google-site-verification"
    content="tgAG8aMPl7dBqyp5e4JPtjgKdiwXLdQ967R4OVcW-eM"
  >

  <link
    rel="icon"
    type="image/svg+xml"
    href="{{ "favicon.svg" | relURL }}"
  >

  <link
    rel="apple-touch-icon"
    href="{{ "favicon.svg" | relURL }}"
  >

  <link
    rel="canonical"
    href="{{ .Permalink }}"
  >

  <link
    rel="stylesheet"
    href="{{ "css/custom.css" | relURL }}"
  >

  <link
    rel="stylesheet"
    href="{{ "css/competitive.css" | relURL }}"
  >

  {{ if .IsPage }}
  <meta property="og:type" content="{{ if eq .Section "posts" }}article{{ else }}website{{ end }}">
  {{ else }}
  <meta property="og:type" content="website">
  {{ end }}

  <meta property="og:title" content="{{ .Title }}">
  <meta
    property="og:description"
    content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}"
  >
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:site_name" content="{{ .Site.Title }}">

  {{ with .Params.image }}
  <meta property="og:image" content="{{ . | absURL }}">
  {{ end }}

  {{ if .IsPage }}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "{{ if eq .Section "posts" }}BlogPosting{{ else }}WebPage{{ end }}",
    "author": {
      "@type": "Organization",
      "name": "{{ .Site.Params.author }}"
    },
    "dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}",
    "datePublished": "{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}",
    "description": {{ .Description | jsonify }},
    "headline": {{ .Title | jsonify }},
    "mainEntityOfPage": {
      "@id": "{{ .Permalink }}",
      "@type": "WebPage"
    },
    "publisher": {
      "@type": "Organization",
      "name": "{{ .Site.Title }}",
      "url": "{{ .Site.BaseURL }}"
    },
    "url": "{{ .Permalink }}"
    {{ with .Params.image }},
    "image": [
      "{{ . | absURL }}"
    ]
    {{ end }}
  }
  </script>
  {{ end }}

  <script
    data-goatcounter="https://fadhel-blog.goatcounter.com/count"
    async
    src="//gc.zgo.at/count.js"
  ></script>
</head>

<body>

  {{ partial "header.html" . }}

  <main class="site-main">
    <div class="site-container">
      {{ block "main" . }}{{ end }}
    </div>
  </main>

  <footer class="site-footer">
    <div class="site-container">
      <p>
        &copy; {{ now.Year }} {{ .Site.Title }}
      </p>
    </div>
  </footer>

</body>
</html>
