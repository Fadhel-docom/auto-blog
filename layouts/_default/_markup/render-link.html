{{- $dest := .Destination -}}
{{- if and (strings.HasPrefix $dest "/") (not (strings.HasPrefix $dest "//")) (not (strings.HasPrefix $dest "/auto-blog/")) -}}
  {{- $dest = strings.TrimPrefix "/" $dest | relURL -}}
{{- end -}}
<a href="{{ $dest | safeURL }}"{{ with .Title }} title="{{ . }}"{{ end }}{{ if strings.Contains .Destination "awin1.com" }} class="aff-btn"{{ end }}>{{ .Text | safeHTML }}</a>
