{{- $src := .Destination -}}
{{- $isExternal := or (strings.HasPrefix $src "http://") (strings.HasPrefix $src "https://") (strings.HasPrefix $src "data:") -}}
{{- if not $isExternal -}}
  {{- $src = printf "images/%s" (path.Base $src) | relURL -}}
{{- end -}}
<img src="{{ $src }}" alt="{{ .Text }}"{{ with .Title }} title="{{ .Title }}"{{ end }} loading="lazy" decoding="async">
