# ============================================================
# Base
# ============================================================

baseURL = "https://fadhel-docom.github.io/auto-blog/"
languageCode = "en-us"
title = "Home Organization Ideas"
enableRobotsTXT = true
enableGitInfo = false
timeZone = "UTC"
defaultContentLanguage = "en"
hasCJKLanguage = false

# ============================================================
# Author / Brand
# ============================================================

[params]
  description = "Practical home organization and small-space living ideas."
  author = "Home Organization Ideas Editorial"
  brand = "Home Organization Ideas"
  tagline = "Practical spaces. Better everyday living."
  keywords = [
    "home organization",
    "small space organization",
    "small apartment organization",
    "kitchen organization",
    "bathroom organization",
    "bedroom organization",
    "storage ideas",
    "decluttering",
    "renter friendly organization",
    "DIY storage"
  ]

  pinterest = "homeorganizationideas0164"
  tumblr = "homeorganizationideas.tumblr.com"
  goatcounter = "https://fadhel-blog.goatcounter.com/count"

[pagination]
  pagerSize = 12

[permalinks]
  posts = "/posts/:slug/"

[taxonomies]
  category = "categories"
  tag = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false
      hardWraps = false
      xhtml = false

  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

  [markup.highlight]
    noClasses = false

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]


[outputFormats.rss]
  isPlainText = true

[sitemap]
  changeFreq = "daily"
  priority = 0.5
  filename = "sitemap.xml"

[related]
  threshold = 20
  includeNewer = true
  toLower = true

  [[related.indices]]
    name = "tags"
    weight = 100

  [[related.indices]]
    name = "categories"
    weight = 80

  [[related.indices]]
    name = "date"
    weight = 10

[build]
  writeStats = false

[build.buildStats]
  enable = false

[server]
  [[server.headers]]
    for = "/**"
    [server.headers.values]
      Cache-Control = "no-store"

[frontmatter]
  date = ["date", "publishDate", "lastmod"]
  lastmod = ["lastmod", "date", "publishDate"]
  publishDate = ["publishDate", "date"]
  expiryDate = ["expiryDate"]